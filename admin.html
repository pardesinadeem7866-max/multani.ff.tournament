<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Multani.ff</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #07090e;
      --card-gradient: linear-gradient(135deg, #1b0a2a 0%, #3b0d3a 45%, #130a21 100%);
      --accent-pink: #c9186e;
      --accent-purple: #8b1368;
      --light-card-bg: #ffffff;
      --text-dark: #1e293b;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #0c111a; color: #fff; display: flex; justify-content: center; min-height: 100vh; padding-bottom: 90px; }
    .app-shell { width: 100%; max-width: 440px; background: #0b0f17; min-height: 100vh; position: relative; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; font-size: 13px; color: #94a3b8; }
    .status-left { font-weight: 600; color: #f1f5f9; font-size: 14px; }
    .status-right i { margin-left: 8px; font-size: 12px; }

    .vault-card {
      background: var(--card-gradient);
      border-radius: 26px;
      margin: 0 16px 14px 16px;
      padding: 22px 20px;
      box-shadow: 0 12px 30px rgba(139, 19, 104, 0.25);
      position: relative;
      border: 1px solid rgba(201, 24, 110, 0.2);
    }
    .vault-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .vault-label { font-size: 12px; color: #cbd5e1; opacity: 0.85; margin-bottom: 4px; }
    .vault-amount { font-size: 32px; font-weight: 800; color: #fff; }
    .vault-amount span { font-size: 18px; font-weight: 500; margin-right: 4px; color: #f472b6; }
    
    .vault-actions { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
    .btn-action-primary {
      background: linear-gradient(90deg, #d91b75, #a21262);
      border: none;
      color: #fff;
      padding: 9px 24px;
      border-radius: 25px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-action-secondary {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.4);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    .vault-sync { font-size: 10px; color: #cbd5e1; opacity: 0.7; margin-top: 14px; display: flex; align-items: center; gap: 6px; }

    .metrics-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 16px 14px 16px; }
    .metric-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 12px 10px;
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 96px;
    }
    .metric-header { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 700; color: #475569; }
    .metric-val { font-size: 18px; font-weight: 800; color: #0f172a; margin-top: 4px; }
    .metric-sub { font-size: 10px; color: #64748b; }

    .pill-center { display: flex; justify-content: center; margin-bottom: 14px; }
    .view-all-pill {
      background: linear-gradient(90deg, #dcfce7, #ccfbf1);
      color: #0f766e;
      border: none;
      padding: 6px 20px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .action-grid-box {
      background: #ffffff;
      border-radius: 24px;
      margin: 0 16px 18px 16px;
      padding: 16px 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      row-gap: 16px;
    }
    .grid-btn { display: flex; flex-direction: column; align-items: center; background: transparent; border: none; cursor: pointer; position: relative; }
    .grid-icon-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1.5px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 6px;
    }
    .grid-label { font-size: 10px; font-weight: 600; color: #334155; line-height: 1.2; width: 68px; text-align: center; }
    .grid-badge { position: absolute; top: -4px; right: 12px; background: #ef4444; color: #fff; font-size: 8px; padding: 2px 5px; border-radius: 10px; font-weight: bold; }

    .content-area { padding: 0 16px; margin-bottom: 20px; }
    .section-title { font-size: 13px; font-weight: 700; color: #cbd5e1; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    
    .req-card {
      background: #131b28;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .req-card-top { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: #38bdf8; margin-bottom: 8px; }
    .req-details { font-size: 11px; color: #cbd5e1; line-height: 1.6; margin-bottom: 10px; }
    .req-ss-holder { text-align: center; margin: 8px 0; background: #000; border-radius: 10px; padding: 4px; border: 1px dashed #334155; }
    .req-ss-holder img { max-width: 100%; max-height: 200px; border-radius: 8px; object-fit: contain; }
    .req-btn-row { display: flex; gap: 8px; margin-top: 8px; }
    .btn-approve { flex: 1; background: #10b981; color: #022c22; border: none; padding: 8px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .btn-reject { flex: 1; background: #ef4444; color: #fff; border: none; padding: 8px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }

    .tag-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .map-badge { padding: 2px 8px; background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 6px; font-size: 10px; font-weight: 700; }
    .rules-badge { padding: 2px 8px; background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 6px; font-size: 10px; font-weight: 600; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 1000;
    }
    .modal-overlay.active { display: flex; }
    .modal-sheet {
      background: #0f172a;
      width: 100%;
      max-width: 440px;
      border-radius: 24px 24px 0 0;
      padding: 20px;
      border-top: 1px solid #334155;
      max-height: 88vh;
      overflow-y: auto;
    }
    .modal-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; color: #f8fafc; display: flex; justify-content: space-between; }
    .form-group { margin-bottom: 10px; }
    .form-group label { font-size: 11px; color: #94a3b8; display: block; margin-bottom: 4px; }
    .form-group input, .form-group select {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 9px 12px;
      color: #fff;
      font-size: 12px;
      outline: none;
    }
    .btn-submit-modal {
      width: 100%;
      background: linear-gradient(90deg, #d91b75, #a21262);
      border: none;
      color: #fff;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      margin-top: 10px;
      cursor: pointer;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 440px;
      height: 68px;
      background: #e2f4ea;
      border-radius: 28px 28px 0 0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 10px;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.3);
      z-index: 99;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #1e293b;
      background: transparent;
      border: none;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .nav-item.active-pill {
      background: #0f172a;
      color: #fff;
      padding: 8px 18px;
      border-radius: 25px;
      flex-direction: row;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    
    <div class="top-bar">
      <div class="status-left"><i class="fa-solid fa-fire" style="color:#ef4444; margin-right:5px;"></i>Multani.ff Admin</div>
      <div class="status-right">
        <i class="fa-solid fa-wifi"></i>
        <i class="fa-solid fa-bolt"></i>
        <span>100%</span>
      </div>
    </div>

    <div class="vault-card">
      <div class="vault-top">
        <div>
          <div class="vault-label">Total Match Revenue</div>
          <div class="vault-amount"><span>Rs</span><span id="vaultRevenue">0</span></div>
        </div>
        <div class="vault-actions">
          <button class="btn-action-primary" onclick="openModal()">+ MATCH</button>
          <button class="btn-action-secondary" onclick="exportData()">BACKUP DATA</button>
        </div>
      </div>
      <div class="vault-sync">
        <span id="liveClock">--:--:--</span> • Free Fire Tournament Admin
        <i class="fa-solid fa-rotate-right" onclick="renderAll()"></i>
      </div>
    </div>

    <div class="metrics-row">
      <div class="metric-card">
        <div class="metric-header"><span>Active</span><i class="fa-solid fa-gamepad"></i></div>
        <div class="metric-val" id="metricMatches">0</div>
        <div class="metric-sub">Live Matches</div>
      </div>
      <div class="metric-card">
        <div class="metric-header"><span>Players</span><i class="fa-solid fa-users"></i></div>
        <div class="metric-val" id="metricPlayers">0</div>
        <div class="metric-sub">Approved Slots</div>
      </div>
      <div class="metric-card">
        <div class="metric-header"><span>Requests</span><i class="fa-solid fa-clock-rotate-left"></i></div>
        <div class="metric-val" id="metricPending">0</div>
        <div class="metric-sub">Needs Approval</div>
      </div>
    </div>

    <div class="pill-center">
      <button class="view-all-pill" onclick="showSection('matchesSection')">
        View All Tournaments <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>

    <!-- Quick Action Grid -->
    <div class="action-grid-box">
      <button class="grid-btn" onclick="openModal()">
        <div class="grid-icon-circle"><i class="fa-solid fa-circle-plus"></i></div>
        <span class="grid-label">Create Match</span>
      </button>

      <button class="grid-btn" onclick="promptRoomCreds()">
        <div class="grid-icon-circle"><i class="fa-solid fa-key"></i></div>
        <span class="grid-label">Set Room ID/Pass</span>
      </button>

      <button class="grid-btn" onclick="showSection('pendingSection')">
        <span class="grid-badge" id="badgePending">0</span>
        <div class="grid-icon-circle"><i class="fa-solid fa-receipt"></i></div>
        <span class="grid-label">Payment Approval</span>
      </button>

      <button class="grid-btn" onclick="banPlayerPrompt()">
        <div class="grid-icon-circle"><i class="fa-solid fa-user-slash"></i></div>
        <span class="grid-label">Ban Player</span>
      </button>

      <button class="grid-btn" onclick="showSection('matchesSection')">
        <div class="grid-icon-circle"><i class="fa-solid fa-list-check"></i></div>
        <span class="grid-label">Match Manager</span>
      </button>

      <button class="grid-btn" onclick="filterByMapPrompt()">
        <div class="grid-icon-circle"><i class="fa-solid fa-map-location-dot"></i></div>
        <span class="grid-label">Filter Map</span>
      </button>

      <!-- HELP DESK WITH NOTIFICATION BADGE -->
      <button class="grid-btn" onclick="showSection('supportSection')">
        <span class="grid-badge" id="badgeSupport" style="display:none; background:#25d366;">0</span>
        <div class="grid-icon-circle"><i class="fa-solid fa-headset" style="color:#25d366;"></i></div>
        <span class="grid-label">Help Messages</span>
      </button>

      <button class="grid-btn" onclick="clearCompletedMatches()">
        <div class="grid-icon-circle"><i class="fa-solid fa-trash-can"></i></div>
        <span class="grid-label">Cleanup Old</span>
      </button>
    </div>

    <!-- Section 1: Support / Help with Owner Messages -->
    <div class="content-area" id="supportSection" style="display:none;">
      <div class="section-title">
        <span><i class="fa-solid fa-comments" style="color:#25d366; margin-right:6px;"></i>Player Support Messages</span>
        <button onclick="clearAllSupportMsgs()" style="background:#ef4444; border:none; color:#fff; font-size:10px; padding:3px 8px; border-radius:4px; cursor:pointer;">Clear All</button>
      </div>
      <div id="supportCardsList"></div>
    </div>

    <!-- Section 2: Pending Approval -->
    <div class="content-area" id="pendingSection">
      <div class="section-title">
        <span>Payment Approvals (Pending)</span>
        <span style="color:#f59e0b;" id="countPending">0 Requests</span>
      </div>
      <div id="pendingCardsList"></div>
    </div>

    <!-- Section 3: Tournaments List -->
    <div class="content-area" id="matchesSection" style="display:none;">
      <div class="section-title">
        <span>Live & Upcoming Matches</span>
        <span style="color:#10b981;" id="countMatches">0</span>
      </div>
      <div id="matchesList"></div>
    </div>

    <!-- Bottom Bar -->
    <div class="bottom-bar">
      <button class="nav-item active-pill" onclick="switchNav(this, 'all')">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </button>
      <button class="nav-item" onclick="switchNav(this, 'matches')">
        <i class="fa-solid fa-trophy"></i>
        <span>Matches</span>
      </button>
      <button class="nav-item" onclick="switchNav(this, 'pending')">
        <i class="fa-solid fa-inbox"></i>
        <span>Requests</span>
      </button>
      <button class="nav-item" onclick="switchNav(this, 'support')">
        <i class="fa-solid fa-envelope"></i>
        <span>Help Msgs</span>
      </button>
    </div>

  </div>

  <!-- Create Match Modal -->
  <div class="modal-overlay" id="matchModal">
    <div class="modal-sheet">
      <div class="modal-title">
        <span>+ Naya Tournament Banayein</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeModal()"></i>
      </div>
      <div class="form-group">
        <label>Tournament Title</label>
        <input type="text" id="newTitle" placeholder="MATCH #3 (CS 4V4)">
      </div>
      <div class="form-group">
        <label>Match Type / Mode</label>
        <select id="newMode">
          <option value="Solo (Battle Royale)">Solo (Battle Royale)</option>
          <option value="Duo (Battle Royale)">Duo (Battle Royale)</option>
          <option value="Squad (Battle Royale)">Squad (Battle Royale)</option>
          <option value="Clash Squad 4v4">Clash Squad 4v4</option>
        </select>
      </div>
      <div class="form-group">
        <label><i class="fa-solid fa-map-location-dot" style="color:#f59e0b;"></i> Select Map (Free Fire)</label>
        <select id="newMap">
          <option value="Bermuda">Bermuda (Classic / Ranked)</option>
          <option value="Purgatory">Purgatory</option>
          <option value="Kalahari">Kalahari (Desert)</option>
          <option value="Alpine">Alpine (Snow)</option>
          <option value="NexTerra">NexTerra (Sci-Fi)</option>
          <option value="Clash Squad Arena">Clash Squad Arena</option>
        </select>
      </div>
      <div class="form-group">
        <label><i class="fa-solid fa-scroll" style="color:#38bdf8;"></i> Tournament Rules</label>
        <input type="text" id="newRules" placeholder="e.g. Gun Attributes Off, No Grenade" value="Gun Attributes Off | Headshot Only">
      </div>
      <div class="form-group">
        <label>Scheduled Time</label>
        <input type="text" id="newTime" placeholder="Tonight 09:30 PM">
      </div>
      <div class="form-group">
        <label>Entry Fee (Rs)</label>
        <input type="number" id="newFee" placeholder="50">
      </div>
      <div class="form-group">
        <label>Prize Pool (Rs)</label>
        <input type="number" id="newPrize" placeholder="400">
      </div>
      <div class="form-group">
        <label>Total Slots</label>
        <input type="number" id="newSlots" value="12">
      </div>
      <button class="btn-submit-modal" onclick="submitMatch()">Publish Tournament</button>
    </div>
  </div>

  <script>
    setInterval(() => {
      const now = new Date();
      document.getElementById('liveClock').innerText = now.toLocaleTimeString();
    }, 1000);

    function getTournaments() {
      return JSON.parse(localStorage.getItem('mff_tournaments')) || [];
    }

    function saveTournaments(data) {
      localStorage.setItem('mff_tournaments', JSON.stringify(data));
      renderAll();
    }

    let activeMapFilter = "All";

    function renderAll() {
      const tournaments = getTournaments();
      let totalRevenue = 0;
      let totalApprovedPlayers = 0;
      let pendingList = [];

      tournaments.forEach(m => {
        if (!m.players) m.players = [];
        m.players.forEach(p => {
          if (p.status === 'approved') {
            totalRevenue += Number(m.fee || 0);
            totalApprovedPlayers++;
          } else if (p.status === 'pending') {
            pendingList.push({ match: m, player: p });
          }
        });
      });

      document.getElementById('vaultRevenue').innerText = totalRevenue.toLocaleString();
      document.getElementById('metricMatches').innerText = tournaments.length;
      document.getElementById('metricPlayers').innerText = totalApprovedPlayers;
      document.getElementById('metricPending').innerText = pendingList.length;
      document.getElementById('countPending').innerText = `${pendingList.length} Requests`;
      document.getElementById('badgePending').innerText = pendingList.length;
      document.getElementById('countMatches').innerText = `${tournaments.length} Active`;

      // Render Help Messages
      const supportMsgs = JSON.parse(localStorage.getItem('mff_support_msgs')) || [];
      const supportContainer = document.getElementById('supportCardsList');
      const badgeSupport = document.getElementById('badgeSupport');
      
      if (supportMsgs.length > 0) {
        badgeSupport.style.display = 'block';
        badgeSupport.innerText = supportMsgs.length;
      } else {
        badgeSupport.style.display = 'none';
      }

      supportContainer.innerHTML = '';
      if (supportMsgs.length === 0) {
        supportContainer.innerHTML = `<div style="text-align:center; padding:20px; color:#64748b; font-size:12px; background:#131b28; border-radius:14px;">Koi naya help message nahi hai.</div>`;
      } else {
        supportMsgs.forEach((msg, idx) => {
          const mCard = document.createElement('div');
          mCard.className = 'req-card';
          mCard.innerHTML = `
            <div class="req-card-top" style="color:#25d366;">
              <span><i class="fa-solid fa-user"></i> ${msg.name}</span>
              <span style="font-size:10px; color:#94a3b8;">${msg.time}</span>
            </div>
            <div class="req-details">
              <strong>Contact:</strong> ${msg.contact}<br>
              <strong>Message:</strong> <div style="background:#090d14; padding:8px; border-radius:6px; margin-top:4px; color:#fff; border-left:2px solid #25d366;">${msg.message}</div>
            </div>
            <button class="btn-reject" style="width:100%;" onclick="deleteSupportMsg(${idx})"><i class="fa-solid fa-check"></i> Mark Resolved / Delete</button>
          `;
          supportContainer.appendChild(mCard);
        });
      }

      // Render Pending Verification Cards
      const reqContainer = document.getElementById('pendingCardsList');
      reqContainer.innerHTML = '';

      if (pendingList.length === 0) {
        reqContainer.innerHTML = `
          <div style="text-align:center; padding: 25px; color:#475569; font-size:12px; background:#131b28; border-radius:14px; border:1px dashed #1e293b;">
            <i class="fa-solid fa-circle-check" style="font-size:24px; color:#10b981; margin-bottom:8px; display:block;"></i>
            Koi pending verification request nahi hai!
          </div>`;
      } else {
        pendingList.forEach(item => {
          const card = document.createElement('div');
          card.className = 'req-card';
          card.innerHTML = `
            <div class="req-card-top">
              <span>${item.match.title}</span>
              <span style="color:#f59e0b;">Fee: Rs ${item.match.fee}</span>
            </div>
            <div class="tag-row">
              <span class="map-badge"><i class="fa-solid fa-map-pin"></i> ${item.match.map || 'Bermuda'}</span>
              <span class="rules-badge"><i class="fa-solid fa-scroll"></i> ${item.match.rules || 'Standard Rules'}</span>
            </div>
            <div class="req-details">
              <strong>Player Name:</strong> ${item.player.name}<br>
              <strong>FF UID:</strong> <span style="color:#38bdf8;">${item.player.uid}</span><br>
              <strong>Phone:</strong> ${item.player.phone || 'N/A'}<br>
              <strong>Submitted:</strong> ${item.player.time || 'Just now'}
            </div>
            <div class="req-ss-holder">
              <img src="${item.player.screenshot}" alt="Payment Screenshot" onerror="this.src='https://via.placeholder.com/300x120?text=No+Screenshot+Provided'">
            </div>
            <div class="req-btn-row">
              <button class="btn-approve" onclick="handlePlayerStatus('${item.match.id}', '${item.player.uid}', 'approved')"><i class="fa-solid fa-check"></i> Approve</button>
              <button class="btn-reject" onclick="handlePlayerStatus('${item.match.id}', '${item.player.uid}', 'rejected')"><i class="fa-solid fa-xmark"></i> Reject</button>
            </div>
          `;
          reqContainer.appendChild(card);
        });
      }

      // Render Matches List
      const matchesContainer = document.getElementById('matchesList');
      matchesContainer.innerHTML = '';

      const filteredMatches = activeMapFilter === "All" 
        ? tournaments 
        : tournaments.filter(m => (m.map || "Bermuda").toLowerCase() === activeMapFilter.toLowerCase());

      filteredMatches.forEach(m => {
        const approvedCount = m.players.filter(p => p.status === 'approved').length;
        const item = document.createElement('div');
        item.className = 'req-card';
        item.innerHTML = `
          <div class="req-card-top">
            <span>${m.title}</span>
            <span style="color:#10b981;">Rs ${m.prize} Prize</span>
          </div>
          <div class="tag-row">
            <span class="map-badge"><i class="fa-solid fa-map-pin"></i> ${m.map || 'Bermuda'}</span>
            <span class="rules-badge"><i class="fa-solid fa-scroll"></i> ${m.rules || 'Standard Rules'}</span>
          </div>
          <div class="req-details">
            <strong>Timing:</strong> ${m.time}<br>
            <strong>Filled Slots:</strong> ${approvedCount} / ${m.totalSlots}<br>
            <strong>Room ID:</strong> ${m.roomId || 'Not set'} | <strong>Pass:</strong> ${m.roomPass || 'Not set'}
          </div>
          <div class="req-btn-row">
            <button class="btn-approve" style="background:#334155; color:#fff;" onclick="setSpecificRoom('${m.id}')"><i class="fa-solid fa-key"></i> Room Pass</button>
            <button class="btn-reject" onclick="deleteMatch('${m.id}')"><i class="fa-solid fa-trash"></i> Delete</button>
          </div>
        `;
        matchesContainer.appendChild(item);
      });
    }

    function deleteSupportMsg(idx) {
      let supportMsgs = JSON.parse(localStorage.getItem('mff_support_msgs')) || [];
      supportMsgs.splice(idx, 1);
      localStorage.setItem('mff_support_msgs', JSON.stringify(supportMsgs));
      renderAll();
    }

    function clearAllSupportMsgs() {
      if (confirm('Tamam messages clear karne hain?')) {
        localStorage.removeItem('mff_support_msgs');
        renderAll();
      }
    }

    function openModal() { document.getElementById('matchModal').classList.add('active'); }
    function closeModal() { document.getElementById('matchModal').classList.remove('active'); }

    function submitMatch() {
      const title = document.getElementById('newTitle').value.trim() || 'NEW TOURNAMENT';
      const mode = document.getElementById('newMode').value;
      const map = document.getElementById('newMap').value;
      const rules = document.getElementById('newRules').value.trim() || 'Standard Rules';
      const time = document.getElementById('newTime').value.trim() || 'TONIGHT';
      const fee = Number(document.getElementById('newFee').value) || 50;
      const prize = Number(document.getElementById('newPrize').value) || 400;
      const totalSlots = Number(document.getElementById('newSlots').value) || 12;

      let tournaments = getTournaments();
      tournaments.unshift({
        id: 'm_' + Date.now(),
        title: `${title} (${mode})`,
        map: map,
        rules: rules,
        time,
        fee,
        prize,
        totalSlots,
        roomId: '',
        roomPass: '',
        players: []
      });

      saveTournaments(tournaments);
      closeModal();
      alert('Tournament publish ho gaya!');
    }

    function filterByMapPrompt() {
      const choice = prompt('Kounsa Map Filter karna hai? (Bermuda, Purgatory, Kalahari, Alpine, ya All):', activeMapFilter);
      if (choice !== null) {
        activeMapFilter = choice.trim();
        showSection('matchesSection');
        renderAll();
      }
    }

    function handlePlayerStatus(matchId, uid, action) {
      let tournaments = getTournaments();
      const match = tournaments.find(m => m.id === matchId);
      if (!match) return;

      if (action === 'approved') {
        const player = match.players.find(p => p.uid === uid);
        if (player) player.status = 'approved';
      } else if (action === 'rejected') {
        match.players = match.players.filter(p => p.uid !== uid);
      }

      saveTournaments(tournaments);
    }

    function setSpecificRoom(matchId) {
      let tournaments = getTournaments();
      const match = tournaments.find(m => m.id === matchId);
      if (!match) return;

      const rId = prompt('Room ID darj karein:', match.roomId || '');
      if (rId === null) return;
      const rPass = prompt('Room Password darj karein:', match.roomPass || '');
      if (rPass === null) return;

      match.roomId = rId;
      match.roomPass = rPass;
      saveTournaments(tournaments);
      alert('Room credentials save ho gaye!');
    }

    function promptRoomCreds() {
      const tournaments = getTournaments();
      if (tournaments.length === 0) return alert('Pehle tournament banayein!');
      setSpecificRoom(tournaments[0].id);
    }

    function deleteMatch(matchId) {
      if (!confirm('Kya aap is tournament ko delete karna chahte hain?')) return;
      let tournaments = getTournaments();
      tournaments = tournaments.filter(m => m.id !== matchId);
      saveTournaments(tournaments);
    }

    function banPlayerPrompt() {
      const uid = prompt('Player ki Free Fire UID likhein:');
      if (!uid) return;
      let bans = JSON.parse(localStorage.getItem('mff_banned_uids')) || [];
      bans.push(uid);
      localStorage.setItem('mff_banned_uids', JSON.stringify(bans));
      alert(`UID ${uid} ban ho chuki hai!`);
    }

    function showSection(id) {
      document.getElementById('pendingSection').style.display = (id === 'pendingSection') ? 'block' : 'none';
      document.getElementById('matchesSection').style.display = (id === 'matchesSection') ? 'block' : 'none';
      document.getElementById('supportSection').style.display = (id === 'supportSection') ? 'block' : 'none';
    }

    function switchNav(btn, view) {
      document.querySelectorAll('.bottom-bar button').forEach(b => b.className = 'nav-item');
      btn.className = 'nav-item active-pill';
      if (view === 'all') {
        document.getElementById('pendingSection').style.display = 'block';
        document.getElementById('matchesSection').style.display = 'block';
        document.getElementById('supportSection').style.display = 'none';
      } else if (view === 'matches') {
        showSection('matchesSection');
      } else if (view === 'pending') {
        showSection('pendingSection');
      } else if (view === 'support') {
        showSection('supportSection');
      }
    }

    function exportData() {
      const data = localStorage.getItem('mff_tournaments');
      navigator.clipboard.writeText(data || '[]');
      alert('Backup copied!');
    }

    function clearCompletedMatches() {
      if (confirm('Matches clear karne hain?')) {
        saveTournaments([]);
      }
    }

    window.onload = renderAll;
  </script>
</body>
</html>
