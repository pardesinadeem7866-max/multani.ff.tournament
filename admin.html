<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multani.ff Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-white font-sans pb-28">

    <header class="flex justify-between items-center p-4 bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-emerald-500/20 flex items-center justify-center border border-emerald-500">
                <i class="fa-solid fa-shield-halved text-emerald-400 text-sm"></i>
            </div>
            <span class="font-bold text-lg text-emerald-400">Multani.ff Admin</span>
        </div>
        <button onclick="openPage('createMatchPage')" class="bg-pink-600 hover:bg-pink-700 text-white px-4 py-1.5 rounded-xl font-bold text-sm flex items-center gap-1.5">
            <i class="fa-solid fa-gamepad"></i> + MATCH
        </button>
    </header>

    <main id="dashboardPage" class="p-4 space-y-4">
        <!-- Revenue & Stats Grid -->
        <div class="grid grid-cols-3 gap-3">
            <div onclick="openPage('matchesPage')" class="bg-slate-900 border border-slate-800 p-3 rounded-xl text-center cursor-pointer">
                <i class="fa-solid fa-gamepad text-emerald-400 text-lg mb-1"></i>
                <h3 class="text-lg font-bold" id="liveMatchesCount">0</h3>
                <p class="text-[11px] text-slate-400">Live Matches</p>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl text-center">
                <i class="fa-solid fa-users text-blue-400 text-lg mb-1"></i>
                <h3 class="text-lg font-bold" id="approvedSlotsCount">0</h3>
                <p class="text-[11px] text-slate-400">Slots</p>
            </div>
            <div onclick="openPage('paymentPage')" class="bg-slate-900 border border-slate-800 p-3 rounded-xl text-center cursor-pointer">
                <i class="fa-solid fa-receipt text-amber-400 text-lg mb-1"></i>
                <h3 class="text-lg font-bold" id="needsApprovalCount">0</h3>
                <p class="text-[11px] text-slate-400">Approvals</p>
            </div>
        </div>

        <!-- Admin Control Hub Icons -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
            <div class="grid grid-cols-4 gap-4 text-center">
                <div onclick="openPage('createMatchPage')" class="cursor-pointer">
                    <div class="w-12 h-12 mx-auto bg-slate-800 rounded-full flex items-center justify-center border border-slate-700"><i class="fa-solid fa-plus text-lg"></i></div>
                    <span class="text-[11px] text-slate-300 mt-2 block font-medium">Create Match</span>
                </div>
                <div onclick="openPage('paymentPage')" class="cursor-pointer relative">
                    <div class="w-12 h-12 mx-auto bg-slate-800 rounded-full flex items-center justify-center border border-slate-700"><i class="fa-solid fa-file-invoice-dollar text-lg text-amber-400"></i></div>
                    <span class="text-[11px] text-slate-300 mt-2 block font-medium">Payments</span>
                </div>
                <div onclick="openPage('matchesPage')" class="cursor-pointer">
                    <div class="w-12 h-12 mx-auto bg-slate-800 rounded-full flex items-center justify-center border border-slate-700"><i class="fa-solid fa-list text-lg"></i></div>
                    <span class="text-[11px] text-slate-300 mt-2 block font-medium">Manager</span>
                </div>
                <div onclick="openPage('bannedPage')" class="cursor-pointer">
                    <div class="w-12 h-12 mx-auto bg-slate-800 rounded-full flex items-center justify-center border border-slate-700"><i class="fa-solid fa-user-slash text-lg text-red-400"></i></div>
                    <span class="text-[11px] text-slate-300 mt-2 block font-medium">Ban Player</span>
                </div>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
            <h3 class="font-bold text-sm mb-3 flex items-center gap-2"><i class="fa-solid fa-wallet text-amber-400"></i> Pending Payment Approvals</h3>
            <div id="pendingPaymentsContainer" class="text-center py-4 text-slate-500 text-sm">No pending verification requests.</div>
        </div>
    </main>

    <!-- Sub-pages -->
    <div id="matchesPage" class="sub-page hidden p-4 space-y-4">
        <div class="flex justify-between items-center bg-slate-900 p-3 rounded-xl border border-slate-800">
            <h2 class="font-bold text-base text-pink-400">All Active Matches</h2>
            <button onclick="openPage('dashboardPage')" class="bg-slate-800 px-3 py-1 rounded-lg text-xs">Back</button>
        </div>
        <div id="matchesListContainer" class="space-y-3"></div>
    </div>

    <div id="createMatchPage" class="sub-page hidden p-4 space-y-4">
        <div class="flex justify-between items-center bg-slate-900 p-3 rounded-xl border border-slate-800">
            <h2 class="font-bold text-base text-emerald-400">Create New Match</h2>
            <button onclick="openPage('dashboardPage')" class="bg-slate-800 px-3 py-1 rounded-lg text-xs">Back</button>
        </div>
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3">
            <input type="text" id="matchTitle" placeholder="Match Title (e.g. Solo Cup)" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm">
            <select id="matchMode" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm"><option value="Solo">Solo</option><option value="Duo">Duo</option><option value="Squad">Squad</option></select>
            <select id="matchMap" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm"><option value="Bermuda">Bermuda</option><option value="Kalahari">Kalahari</option></select>
            <input type="number" id="matchSlots" placeholder="Slot Capacity (e.g. 48)" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm">
            <input type="text" id="matchPrize" placeholder="Prize Pool (e.g. 5000)" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm">
            <button onclick="saveNewMatch()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-sm">Publish Match Live</button>
        </div>
    </div>

    <div id="paymentPage" class="sub-page hidden p-4 space-y-4">
        <div class="flex justify-between items-center bg-slate-900 p-3 rounded-xl border border-slate-800">
            <h2 class="font-bold text-base text-amber-400">Payment Proofs & Approvals</h2>
            <button onclick="openPage('dashboardPage')" class="bg-slate-800 px-3 py-1 rounded-lg text-xs">Back</button>
        </div>
        <div id="fullPaymentList" class="space-y-3"><p class="text-center text-slate-500 py-6">No payments uploaded.</p></div>
    </div>

    <div id="bannedPage" class="sub-page hidden p-4 space-y-4">
        <div class="flex justify-between items-center bg-slate-900 p-3 rounded-xl border border-slate-800">
            <h2 class="font-bold text-base text-red-400">Banned Players</h2>
            <button onclick="openPage('dashboardPage')" class="bg-slate-800 px-3 py-1 rounded-lg text-xs">Back</button>
        </div>
        <div id="bannedPlayersContainer" class="space-y-3"><p class="text-center text-slate-500 py-6">No banned players.</p></div>
    </div>

    <!-- Bottom Nav -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 grid grid-cols-3 py-2 px-1 z-50 text-center">
        <button onclick="openPage('dashboardPage')" class="text-emerald-400 flex flex-col items-center justify-center gap-1 text-xs"><i class="fa-solid fa-house text-base"><span>Home</span></i></button>
        <button onclick="openPage('matchesPage')" class="text-slate-400 flex flex-col items-center justify-center gap-1 text-xs"><i class="fa-solid fa-gamepad text-base"><span>Match</span></i></button>
        <button onclick="openPage('paymentPage')" class="text-slate-400 flex flex-col items-center justify-center gap-1 text-xs"><i class="fa-solid fa-file-invoice-dollar text-base"><span>Payments</span></i></button>
    </nav>

<script>
const SUPABASE_URL = "https://eyrwqmirdigsckcwbmxn.supabase.co";
const SUPABASE_KEY = "sb_publishable_N2bFvVebY84Ac4kF7KPYjw_1YCdUUHX";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let appData = { matches: [], payments: [] };

async function fetchAdminData() {
    const { data: matches } = await supabaseClient.from('tournaments').select('*');
    if(matches) {
        appData.matches = matches;
        document.getElementById('liveMatchesCount').innerText = matches.length;
    }
    const { data: payments } = await supabaseClient.from('payments').select('*').eq('status', 'pending');
    if(payments) {
        appData.payments = payments;
        document.getElementById('needsApprovalCount').innerText = payments.length;
        renderPendingPayments(payments);
    }
}

function openPage(pageId) {
    document.querySelectorAll('.sub-page').forEach(page => page.classList.add('hidden'));
    document.getElementById('dashboardPage').classList.add('hidden');
    if(pageId === 'dashboardPage') {
        document.getElementById('dashboardPage').classList.remove('hidden');
        fetchAdminData();
    } else {
        document.getElementById(pageId).classList.remove('hidden');
        renderSubPage(pageId);
    }
}

function renderPendingPayments(payments) {
    let container = document.getElementById('pendingPaymentsContainer');
    if(payments.length === 0) {
        container.innerHTML = 'Koi pending verification request nahi hai!';
        return;
    }
    container.innerHTML = '';
    payments.forEach(p => {
        container.innerHTML += `
            <div class="bg-slate-800 p-3 rounded-xl flex justify-between items-center text-xs mt-2">
                <div>User ID: <b>${p.user_id.substring(0,8)}...</b> | Amount: <b class="text-amber-400">Rs. ${p.amount}</b></div>
                <div class="flex gap-1">
                    <button onclick="approvePayment('${p.id}')" class="bg-emerald-600 px-2 py-1 rounded text-white font-bold">Approve</button>
                    <button onclick="rejectPayment('${p.id}')" class="bg-red-600 px-2 py-1 rounded text-white font-bold">Reject</button>
                </div>
            </div>
        `;
    });
}

function renderSubPage(pageId) {
    if(pageId === 'matchesPage') {
        let container = document.getElementById('matchesListContainer');
        container.innerHTML = '';
        appData.matches.forEach(m => {
            container.innerHTML += `
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-sm">${m.title}</h3>
                        <p class="text-xs text-slate-400">Mode: ${m.mode} | Prize: Rs. ${m.prize_pool}</p>
                    </div>
                    <button onclick="deleteMatch('${m.id}')" class="bg-red-600/20 text-red-400 px-3 py-1 rounded-lg text-xs font-bold hover:bg-red-600 hover:text-white">Delete</button>
                </div>
            `;
        });
    } else if(pageId === 'paymentPage') {
        let container = document.getElementById('fullPaymentList');
        container.innerHTML = '';
        appData.payments.forEach(p => {
            container.innerHTML += `
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex justify-between items-center text-xs">
                    <div>User: ${p.user_id} <br>Amount: <b class="text-amber-400">Rs. ${p.amount}</b></div>
                    <div class="flex gap-2">
                        <button onclick="approvePayment('${p.id}')" class="bg-emerald-600 px-3 py-1 rounded text-white font-bold">Approve</button>
                        <button onclick="rejectPayment('${p.id}')" class="bg-red-600 px-3 py-1 rounded text-white font-bold">Reject</button>
                    </div>
                </div>
            `;
        });
    }
}

async function saveNewMatch() {
    let title = document.getElementById('matchTitle').value;
    let mode = document.getElementById('matchMode').value;
    let map = document.getElementById('matchMap').value;
    let slots = document.getElementById('matchSlots').value;
    let prize = document.getElementById('matchPrize').value;

    if(!title || !slots) { alert('Title aur slots lazmi enter karein!'); return; }

    const { error } = await supabaseClient.from('tournaments').insert([{
        title, mode, map, max_players: parseInt(slots), prize_pool: parseFloat(prize) || 0, status: 'upcoming', match_date: new Date()
    }]);

    if(error) { alert("Error: " + error.message); return; }
    alert('Match published successfully!');
    openPage('dashboardPage');
}

async function deleteMatch(id) {
    if(!confirm("Kya aap waqai is match ko delete karna chahte hain?")) return;
    const { error } = await supabaseClient.from('tournaments').delete().eq('id', id);
    if(error) { alert("Error: " + error.message); return; }
    alert("Match deleted successfully!");
    fetchAdminData();
    openPage('matchesPage');
}

async function approvePayment(id) {
    const { error } = await supabaseClient.from('payments').update({ status: 'approved' }).eq('id', id);
    if(error) { alert("Error: " + error.message); return; }
    alert("Payment approved!");
    fetchAdminData();
}

async function rejectPayment(id) {
    const { error } = await supabaseClient.from('payments').update({ status: 'rejected' }).eq('id', id);
    if(error) { alert("Error: " + error.message); return; }
    alert("Payment rejected.");
    fetchAdminData();
}

fetchAdminData();
</script>
</body>
</html>
