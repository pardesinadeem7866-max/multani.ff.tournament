<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multani FF Admin Control Center</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16',
                        cardBg: '#131b2e',
                        cardBorder: '#1e293b',
                        neonRed: '#ff2a5f',
                        neonYellow: '#ffbe0b',
                        neonGreen: '#06d6a0',
                        accentBlue: '#3a86ff'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #090d16;
            color: #f8fafc;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        .heading-font {
            font-family: 'Rajdhani', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 2px;
        }
        .glass-card {
            background: rgba(19, 27, 46, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .neon-glow-red {
            box-shadow: 0 0 15px rgba(255, 42, 95, 0.3);
        }
        .neon-glow-yellow {
            box-shadow: 0 0 15px rgba(255, 190, 11, 0.3);
        }
    </style>
</head>
<body class="pb-24 select-none">

    <!-- Global Loading Overlay -->
    <div id="global-loader" class="fixed inset-0 z-50 bg-darkBg/90 backdrop-blur-md flex flex-col items-center justify-center transition-opacity duration-300 hidden">
        <div class="relative w-16 h-16 mb-4">
            <div class="absolute inset-0 border-4 border-neonRed/20 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-neonRed rounded-full border-t-transparent animate-spin"></div>
        </div>
        <p id="loader-text" class="heading-font text-lg tracking-wider text-slate-300 font-semibold animate-pulse">PROCESSING ADMIN ACTION...</p>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-11/12 max-w-md flex flex-col gap-2 pointer-events-none"></div>

    <!-- MAIN APP CONTAINER -->
    <div id="app" class="relative w-full min-h-screen flex flex-col">

        <!-- HEADER -->
        <header class="sticky top-0 z-30 glass-card px-4 py-3 flex items-center justify-between border-b border-cardBorder">
            <div class="flex items-center space-x-3">
                <div id="back-btn-container" class="hidden">
                    <button onclick="goBack()" class="w-9 h-9 rounded-xl bg-slate-800/80 border border-slate-700 flex items-center justify-center text-slate-200 hover:bg-slate-700 active:scale-95 transition">
                        <i class="fa-solid fa-arrow-left text-sm"></i>
                    </button>
                </div>
                <div class="flex items-center space-x-2">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-neonRed to-neonYellow p-0.5 flex items-center justify-center shadow-lg neon-glow-red">
                        <div class="w-full h-full bg-darkBg rounded-[10px] flex items-center justify-center">
                            <i class="fa-solid fa-shield-halved text-neonRed text-sm"></i>
                        </div>
                    </div>
                    <div>
                        <h1 class="heading-font font-bold text-lg tracking-wider bg-gradient-to-r from-white via-slate-200 to-neonRed bg-clip-text text-transparent leading-none">ADMIN PANEL</h1>
                        <span class="text-[10px] text-neonYellow font-semibold tracking-widest uppercase">Multani FF Control</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <button onclick="navigateTo('user-home')" class="px-2.5 py-1.5 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 text-xs font-semibold flex items-center space-x-1 hover:bg-slate-700 transition">
                    <i class="fa-solid fa-house"></i>
                    <span>App</span>
                </button>
            </div>
        </header>

        <!-- DYNAMIC VIEWS CONTAINER -->
        <main id="main-content" class="flex-1 flex flex-col pb-16">
            <!-- Content injected dynamically via JS router -->
        </main>

        <!-- BOTTOM NAVIGATION BAR (Admin Control Tabs) -->
        <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 max-w-[480px] mx-auto glass-card border-t border-cardBorder px-2 py-2 z-40 flex items-center justify-around">
            <button onclick="navigateTo('admin-dashboard')" data-nav="admin-dashboard" class="nav-item flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-neonRed transition">
                <i class="fa-solid fa-chart-pie text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium tracking-wide">Dashboard</span>
            </button>
            <button onclick="navigateTo('admin-tournaments')" data-nav="admin-tournaments" class="nav-item flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-neonRed transition">
                <i class="fa-solid fa-gamepad text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium tracking-wide">Tourneys</span>
            </button>
            <button onclick="navigateTo('admin-deposits')" data-nav="admin-deposits" class="nav-item flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-neonRed transition">
                <i class="fa-solid fa-wallet text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium tracking-wide">Deposits</span>
            </button>
            <button onclick="navigateTo('admin-users')" data-nav="admin-users" class="nav-item flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-neonRed transition">
                <i class="fa-solid fa-users text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium tracking-wide">Users</span>
            </button>
            <button onclick="navigateTo('admin-settings')" data-nav="admin-settings" class="nav-item flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-neonRed transition">
                <i class="fa-solid fa-gear text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium tracking-wide">Settings</span>
            </button>
        </nav>

    </div>

    <!-- MODAL ROOT -->
    <div id="modal-root" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden"></div>

    <!-- JAVASCRIPT ADMIN APPLICATION CORE -->
    <script>
        const SUPABASE_URL = 'https://eyrwqmirdigsckcwbmxn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_N2bFvVebY84Ac4kF7KPYjw_1YCdUUHX';

        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: true, autoRefreshToken: true }
        });

        let state = {
            currentUser: null,
            isAdmin: false,
            currentView: 'admin-dashboard',
            currentParams: {},
            navigationHistory: [],
            tournamentsCache: [],
            depositsCache: [],
            usersCache: [],
            winnersCache: [],
            settingsCache: {}
        };

        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-slate-800 border-slate-700 text-slate-200';
            let icon = 'fa-info-circle text-accentBlue';
            if (type === 'success') {
                bgClass = 'bg-emerald-950/90 border-emerald-500/30 text-emerald-200';
                icon = 'fa-circle-check text-neonGreen';
            } else if (type === 'error') {
                bgClass = 'bg-rose-950/90 border-rose-500/30 text-rose-200';
                icon = 'fa-triangle-exclamation text-neonRed';
            }

            toast.className = `pointer-events-auto flex items-center space-x-3 px-4 py-3 rounded-xl border shadow-xl backdrop-blur-md transition-all duration-300 transform translate-y-2 opacity-0 ${bgClass}`;
            toast.innerHTML = `
                <i class="fa-solid ${icon} text-base flex-shrink-0"></i>
                <span class="text-xs font-medium flex-1">${escapeHTML(message)}</span>
            `;

            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function setGlobalLoading(isLoading, text = 'PROCESSING...') {
            const loader = document.getElementById('global-loader');
            const loaderText = document.getElementById('loader-text');
            if (isLoading) {
                loaderText.textContent = text;
                loader.classList.remove('hidden');
            } else {
                loader.classList.add('hidden');
            }
        }

        function formatCurrency(amount) {
            return `Rs. ${Number(amount || 0).toLocaleString()}`;
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'TBD';
            const d = new Date(dateStr);
            return isNaN(d.getTime()) ? dateStr : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function navigateTo(viewName, params = {}, pushHistory = true) {
            if (pushHistory && state.currentView) {
                state.navigationHistory.push({ view: state.currentView, params: state.currentParams || {} });
            }
            state.currentView = viewName;
            state.currentParams = params;
            renderCurrentView();
            updateBottomNavActiveState();
            updateBackButtonVisibility();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goBack() {
            if (state.navigationHistory.length > 0) {
                const prev = state.navigationHistory.pop();
                state.currentView = prev.view;
                state.currentParams = prev.params;
                renderCurrentView();
                updateBottomNavActiveState();
                updateBackButtonVisibility();
            } else {
                navigateTo('admin-dashboard', {}, false);
            }
        }

        function updateBackButtonVisibility() {
            const backContainer = document.getElementById('back-btn-container');
            if (['admin-dashboard', 'admin-tournaments', 'admin-deposits', 'admin-users', 'admin-settings'].includes(state.currentView)) {
                backContainer.classList.add('hidden');
            } else {
                backContainer.classList.remove('hidden');
            }
        }

        function updateBottomNavActiveState() {
            document.querySelectorAll('.nav-item').forEach(btn => {
                const nav = btn.getAttribute('data-nav');
                if (nav === state.currentView) {
                    btn.classList.add('text-neonRed');
                    btn.classList.remove('text-slate-400');
                } else {
                    btn.classList.remove('text-neonRed');
                    btn.classList.add('text-slate-400');
                }
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            setGlobalLoading(true, 'VERIFYING ADMIN ACCESS...');
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session?.user) {
                    showToast('Please login first.', 'error');
                    window.location.href = 'index.html';
                    return;
                }
                state.currentUser = session.user;

                // Verify admin status
                const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
                const { data: adminData } = await supabaseClient.from('admin_users').select('*').or(`id.eq.${session.user.id},user_id.eq.${session.user.id}`).maybeSingle();

                if (!adminData && !profile?.is_admin) {
                    showToast('Access denied. Admin privileges required.', 'error');
                    setTimeout(() => window.location.href = 'index.html', 1500);
                    return;
                }

                state.isAdmin = true;
                await fetchAdminData();
                navigateTo('admin-dashboard', {}, false);
            } catch (err) {
                console.error('Admin init error:', err);
                showToast('Authentication check failed.', 'error');
            } finally {
                setGlobalLoading(false);
            }
        });

        async function fetchAdminData() {
            try {
                const [tourns, deposits, users, winners, settings] = await Promise.all([
                    supabaseClient.from('tournaments').select('*').order('match_date', { ascending: false }),
                    supabaseClient.from('deposit_requests').select('*, profiles(username, free_fire_uid)').order('created_at', { ascending: false }),
                    supabaseClient.from('profiles').select('*').order('created_at', { ascending: false }),
                    supabaseClient.from('winners').select('*').order('created_at', { ascending: false }),
                    supabaseClient.from('site_settings').select('*')
                ]);

                state.tournamentsCache = tourns.data || [];
                state.depositsCache = deposits.data || [];
                state.usersCache = users.data || [];
                state.winnersCache = winners.data || [];

                if (settings.data) {
                    settings.data.forEach(s => {
                        if (s.key) state.settingsCache[s.key] = s.value;
                    });
                }
            } catch (err) {
                console.error('Fetch admin data error:', err);
            }
        }

        function renderCurrentView() {
            const container = document.getElementById('main-content');
            const bottomNav = document.getElementById('bottom-nav');

            switch (state.currentView) {
                case 'admin-dashboard':
                    container.innerHTML = renderAdminDashboard();
                    break;
                case 'admin-tournaments':
                    container.innerHTML = renderAdminTournaments();
                    break;
                case 'admin-create-tournament':
                    container.innerHTML = renderAdminTournamentForm();
                    break;
                case 'admin-edit-tournament':
                    container.innerHTML = renderAdminTournamentForm(state.currentParams?.id);
                    break;
                case 'admin-deposits':
                    container.innerHTML = renderAdminDeposits();
                    break;
                case 'admin-users':
                    container.innerHTML = renderAdminUsers();
                    break;
                case 'admin-settings':
                    container.innerHTML = renderAdminSettings();
                    break;
                default:
                    container.innerHTML = renderAdminDashboard();
            }
        }

        // ==================== VIEWS ====================

        function renderAdminDashboard() {
            const totalTourneys = state.tournamentsCache.length;
            const activeTourneys = state.tournamentsCache.filter(t => t.status === 'live' || t.status === 'upcoming').length;
            const pendingDeposits = state.depositsCache.filter(d => d.status === 'pending').length;
            const totalUsers = state.usersCache.length;

            return `
                <div class="p-4 flex flex-col space-y-4">
                    <div class="glass-card rounded-2xl p-4 border-neonRed/20 bg-gradient-to-br from-cardBg via-cardBg to-rose-950/30">
                        <span class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Command Center</span>
                        <h2 class="heading-font font-bold text-xl text-white">Multani FF Admin</h2>
                        <p class="text-xs text-slate-300 mt-1">Manage matches, verify deposits, and control platform settings effortlessly.</p>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="glass-card rounded-2xl p-4 border border-cardBorder">
                            <span class="text-[10px] text-slate-400 font-medium block">Total Tournaments</span>
                            <span class="heading-font font-bold text-2xl text-neonYellow">${totalTourneys}</span>
                            <span class="text-[10px] text-emerald-400 mt-1 block">${activeTourneys} Active/Upcoming</span>
                        </div>
                        <div class="glass-card rounded-2xl p-4 border border-cardBorder">
                            <span class="text-[10px] text-slate-400 font-medium block">Pending Deposits</span>
                            <span class="heading-font font-bold text-2xl text-neonRed">${pendingDeposits}</span>
                            <span class="text-[10px] text-slate-400 mt-1 block">Requires action</span>
                        </div>
                        <div class="glass-card rounded-2xl p-4 border border-cardBorder">
                            <span class="text-[10px] text-slate-400 font-medium block">Total Users</span>
                            <span class="heading-font font-bold text-2xl text-white">${totalUsers}</span>
                            <span class="text-[10px] text-slate-400 mt-1 block">Registered players</span>
                        </div>
                        <div class="glass-card rounded-2xl p-4 border border-cardBorder">
                            <span class="text-[10px] text-slate-400 font-medium block">Platform Status</span>
                            <span class="heading-font font-bold text-lg text-neonGreen">ONLINE</span>
                            <span class="text-[10px] text-slate-400 mt-1 block">Supabase Connected</span>
                        </div>
                    </div>

                    <div class="glass-card rounded-2xl p-4 border border-cardBorder space-y-3">
                        <h3 class="heading-font font-bold text-base text-white">Quick Actions</h3>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="navigateTo('admin-create-tournament')" class="py-2.5 px-3 rounded-xl bg-neonRed text-white text-xs font-semibold flex items-center justify-center space-x-2 shadow-lg neon-glow-red hover:bg-rose-600 transition">
                                <i class="fa-solid fa-plus-circle"></i>
                                <span>Create Match</span>
                            </button>
                            <button onclick="navigateTo('admin-deposits')" class="py-2.5 px-3 rounded-xl bg-slate-800 border border-slate-700 text-slate-200 text-xs font-semibold flex items-center justify-center space-x-2 hover:bg-slate-700 transition">
                                <i class="fa-solid fa-wallet"></i>
                                <span>Verify Deposits</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAdminTournaments() {
            const tourns = state.tournamentsCache;

            return `
                <div class="p-4 flex flex-col space-y-4">
                    <div class="flex items-center justify-between">
                        <h2 class="heading-font font-bold text-xl text-white">Manage Tournaments</h2>
                        <button onclick="navigateTo('admin-create-tournament')" class="px-3 py-2 rounded-xl bg-neonRed text-white text-xs font-bold shadow-lg neon-glow-red hover:bg-rose-600 transition flex items-center space-x-1">
                            <i class="fa-solid fa-plus"></i>
                            <span>Create New</span>
                        </button>
                    </div>

                    ${tourns.length === 0 ? `
                        <div class="glass-card rounded-2xl p-8 text-center text-slate-400">
                            <i class="fa-solid fa-gamepad text-3xl mb-2 text-slate-600"></i>
                            <p class="text-xs">No tournaments created yet.</p>
                        </div>
                    ` : `
                        <div class="flex flex-col space-y-3">
                            ${tourns.map(t => `
                                <div class="glass-card rounded-2xl p-4 border border-cardBorder space-y-3">
                                    <div class="flex items-center justify-between">
                                        <span class="text-[10px] font-bold uppercase tracking-wider text-neonYellow">${escapeHTML(t.game || 'Free Fire')} • ${escapeHTML(t.mode || 'Squad')}</span>
                                        <span class="px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 text-[10px] font-bold uppercase">${escapeHTML(t.status)}</span>
                                    </div>

                                    <h4 class="heading-font font-bold text-base text-white">${escapeHTML(t.title)}</h4>

                                    <div class="grid grid-cols-2 gap-2 py-2 border-y border-slate-800 text-xs">
                                        <div>
                                            <span class="text-slate-400">Prize Pool:</span> <strong class="text-neonGreen">${formatCurrency(t.prize_pool)}</strong>
                                        </div>
                                        <div>
                                            <span class="text-slate-400">Entry Fee:</span> <strong class="text-white">${t.entry_fee > 0 ? formatCurrency(t.entry_fee) : 'FREE'}</strong>
                                        </div>
                                        <div>
                                            <span class="text-slate-400">Date:</span> <span class="text-slate-200">${formatDate(t.match_date)}</span>
                                        </div>
                                        <div>
                                            <span class="text-slate-400">Room ID:</span> <span class="font-mono text-white">${escapeHTML(t.room_id || 'Not Set')}</span>
                                        </div>
                                    </div>

                                    <div class="flex space-x-2 pt-1">
                                        <button onclick="navigateTo('admin-edit-tournament', { id: '${t.id}' })" class="flex-1 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold transition text-center flex items-center justify-center space-x-1">
                                            <i class="fa-solid fa-pen-to-square text-accentBlue"></i>
                                            <span>Edit</span>
                                        </button>
                                        <button onclick="deleteTournament('${t.id}')" class="px-4 py-2 rounded-xl bg-rose-950/40 border border-rose-500/30 text-rose-400 hover:bg-rose-900/40 text-xs font-semibold transition flex items-center justify-center space-x-1">
                                            <i class="fa-solid fa-trash-can"></i>
                                            <span>Delete</span>
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        function renderAdminTournamentForm(tournamentId = null) {
            const isEdit = Boolean(tournamentId);
            const t = isEdit ? state.tournamentsCache.find(item => item.id === tournamentId) || {} : {};

            return `
                <div class="p-4 flex flex-col space-y-4">
                    <h2 class="heading-font font-bold text-xl text-white">${isEdit ? 'Edit Tournament' : 'Create Tournament'}</h2>

                    <form onsubmit="handleTournamentSubmit(event, '${tournamentId || ''}')" class="glass-card rounded-2xl p-4 border border-cardBorder space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">Tournament Title</label>
                            <input type="text" id="t-title" value="${escapeHTML(t.title || '')}" required placeholder="e.g. Daily Squad Clash #1" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-neonRed">
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Game</label>
                                <input type="text" id="t-game" value="${escapeHTML(t.game || 'Free Fire')}" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-neonRed">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Mode</label>
                                <select id="t-mode" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-neonRed">
                                    <option value="Squad" ${t.mode === 'Squad' ? 'selected' : ''}>Squad</option>
                                    <option value="Duo" ${t.mode === 'Duo' ? 'selected' : ''}>Duo</option>
                                    <option value="Solo" ${t.mode === 'Solo' ? 'selected' : ''}>Solo</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Prize Pool (PKR)</label>
                                <input type="number" id="t-prize" value="${t.prize_pool || 1000}" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-neonRed">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Entry Fee (PKR)</label>
                                <input type="number" id="t-fee" value="${t.entry_fee || 50}" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-neonRed">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Max Players</label>
                                <input type="number" id="t-max" value="${t.max_players || 48}" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-neonRed">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Status</label>
                                <select id="t-status" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-neonRed">
                                    <option value="upcoming" ${t.status === 'upcoming' ? 'selected' : ''}>Upcoming</option>
                                    <option value="live" ${t.status === 'live' ? 'selected' : ''}>Live</option>
                                    <option value="completed" ${t.status === 'completed' ? 'selected' : ''}>Completed</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">Match Date & Time</label>
                            <input type="datetime-local" id="t-date" value="${t.match_date ? t.match_date.slice(0, 16) : ''}" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-neonRed">
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Room ID</label>
                                <input type="text" id="t-room" value="${escapeHTML(t.room_id || '')}" placeholder="Room ID" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-neonRed">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Room Password</label>
                                <input type="text" id="t-pass" value="${escapeHTML(t.room_password || '')}" placeholder="Password" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-neonRed">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">Description / Rules</label>
                            <textarea id="t-desc" rows="3" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-neonRed">${escapeHTML(t.description || '')}</textarea>
                        </div>

                        <button type="submit" class="w-full py-3 rounded-xl bg-neonRed text-white text-xs font-bold shadow-lg neon-glow-red hover:bg-rose-600 transition mt-2">${isEdit ? 'Update Tournament' : 'Publish Tournament'}</button>
                    </form>
                </div>
            `;
        }

        async function handleTournamentSubmit(e, tournamentId) {
            e.preventDefault();
            const title = document.getElementById('t-title').value.trim();
            const game = document.getElementById('t-game').value.trim();
            const mode = document.getElementById('t-mode').value;
            const prizePool = parseFloat(document.getElementById('t-prize').value);
            const entryFee = parseFloat(document.getElementById('t-fee').value);
            const maxPlayers = parseInt(document.getElementById('t-max').value);
            const status = document.getElementById('t-status').value;
            const matchDate = document.getElementById('t-date').value;
            const roomId = document.getElementById('t-room').value.trim();
            const roomPassword = document.getElementById('t-pass').value.trim();
            const description = document.getElementById('t-desc').value.trim();

            setGlobalLoading(true, 'SAVING TOURNAMENT...');
            try {
                const payload = {
                    title, game, mode, prize_pool: prizePool, entry_fee: entryFee,
                    max_players: maxPlayers, status, match_date: matchDate,
                    room_id: roomId || null, room_password: roomPassword || null, description
                };

                let error;
                if (tournamentId) {
                    const res = await supabaseClient.from('tournaments').update(payload).eq('id', tournamentId);
                    error = res.error;
                } else {
                    const res = await supabaseClient.from('tournaments').insert(payload);
                    error = res.error;
                }

                if (error) throw error;

                showToast('Tournament saved successfully!', 'success');
                await fetchAdminData();
                navigateTo('admin-tournaments');
            } catch (err) {
                console.error('Save tournament error:', err);
                showToast(err.message || 'Failed to save tournament.', 'error');
            } finally {
                setGlobalLoading(false);
            }
        }

        async function deleteTournament(id) {
            if (!confirm('Are you sure you want to delete this tournament?')) return;

            setGlobalLoading(true, 'DELETING TOURNAMENT...');
            try {
                const { error } = await supabaseClient.from('tournaments').delete().eq('id', id);
                if (error) throw error;

                showToast('Tournament deleted successfully.', 'success');
                await fetchAdminData();
                renderCurrentView();
            } catch (err) {
                console.error('Delete tournament error:', err);
                showToast(err.message || 'Failed to delete tournament.', 'error');
            } finally {
                setGlobalLoading(false);
            }
        }

        function renderAdminDeposits() {
            const deposits = state.depositsCache;

            return `
                <div class="p-4 flex flex-col space-y-4">
                    <h2 class="heading-font font-bold text-xl text-white">Deposit Requests</h2>

                    ${deposits.length === 0 ? `
                        <div class="glass-card rounded-2xl p-8 text-center text-slate-400">
                            <i class="fa-solid fa-wallet text-3xl mb-2 text-slate-600"></i>
                            <p class="text-xs">No deposit requests found.</p>
                        </div>
                    ` : `
                        <div class="flex flex-col space-y-3">
                            ${deposits.map(d => {
                                const profile = d.profiles || {};
                                let badgeColor = 'bg-amber-950/80 text-amber-400 border-amber-500/30';
                                if (d.status === 'approved') badgeColor = 'bg-emerald-950/80 text-emerald-400 border-emerald-500/30';
                                if (d.status === 'rejected') badgeColor = 'bg-rose-950/80 text-rose-400 border-rose-500/30';

                                return `
                                    <div class="glass-card rounded-2xl p-4 border border-cardBorder space-y-3">
                                        <div class="flex items-center justify-between">
                                            <span class="text-xs font-bold text-white">${escapeHTML(profile.username || 'User')} (UID: ${escapeHTML(profile.free_fire_uid || 'N/A')})</span>
                                            <span class="px-2 py-0.5 rounded-full border text-[9px] font-bold uppercase ${badgeColor}">${escapeHTML(d.status)}</span>
                                        </div>

                                        <div class="grid grid-cols-2 gap-2 text-xs py-2 border-y border-slate-800">
                                            <div>
                                                <span class="text-slate-400">Amount:</span> <strong class="text-neonYellow">${formatCurrency(d.amount)}</strong>
                                            </div>
                                            <div>
                                                <span class="text-slate-400">Method:</span> <strong class="text-white">${escapeHTML(d.payment_method)}</strong>
                                            </div>
                                            <div class="col-span-2">
                                                <span class="text-slate-400">TID:</span> <strong class="font-mono text-white">${escapeHTML(d.transaction_id || 'N/A')}</strong>
                                            </div>
                                        </div>

                                        ${d.status === 'pending' ? `
                                            <div class="flex space-x-2 pt-1">
                                                <button onclick="approveDeposit('${d.id}', '${d.user_id}', ${d.amount})" class="flex-1 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold transition">Approve & Add Balance</button>
                                                <button onclick="rejectDeposit('${d.id}')" class="px-4 py-2 rounded-xl bg-rose-950/40 border border-rose-500/30 text-rose-400 hover:bg-rose-900/40 text-xs font-bold transition">Reject</button>
                                            </div>
                                        ` : `
                                            <div class="flex space-x-2 pt-1">
                                                <button onclick="deleteDeposit('${d.id}')" class="w-full py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white text-xs font-semibold transition">Delete Record</button>
                                            </div>
                                        `}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        async function approveDeposit(depositId, userId, amount) {
            setGlobalLoading(true, 'APPROVING DEPOSIT...');
            try {
                // Update deposit status
                const { error: depError } = await supabaseClient.from('deposit_requests').update({ status: 'approved' }).eq('id', depositId);
                if (depError) throw depError;

                // Fetch current user wallet balance
                const { data: userProfile, error: profError } = await supabaseClient.from('profiles').select('wallet_balance').eq('id', userId).single();
                if (profError) throw profError;

                const newBalance = Number(userProfile.wallet_balance || 0) + Number(amount);
                const { error: updateError } = await supabaseClient.from('profiles').update({ wallet_balance: newBalance }).eq('id', userId);
                if (updateError) throw updateError;

                showToast('Deposit approved and balance added successfully!', 'success');
                await fetchAdminData();
                renderCurrentView();
            } catch (err) {
                console.error('Approve deposit error:', err);
                showToast(err.message || 'Failed to approve deposit.', 'error');
            } finally {
                setGlobalLoading(false);
            }
        }

        async function rejectDeposit(depositId) {
            setGlobalLoading(true, 'REJECTING DEPOSIT...');
            try {
                const { error } = await supabaseClient.from('deposit_requests').update({ status: 'rejected' }).eq('id', depositId);
                if (error) throw error;

                showToast('Deposit request rejected.', 'success');
                await fetchAdminData();
                renderCurrentView();
            } catch (err) {
                console.error('Reject deposit error:', err);
                showToast(err.message || 'Failed to reject deposit.', 'error');
            } finally {
                setGlobalLoading(false);
            }
        }

        async function deleteDeposit(depositId) {
            if (!confirm('Delete this deposit record?')) return;
            setGlobalLoading(true, 'DELETING...');
            try {
                const { error } = await supabaseClient.from('deposit_requests').delete().eq('id', depositId);
                if (error) throw error;
                showToast('Deposit record deleted', 'success');
                await fetchAdminData();
                renderCurrentView();
            } catch (err) {
                showToast('Failed to delete deposit record', 'error');
            } finally {
                setGlobalLoading(false);
            }
        }

        function renderAdminUsers() {
            const users = state.usersCache;

            return `
                <div class="p-4 flex flex-col space-y-4">
                    <h2 class="heading-font font-bold text-xl text-white">Manage Users</h2>

                    <div class="flex flex-col space-y-3">
                        ${users.map(u => `
                            <div class="glass-card rounded-2xl p-4 border border-cardBorder space-y-3">
                                <div class="flex items-center justify-between">
                                    <h4 class="heading-font font-bold text-base text-white">${escapeHTML(u.username || 'Player')}</h4>
                                    <span class="text-xs font-bold text-neonYellow">${formatCurrency(u.wallet_balance)}</span>
                                </div>

                                <div class="grid grid-cols-2 gap-2 text-xs py-2 border-y border-slate-800">
                                    <div>
                                        <span class="text-slate-400">UID:</span> <strong class="font-mono text-white">${escapeHTML(u.free_fire_uid || 'N/A')}</strong>
                                    </div>
                                    <div>
                                        <span class="text-slate-400">IGN:</span> <strong class="text-white">${escapeHTML(u.free_fire_name || 'N/A')}</strong>
                                    </div>
                                </div>

                                <div class="flex space-x-2 pt-1">
                                    <button onclick="toggleUserBan('${u.id}', ${Boolean(u.is_banned)})" class="flex-1 py-2 rounded-xl ${u.is_banned ? 'bg-emerald-950/40 border border-emerald-500/30 text-emerald-400' : 'bg-rose-950/40 border border-rose-500/30 text-rose-400'} text-xs font-semibold transition">
                                        ${u.is_banned ? 'Unban User' : 'Ban User'}
                                    </button>
                                    <button onclick="deleteUser('${u.id}')" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white text-xs font-semibold transition">Delete</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        async function toggleUserBan(userId, currentStatus) {
            setGlobalLoading(true, 'UPDATING USER STATUS...');
            try {
                const { error } = await supabaseClient.from('profiles').update({ is_banned: !currentStatus }).eq('id', userId);
                if (error) throw error;
                showToast('User status updated successfully.', 'success');
                await fetchAdminData();
                renderCurrentView();
            } catch (err) {
                showToast('Failed to update user status.', 'error');
            } finally {
                setGlobalLoading(false);
            }
        }

        async function deleteUser(userId) {
            if (!confirm('Are you sure you want to delete this user profile?')) return;
            setGlobalLoading(true, 'DELETING USER...');
            try {
                const { error } = await supabaseClient.from('profiles').delete().eq('id', userId);
                if (error) throw error;
                showToast('User deleted successfully.', 'success');
                await fetchAdminData();
                renderCurrentView();
            } catch (err) {
                showToast('Failed to delete user.', 'error');
            } finally {
                setGlobalLoading(false);
            }
        }

        function renderAdminSettings() {
            const announcement = state.settingsCache.announcement_text || '';

            return `
                <div class="p-4 flex flex-col space-y-4">
                    <h2 class="heading-font font-bold text-xl text-white">Platform Settings</h2>

                    <form onsubmit="handleSettingsSubmit(event)" class="glass-card rounded-2xl p-4 border border-cardBorder space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">Announcement Marquee Text</label>
                            <textarea id="s-announcement" rows="3" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-neonRed">${escapeHTML(announcement)}</textarea>
                        </div>

                        <button type="submit" class="w-full py-3 rounded-xl bg-neonRed text-white text-xs font-bold shadow-lg neon-glow-red hover:bg-rose-600 transition">Save Settings</button>
                    </form>
                </div>
            `;
        }

        async function handleSettingsSubmit(e) {
            e.preventDefault();
            const announcementText = document.getElementById('s-announcement').value.trim();

            setGlobalLoading(true, 'SAVING SETTINGS...');
            try {
                const { error } = await supabaseClient
                    .from('site_settings')
                    .upsert({ key: 'announcement_text', value: announcementText }, { onConflict: 'key' });

                if (error) throw error;

                showToast('Settings saved successfully!', 'success');
                await fetchAdminData();
            } catch (err) {
                console.error('Settings save error:', err);
                showToast('Failed to save settings.', 'error');
            } finally {
                setGlobalLoading(false);
            }
        }
    </script>
</body>
</html>
