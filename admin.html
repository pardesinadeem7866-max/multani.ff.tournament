<!-- Admin Panel HTML Interface -->
<div id="adminPanelModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:99999; padding:16px; overflow-y:auto; color:#fff;">
  <div style="max-width:500px; margin:auto; background:#0d121a; border:1px solid #00e676; border-radius:12px; padding:16px;">
    
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #222; padding-bottom:10px; margin-bottom:12px;">
      <h3 style="color:#00e676; font-size:16px;"><i class="fa-solid fa-shield-halved"></i> Multani FF Admin Control Panel</h3>
      <i class="fa-solid fa-xmark" style="cursor:pointer; font-size:18px;" onclick="document.getElementById('adminPanelModal').style.display='none'"></i>
    </div>

    <!-- Admin Tabs Navigation -->
    <div style="display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;">
      <button onclick="switchAdminTab('tournaments')" style="flex:1; background:#00e676; color:#012817; border:none; padding:6px; font-weight:800; border-radius:6px; font-size:11px; cursor:pointer;">Tournaments</button>
      <button onclick="switchAdminTab('deposits')" style="flex:1; background:#1e293b; color:#fff; border:none; padding:6px; font-weight:800; border-radius:6px; font-size:11px; cursor:pointer;">Deposits</button>
      <button onclick="switchAdminTab('players')" style="flex:1; background:#1e293b; color:#fff; border:none; padding:6px; font-weight:800; border-radius:6px; font-size:11px; cursor:pointer;">Players & Joins</button>
      <button onclick="switchAdminTab('settings')" style="flex:1; background:#1e293b; color:#fff; border:none; padding:6px; font-weight:800; border-radius:6px; font-size:11px; cursor:pointer;">Settings/Ticker</button>
    </div>

    <!-- 1. Tournaments Management Section -->
    <div id="adminTabTournaments" class="admin-tab-content">
      <h4 style="font-size:13px; color:#ffb703; margin-bottom:8px;">Create New Tournament</h4>
      <div class="form-ctrl"><label>Tournament Title</label><input type="text" id="admNewTitle" placeholder="e.g. Daily Bermuda Clash Rs.1000"></div>
      <div class="form-ctrl"><label>Map & Type</label><input type="text" id="admNewMap" placeholder="Bermuda / Solo / Duo / Squad"></div>
      <div class="form-ctrl"><label>Time</label><input type="text" id="admNewTime" placeholder="e.g. 08:00 PM"></div>
      <div class="form-ctrl"><label>Entry Fee (Rs)</label><input type="number" id="admNewFee" placeholder="50"></div>
      <div class="form-ctrl"><label>Prize (Booyah Rs)</label><input type="number" id="admNewPrize" placeholder="500"></div>
      <div class="form-ctrl"><label>Total Slots</label><input type="number" id="admNewSlots" value="12"></div>
      <button class="btn-green-action" onclick="adminCreateTournament()">Add Tournament to DB</button>

      <h4 style="font-size:13px; color:#ffb703; margin:14px 0 8px;">Existing Tournaments List</h4>
      <div id="adminTournamentsList" style="display:flex; flex-direction:column; gap:8px; max-height:220px; overflow-y:auto;"></div>
    </div>

    <!-- 2. Wallet Deposits Approvals Section -->
    <div id="adminTabDeposits" class="admin-tab-content" style="display:none;">
      <h4 style="font-size:13px; color:#ffb703; margin-bottom:8px;">Pending Wallet Deposit Requests</h4>
      <div id="adminDepositsList" style="display:flex; flex-direction:column; gap:8px; max-height:300px; overflow-y:auto;"></div>
    </div>

    <!-- 3. Players & Match Joins Section -->
    <div id="adminTabPlayers" class="admin-tab-content" style="display:none;">
      <h4 style="font-size:13px; color:#ffb703; margin-bottom:8px;">Match Join Requests & Approvals</h4>
      <div id="adminMatchJoinsList" style="display:flex; flex-direction:column; gap:8px; max-height:300px; overflow-y:auto;"></div>
    </div>

    <!-- 4. Settings & Ticker Section -->
    <div id="adminTabSettings" class="admin-tab-content" style="display:none;">
      <h4 style="font-size:13px; color:#ffb703; margin-bottom:8px;">Update Live Ticker Banner</h4>
      <div class="form-ctrl"><label>Ticker Scrolling Text</label><input type="text" id="admTickerInput" placeholder="Welcome message..."></div>
      <button class="btn-green-action" onclick="adminSaveTicker()">Update Ticker</button>

      <h4 style="font-size:13px; color:#ffb703; margin:14px 0 8px;">Banned UIDs Control</h4>
      <div class="form-ctrl"><label>Ban Free Fire UID</label><input type="text" id="admBanUidInput" placeholder="Enter UID to ban"></div>
      <button onclick="adminBanUid()" style="width:100%; background:#ef4444; color:#fff; border:none; padding:10px; border-radius:8px; font-weight:800; cursor:pointer;">Ban UID</button>
    </div>

  </div>
</div>

<script>
  // Admin Panel Tab Switcher
  function switchAdminTab(tabName) {
    document.getElementById('adminTabTournaments').style.display = (tabName === 'tournaments') ? 'block' : 'none';
    document.getElementById('adminTabDeposits').style.display = (tabName === 'deposits') ? 'block' : 'none';
    document.getElementById('adminTabPlayers').style.display = (tabName === 'players') ? 'block' : 'none';
    document.getElementById('adminTabSettings').style.display = (tabName === 'settings') ? 'block' : 'none';

    if (tabName === 'tournaments') loadAdminTournamentsList();
    if (tabName === 'deposits') loadAdminDepositsList();
    if (tabName === 'players') loadAdminMatchJoinsList();
  }

  function openAdminPanel() {
    if (!currentUser || currentUser.email !== "mandoor@gmail.com") { // Aap apni admin email yahan set kar sakte hain
      let pass = prompt("Enter Admin Secret Code:");
      if (pass !== "mandoor123") {
        alert("❌ Unauthorized Access!");
        return;
      }
    }
    document.getElementById('adminPanelModal').style.display = 'block';
    switchAdminTab('tournaments');
  }

  // Tournament Management Functions
  function adminCreateTournament() {
    const title = document.getElementById('admNewTitle').value.trim();
    const map = document.getElementById('admNewMap').value.trim();
    const time = document.getElementById('admNewTime').value.trim();
    const fee = Number(document.getElementById('admNewFee').value);
    const prize = Number(document.getElementById('admNewPrize').value);
    const slots = Number(document.getElementById('admNewSlots').value) || 12;

    if (!title || !map || !time) {
      alert("Tamam fields bharna lazmi hain!");
      return;
    }

    let tournaments = JSON.parse(localStorage.getItem('mff_tournaments')) || [];
    tournaments.push({
      id: "m_" + Date.now(),
      title, map, time, fee, prize,
      totalSlots: slots,
      roomId: "",
      roomPass: "",
      players: []
    });

    localStorage.setItem('mff_tournaments', JSON.stringify(tournaments));
    alert("✅ Tournament successfully create ho gaya!");
    loadAdminTournamentsList();
    renderMatches();
  }

  function loadAdminTournamentsList() {
    let tournaments = JSON.parse(localStorage.getItem('mff_tournaments')) || [];
    const container = document.getElementById('adminTournamentsList');
    container.innerHTML = "";

    if (tournaments.length === 0) {
      container.innerHTML = `<div style="color:#94a3b8; font-size:11px;">Koi tournament mojood nahi hai.</div>`;
      return;
    }

    tournaments.forEach(m => {
      const div = document.createElement('div');
      div.style.cssText = "background:#03150d; border:1px solid rgba(0,230,118,0.2); border-radius:8px; padding:8px; font-size:11px;";
      div.innerHTML = `
        <div style="font-weight:900; color:#fff; margin-bottom:4px;">${m.title} (${m.map})</div>
        <div style="color:#94a3b8; font-size:10px; margin-bottom:6px;">Fee: Rs.${m.fee} | Prize: Rs.${m.prize} | Time: ${m.time}</div>
        <div style="display:flex; gap:6px;">
          <input type="text" id="roomId_${m.id}" placeholder="Room ID" value="${m.roomId || ''}" style="background:#000; color:#fff; border:1px solid #444; padding:3px; font-size:10px; flex:1;">
          <input type="text" id="roomPass_${m.id}" placeholder="Password" value="${m.roomPass || ''}" style="background:#000; color:#fff; border:1px solid #444; padding:3px; font-size:10px; flex:1;">
          <button onclick="adminSaveRoomCreds('${m.id}')" style="background:#00e676; color:#000; border:none; padding:4px 8px; border-radius:4px; font-weight:800; cursor:pointer; font-size:10px;">Save ID</button>
          <button onclick="adminDeleteTournament('${m.id}')" style="background:#ef4444; color:#fff; border:none; padding:4px 8px; border-radius:4px; font-weight:800; cursor:pointer; font-size:10px;">Delete</button>
        </div>
      `;
      container.appendChild(div);
    });
  }

  function adminSaveRoomCreds(id) {
    let tournaments = JSON.parse(localStorage.getItem('mff_tournaments')) || [];
    let m = tournaments.find(x => x.id === id);
    if (m) {
      m.roomId = document.getElementById(`roomId_${id}`).value.trim();
      m.roomPass = document.getElementById(`roomPass_${id}`).value.trim();
      localStorage.setItem('mff_tournaments', JSON.stringify(tournaments));
      alert("✅ Room ID aur Password update ho gaye!");
      renderMatches();
    }
  }

  function adminDeleteTournament(id) {
    if (!confirm("Kya aap is tournament ko delete karna chahte hain?")) return;
    let tournaments = JSON.parse(localStorage.getItem('mff_tournaments')) || [];
    tournaments = tournaments.filter(x => x.id !== id);
    localStorage.setItem('mff_tournaments', JSON.stringify(tournaments));
    loadAdminTournamentsList();
    renderMatches();
    alert("🗑️ Tournament delete kar diya gaya.");
  }

  // Deposit Approvals Management
  function loadAdminDepositsList() {
    let deposits = JSON.parse(localStorage.getItem('mff_wallet_deposits')) || [];
    const container = document.getElementById('adminDepositsList');
    container.innerHTML = "";

    let pending = deposits.filter(d => d.status === 'pending');
    if (pending.length === 0) {
      container.innerHTML = `<div style="color:#94a3b8; font-size:11px; text-align:center;">Koi pending deposit request nahi hai.</div>`;
      return;
    }

    pending.forEach(d => {
      const div = document.createElement('div');
      div.style.cssText = "background:#03150d; border:1px solid rgba(255,183,3,0.3); border-radius:8px; padding:10px; font-size:11px;";
      div.innerHTML = `
        <div style="font-weight:900; color:#ffb703; margin-bottom:2px;">${d.name} (UID: ${d.uid})</div>
        <div style="color:#fff; margin-bottom:4px;">Requested Amount: <b>Rs. ${d.requestedCoins}</b></div>
        <div style="margin-bottom:6px;"><img src="${d.screenshot}" style="max-height:80px; border-radius:6px; cursor:pointer;" onclick="openFullImage('${d.screenshot}')"></div>
        <div style="display:flex; gap:6px;">
          <button onclick="adminApproveDeposit('${d.id}')" style="flex:1; background:#10b981; color:#fff; border:none; padding:6px; border-radius:6px; font-weight:800; cursor:pointer;">Approve & Add Balance</button>
          <button onclick="adminRejectDeposit('${d.id}')" style="flex:1; background:#ef4444; color:#fff; border:none; padding:6px; border-radius:6px; font-weight:800; cursor:pointer;">Reject</button>
        </div>
      `;
      container.appendChild(div);
    });
  }

  function adminApproveDeposit(depId) {
    let deposits = JSON.parse(localStorage.getItem('mff_wallet_deposits')) || [];
    let dep = deposits.find(d => d.id === depId);
    if (!dep) return;

    let users = JSON.parse(localStorage.getItem('mff_accounts_db')) || [];
    let user = users.find(u => u.email === dep.email);
    if (user) {
      user.walletBalance = (Number(user.walletBalance) || 0) + Number(dep.requestedCoins);
      saveAllRegisteredUsers(users);
    }

    dep.status = "approved";
    localStorage.setItem('mff_wallet_deposits', JSON.stringify(deposits));
    alert(`✅ Rs. ${dep.requestedCoins} player ke wallet mein add kar diye gaye hain!`);
    loadAdminDepositsList();
  }

  function adminRejectDeposit(depId) {
    let deposits = JSON.parse(localStorage.getItem('mff_wallet_deposits')) || [];
    let dep = deposits.find(d => d.id === depId);
    if (dep) {
      dep.status = "rejected";
      localStorage.setItem('mff_wallet_deposits', JSON.stringify(deposits));
      alert("❌ Deposit request reject kar di gayi.");
      loadAdminDepositsList();
    }
  }

  // Match Joins Approvals Management
  function loadAdminMatchJoinsList() {
    let tournaments = JSON.parse(localStorage.getItem('mff_tournaments')) || [];
    const container = document.getElementById('adminMatchJoinsList');
    container.innerHTML = "";

    let hasPending = false;
    tournaments.forEach(m => {
      if (m.players) {
        m.players.forEach((p, idx) => {
          if (p.status === 'pending') {
            hasPending = true;
            const div = document.createElement('div');
            div.style.cssText = "background:#03150d; border:1px solid #38bdf8; border-radius:8px; padding:10px; font-size:11px; margin-bottom:6px;";
            div.innerHTML = `
              <div style="font-weight:900; color:#38bdf8;">Match: ${m.title}</div>
              <div style="color:#fff; margin-top:2px;">Player: ${p.name} (UID: ${p.uid})</div>
              <div style="color:#94a3b8; font-size:10px; margin-bottom:4px;">Phone: ${p.phone} | Squad: ${p.squadMembers || 'Solo'}</div>
              <div style="margin-bottom:6px;"><img src="${p.screenshot}" style="max-height:80px; border-radius:6px; cursor:pointer;" onclick="openFullImage('${p.screenshot}')"></div>
              <div style="display:flex; gap:6px;">
                <button onclick="adminApproveMatchJoin('${m.id}', '${p.uid}')" style="flex:1; background:#10b981; color:#fff; border:none; padding:6px; border-radius:6px; font-weight:800; cursor:pointer;">Approve Slot</button>
                <button onclick="adminRejectMatchJoin('${m.id}', '${p.uid}')" style="flex:1; background:#ef4444; color:#fff; border:none; padding:6px; border-radius:6px; font-weight:800; cursor:pointer;">Reject & Refund</button>
              </div>
            `;
            container.appendChild(div);
          }
        });
      }
    });

    if (!hasPending) {
      container.innerHTML = `<div style="color:#94a3b8; font-size:11px; text-align:center;">Koi pending join request nahi hai.</div>`;
    }
  }

  function adminApproveMatchJoin(matchId, uid) {
    let tournaments = JSON.parse(localStorage.getItem('mff_tournaments')) || [];
    let m = tournaments.find(x => x.id === matchId);
    if (m) {
      let p = m.players.find(x => x.uid === uid);
      if (p) {
        p.status = 'approved';
        localStorage.setItem('mff_tournaments', JSON.stringify(tournaments));
        recordPaymentHistory(p.email, p.uid, 'JOIN', m.title, m.fee, 'Approved');
        alert("✅ Player ka slot approve kar diya gaya!");
        loadAdminMatchJoinsList();
        renderMatches();
      }
    }
  }

  function adminRejectMatchJoin(matchId, uid) {
    let tournaments = JSON.parse(localStorage.getItem('mff_tournaments')) || [];
    let m = tournaments.find(x => x.id === matchId);
    if (m) {
      let pIdx = m.players.findIndex(x => x.uid === uid);
      if (pIdx !== -1) {
        let p = m.players[pIdx];
        // Refund fee to user wallet
        let users = JSON.parse(localStorage.getItem('mff_accounts_db')) || [];
        let user = users.find(u => u.email === p.email);
        if (user) {
          user.walletBalance = (Number(user.walletBalance) || 0) + Number(m.fee);
          saveAllRegisteredUsers(users);
        }
        m.players.splice(pIdx, 1);
        localStorage.setItem('mff_tournaments', JSON.stringify(tournaments));
        recordPaymentHistory(p.email, p.uid, 'REFUND', m.title, m.fee, 'Rejected & Refunded');
        alert("❌ Join request reject kar di gayi aur fee refund ho gayi.");
        loadAdminMatchJoinsList();
        renderMatches();
      }
    }
  }

  // Ticker & Banned UIDs Settings
  function adminSaveTicker() {
    const text = document.getElementById('admTickerInput').value.trim();
    if (!text) return;
    localStorage.setItem('mff_live_ticker', text);
    loadLiveTicker();
    alert("✅ Live ticker update ho gaya!");
  }

  function adminBanUid() {
    const uid = document.getElementById('admBanUidInput').value.trim();
    if (!uid) return;
    let banned = JSON.parse(localStorage.getItem('mff_banned_uids')) || [];
    if (!banned.includes(uid)) {
      banned.push(uid);
      localStorage.setItem('mff_banned_uids', JSON.stringify(banned));
      alert(`🚫 UID ${uid} successfully ban kar di gayi hai.`);
      document.getElementById('admBanUidInput').value = "";
    }
  }
</script>
