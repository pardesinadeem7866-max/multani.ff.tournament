<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multani FF Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0;
 font-family:Arial,sans-serif;
}

body{
 background:#030712;
 color:white;
 min-height:100vh;
 display:flex;
 justify-content:center;
 padding-bottom:70px;
}

.phone-frame{
 width:100%;
 max-width:420px;
 min-height:100vh;
 background:#091216;
 position:relative;
 overflow-x:hidden;
 box-shadow:0 0 30px rgba(0,243,255,.15);
}

:root{
 --blue:#00f3ff;
 --green:#00d084;
 --pink:#ff007f;
 --red:#e74c3c;
 --orange:#ffa500;
 --card:#0d1b22;
 --border:#162935;
 --muted:#8aa0ae;
}

.topbar{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:15px 14px;
 background:#0d1b22;
 border-bottom:1px solid var(--border);
 position:sticky;
 top:0;
 z-index:500;
}

.top-title{
 font-size:16px;
 font-weight:bold;
 color:var(--green);
}

.top-actions{
 display:flex;
 gap:7px;
}

.top-btn{
 border:1px solid #24404c;
 background:#14222b;
 color:white;
 width:34px;
 height:34px;
 border-radius:9px;
 cursor:pointer;
}

.top-btn:hover{
 border-color:var(--green);
 color:var(--green);
}

.stats-grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
 padding:12px;
}

.stat-card{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:14px;
 padding:11px 5px;
 text-align:center;
}

.stat-num{
 font-size:19px;
 font-weight:bold;
 margin-bottom:3px;
}

.stat-label{
 font-size:8px;
 color:var(--muted);
 text-transform:uppercase;
}

.dashboard-actions-box{
 background:white;
 color:#030712;
 border-radius:20px;
 padding:18px 12px;
 margin:10px 12px 15px;
 box-shadow:0 4px 20px rgba(0,0,0,.3);
}

.actions-grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:15px 8px;
 text-align:center;
}

.action-item{
 cursor:pointer;
 display:flex;
 flex-direction:column;
 align-items:center;
 position:relative;
}

.action-icon-circle{
 width:48px;
 height:48px;
 border-radius:50%;
 background:#f0f4f8;
 border:1px solid #d1d8e0;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:18px;
 color:#2c3e50;
 margin-bottom:6px;
}

.action-item:active .action-icon-circle{
 transform:scale(.94);
}

.action-text{
 font-size:9px;
 font-weight:bold;
 color:#2c3e50;
 line-height:1.2;
}

.badge-count{
 position:absolute;
 top:-2px;
 right:4px;
 background:var(--red);
 color:white;
 font-size:9px;
 padding:2px 5px;
 border-radius:10px;
 font-weight:bold;
}

.banner-btn{
 background:var(--card);
 border:1px solid var(--green);
 border-radius:14px;
 padding:12px;
 margin:0 12px 15px;
 display:flex;
 align-items:center;
 justify-content:center;
 gap:8px;
 color:var(--green);
 font-weight:bold;
 font-size:11px;
 cursor:pointer;
}

.section-title-bar{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin:15px 12px 10px;
}

.section-heading{
 font-size:13px;
 font-weight:bold;
 color:var(--orange);
 display:flex;
 align-items:center;
 gap:6px;
}

.add-match-btn{
 background:var(--green);
 color:#030712;
 border:none;
 padding:7px 11px;
 border-radius:8px;
 font-weight:bold;
 font-size:10px;
 cursor:pointer;
}

.admin-t-card{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:14px;
 padding:12px;
 margin:0 12px 12px;
}

.admin-t-header{
 display:flex;
 justify-content:space-between;
 align-items:flex-start;
 gap:8px;
}

.admin-t-info{
 flex:1;
}

.admin-t-info h4{
 font-size:13px;
 color:white;
}

.admin-t-info p{
 font-size:9px;
 color:var(--muted);
 margin-top:5px;
 line-height:1.5;
}

.admin-btn-group{
 display:flex;
 gap:5px;
}

.btn-edit,
.btn-delete{
 color:white;
 border:none;
 padding:6px 8px;
 border-radius:6px;
 font-size:9px;
 font-weight:bold;
 cursor:pointer;
}

.btn-edit{
 background:#27ae60;
}

.btn-delete{
 background:var(--red);
}

.room-details-box{
 background:#14222b;
 border:1px solid #1e3340;
 border-radius:8px;
 padding:9px;
 font-size:10px;
 color:var(--blue);
 margin-top:9px;
 line-height:1.6;
}

.room-subtext{
 font-size:9px;
 color:var(--muted);
 margin-top:3px;
}

.status-pill{
 display:inline-block;
 padding:3px 7px;
 border-radius:20px;
 font-size:8px;
 font-weight:bold;
 background:#162935;
 color:var(--green);
}

.modal-overlay{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.82);
 z-index:9999;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:15px;
}

.modal-box{
 background:#0d1b22;
 border:1px solid rgba(0,243,255,.3);
 border-radius:18px;
 padding:18px;
 width:100%;
 max-width:390px;
 max-height:90vh;
 overflow-y:auto;
}

.modal-header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:15px;
 font-weight:bold;
 font-size:14px;
 color:var(--green);
}

.modal-close{
 background:none;
 border:none;
 color:white;
 font-size:18px;
 cursor:pointer;
}

.admin-input{
 width:100%;
 padding:10px;
 background:#14222b;
 border:1px solid #1e3340;
 border-radius:8px;
 color:white;
 font-size:11px;
 margin-bottom:10px;
 outline:none;
}

.admin-input:focus{
 border-color:var(--green);
}

.admin-label{
 display:block;
 font-size:9px;
 color:var(--muted);
 margin-bottom:4px;
}

.list-item{
 background:#14222b;
 border:1px solid #1e3340;
 padding:10px;
 border-radius:10px;
 margin-bottom:8px;
}

.list-title{
 font-size:11px;
 font-weight:bold;
 color:white;
}

.list-info{
 font-size:9px;
 color:var(--muted);
 margin-top:4px;
 line-height:1.5;
}

.empty{
 text-align:center;
 padding:20px;
 color:var(--muted);
 font-size:11px;
}

.loading{
 text-align:center;
 padding:20px;
 color:var(--blue);
 font-size:11px;
}

.bottom-nav{
 position:fixed;
 bottom:0;
 left:50%;
 transform:translateX(-50%);
 width:100%;
 max-width:420px;
 background:#0d1b22;
 border-top:1px solid var(--border);
 display:flex;
 justify-content:space-around;
 padding:8px 0;
 z-index:800;
}

.nav-item{
 background:transparent;
 border:none;
 color:var(--muted);
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:3px;
 font-size:9px;
 font-weight:bold;
 cursor:pointer;
 flex:1;
}

.nav-item.active{
 color:var(--green);
}

.nav-item i{
 font-size:16px;
}

.hidden{
 display:none!important;
}

.success{
 color:var(--green);
}

.danger{
 color:var(--red);
}
</style>
</head>

<body>

<div class="phone-frame">

<!-- TOP BAR -->
<div class="topbar">
 <div class="top-title">
  <i class="fa-solid fa-shield-halved"></i>
  Multani FF Admin Panel
 </div>

 <div class="top-actions">
  <button class="top-btn" onclick="refreshAdmin()" title="Refresh">
   <i class="fa-solid fa-rotate"></i>
  </button>

  <button class="top-btn" onclick="logoutAdmin()" title="Logout">
   <i class="fa-solid fa-right-from-bracket"></i>
  </button>
 </div>
</div>

<!-- STATS -->
<div class="stats-grid">

 <div class="stat-card">
  <div class="stat-num" id="statLiveMatches">0</div>
  <div class="stat-label">
   <i class="fa-solid fa-gamepad" style="color:var(--blue)"></i>
   Matches
  </div>
 </div>

 <div class="stat-card">
  <div class="stat-num" id="statApprovedSlots">0</div>
  <div class="stat-label">
   <i class="fa-solid fa-users" style="color:var(--green)"></i>
   Players
  </div>
 </div>

 <div class="stat-card">
  <div class="stat-num" id="statPendingApprovals">0</div>
  <div class="stat-label">
   <i class="fa-solid fa-clock" style="color:var(--orange)"></i>
   Pending
  </div>
 </div>

</div>

<!-- ACTIONS -->
<div class="dashboard-actions-box">

 <div class="actions-grid">

  <div class="action-item" onclick="openCreateMatchModal()">
   <div class="action-icon-circle">
    <i class="fa-solid fa-plus"></i>
   </div>
   <div class="action-text">Create Match</div>
  </div>

  <div class="action-item" onclick="openGiveaways()">
   <div class="action-icon-circle">
    <i class="fa-solid fa-gift" style="color:#e74c3c"></i>
   </div>
   <div class="action-text">Giveaways</div>
  </div>

  <div class="action-item" onclick="openPaymentApprovals()">
   <div class="action-icon-circle">
    <i class="fa-solid fa-file-invoice-dollar"></i>
    <span class="badge-count" id="badgePayments">0</span>
   </div>
   <div class="action-text">Payments</div>
  </div>

  <div class="action-item" onclick="openBanPlayerModal()">
   <div class="action-icon-circle">
    <i class="fa-solid fa-user-slash" style="color:#e74c3c"></i>
   </div>
   <div class="action-text">Ban Player</div>
  </div>

  <div class="action-item" onclick="switchAdminTab('matches')">
   <div class="action-icon-circle">
    <i class="fa-solid fa-list-check"></i>
   </div>
   <div class="action-text">Match Manager</div>
  </div>

  <div class="action-item" onclick="openHelpChats()">
   <div class="action-icon-circle">
    <i class="fa-solid fa-comments" style="color:#27ae60"></i>
   </div>
   <div class="action-text">Help Chats</div>
  </div>

  <div class="action-item" onclick="openPlayerListModal()">
   <div class="action-icon-circle">
    <i class="fa-solid fa-address-book" style="color:#3498db"></i>
   </div>
   <div class="action-text">Players</div>
  </div>

  <div class="action-item" onclick="openWinnerModal()">
   <div class="action-icon-circle">
    <i class="fa-solid fa-trophy" style="color:#f1c40f"></i>
   </div>
   <div class="action-text">Winner</div>
  </div>

 </div>
</div>

<!-- PAYMENT BANNER -->
<div class="banner-btn" onclick="openPaymentApprovals()">
 <i class="fa-solid fa-file-invoice-dollar"></i>
 Payment Approvals & Match Requests
</div>

<!-- MATCH MANAGER -->
<div id="adminMatchManagerSection">

 <div class="section-title-bar">
  <div class="section-heading">
   <i class="fa-solid fa-gamepad"></i>
   Active Tournaments
  </div>

  <button class="add-match-btn" onclick="openCreateMatchModal()">
   + Add Match
  </button>
 </div>

 <div id="adminTournamentsList">
  <div class="loading">
   Loading tournaments...
  </div>
 </div>

</div>

<!-- MODAL CONTAINER -->
<div id="adminModalContainer"></div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">

 <button class="nav-item active" onclick="switchAdminTab('home',event)">
  <i class="fa-solid fa-house"></i>
  <span>Home</span>
 </button>

 <button class="nav-item" onclick="switchAdminTab('matches',event)">
  <i class="fa-solid fa-gamepad"></i>
  <span>Matches</span>
 </button>

 <button class="nav-item" onclick="switchAdminTab('banned',event)">
  <i class="fa-solid fa-ban"></i>
  <span>Banned</span>
 </button>

 <button class="nav-item" onclick="switchAdminTab('chats',event)">
  <i class="fa-solid fa-comments"></i>
  <span>Chats</span>
 </button>

</nav>

</div>

<script>

const SUPABASE_URL =
"https://eyrwqmirdigsckcwbmxn.supabase.co";

const SUPABASE_KEY =
"sb_publishable_N2bFvVebY84Ac4kF7KPYjw_1YCdUUHX";

const supabaseClient =
supabase.createClient(SUPABASE_URL,SUPABASE_KEY);


/* =========================
   ADMIN AUTH CHECK
========================= */

async function checkAdmin(){

 try{

  const {
   data:{session}
  } = await supabaseClient.auth.getSession();

  if(!session){

   alert("Admin login required.");

   window.location.href="index.html";
   return false;
  }

  const {
   data:admin,
   error
  } = await supabaseClient
   .from("admin_users")
   .select("id")
   .eq("id",session.user.id)
   .maybeSingle();

  if(error){

   console.error(error);

   alert("Admin verification error.");
   return false;
  }

  if(!admin){

   alert("Access denied. You are not an admin.");

   await supabaseClient.auth.signOut();

   window.location.href="index.html";

   return false;
  }

  return true;

 }catch(err){

  console.error(err);

  alert("Admin check failed.");

  return false;
 }
}


/* =========================
   START
========================= */

window.addEventListener("load",async()=>{

 const allowed=await checkAdmin();

 if(allowed){

  await loadAdminStatsAndTournaments();
  await loadPendingPayments();

 }

});


/* =========================
   REFRESH
========================= */

async function refreshAdmin(){

 const btn=document.querySelector(".top-btn i");

 if(btn){
  btn.classList.add("fa-spin");
 }

 await loadAdminStatsAndTournaments();
 await loadPendingPayments();

 if(btn){
  setTimeout(()=>{
   btn.classList.remove("fa-spin");
  },500);
 }
}


/* =========================
   LOGOUT
========================= */

async function logoutAdmin(){

 if(!confirm("Kya aap Admin Panel se logout karna chahte hain?")){
  return;
 }

 await supabaseClient.auth.signOut();

 window.location.href="index.html";
}


/* =========================
   NAVIGATION
========================= */

function switchAdminTab(tab,evt){

 if(evt){

  document
   .querySelectorAll(".nav-item")
   .forEach(el=>el.classList.remove("active"));

  evt.currentTarget.classList.add("active");
 }

 if(tab==="home"){

  document
   .getElementById("adminMatchManagerSection")
   .scrollIntoView({behavior:"smooth"});

 }

 if(tab==="matches"){

  document
   .getElementById("adminMatchManagerSection")
   .scrollIntoView({behavior:"smooth"});

  loadAdminStatsAndTournaments();

 }

 if(tab==="banned"){

  openBanPlayerModal();

 }

 if(tab==="chats"){

  openHelpChats();

 }
}


/* =========================
   DASHBOARD DATA
========================= */

async function loadAdminStatsAndTournaments(){

 const container=
 document.getElementById("adminTournamentsList");

 container.innerHTML=
 `<div class="loading">Loading tournaments...</div>`;

 try{

  const {data,error}=
   await supabaseClient
   .from("tournaments")
   .select("*")
   .order("match_date",{ascending:true});

  if(error){

   container.innerHTML=
   `<div class="empty">Error: ${escapeHtml(error.message)}</div>`;

   return;
  }

  document.getElementById("statLiveMatches")
   .textContent=data?.length||0;

  container.innerHTML="";

  if(!data||data.length===0){

   container.innerHTML=
   `<div class="empty">
    No tournaments found.<br><br>
    Create your first match using + Add Match.
   </div>`;

   return;
  }

  data.forEach(t=>{

   const card=document.createElement("div");

   card.className="admin-t-card";

   card.innerHTML=`

    <div class="admin-t-header">

     <div class="admin-t-info">

      <h4>
       ${escapeHtml(t.title||"Untitled")}
       (${escapeHtml(t.mode||"Solo")})
      </h4>

      <p>
       Map: ${escapeHtml(t.map||"Bermuda")}<br>
       Time:
       ${t.match_date
        ? new Date(t.match_date).toLocaleString()
        : "TBD"}<br>
       Entry Fee:
       Rs.${Number(t.entry_fee||0)} |
       Prize:
       Rs.${Number(t.prize_pool||0)}
      </p>

     </div>

     <div class="admin-btn-group">

      <button class="btn-edit"
       onclick='openEditMatchModal(${JSON.stringify(t)})'>
       Edit
      </button>

      <button class="btn-delete"
       onclick="deleteTournament('${t.id}')">
       Delete
      </button>

     </div>

    </div>

    <div class="room-details-box">

     Room ID:
     <b>${escapeHtml(t.room_id||"Not set")}</b>

     <br>

     Password:
     <b>${escapeHtml(t.room_password||"Not set")}</b>

     <div class="room-subtext">
      Edit se Room ID aur Password players ke liye update karein.
     </div>

    </div>
   `;

   container.appendChild(card);

  });

  await loadPlayerCount();

 }catch(err){

  console.error(err);

  container.innerHTML=
  `<div class="empty">Unexpected error occurred.</div>`;

 }
}


/* =========================
   PLAYER COUNT
========================= */

async function loadPlayerCount(){

 try{

  const {count,error}=
   await supabaseClient
   .from("tournament_participants")
   .select("*",{count:"exact",head:true});

  if(!error){

   document.getElementById("statApprovedSlots")
    .textContent=count||0;

  }

 }catch(e){

  console.log(e);

 }
}


/* =========================
   PAYMENT COUNT
========================= */

async function loadPendingPayments(){

 try{

  const {count,error}=
   await supabaseClient
   .from("payments")
   .select("*",{count:"exact",head:true})
   .eq("status","pending");

  if(!error){

   const total=count||0;

   document.getElementById("statPendingApprovals")
    .textContent=total;

   document.getElementById("badgePayments")
    .textContent=total;

  }

 }catch(e){

  console.log(e);

 }
}


/* =========================
   CREATE MATCH
========================= */

function openCreateMatchModal(){

 document.getElementById("adminModalContainer").innerHTML=`

 <div class="modal-overlay">

  <div class="modal-box">

   <div class="modal-header">

    <span>Create New Tournament</span>

    <button class="modal-close"
     onclick="closeAdminModal()">✕</button>

   </div>

   <label class="admin-label">Tournament Title</label>
   <input id="newTitle"
    class="admin-input"
    placeholder="Multani FF Solo">

   <label class="admin-label">Mode</label>
   <input id="newMode"
    class="admin-input"
    placeholder="Solo / Duo / Squad">

   <label class="admin-label">Map</label>
   <input id="newMap"
    class="admin-input"
    placeholder="Bermuda / Kalahari">

   <label class="admin-label">Entry Fee</label>
   <input id="newFee"
    type="number"
    class="admin-input"
    placeholder="Rs.">

   <label class="admin-label">Prize Pool</label>
   <input id="newPrize"
    type="number"
    class="admin-input"
    placeholder="Rs.">

   <label class="admin-label">Match Date & Time</label>
   <input id="newDate"
    type="datetime-local"
    class="admin-input">

   <button
    class="add-match-btn"
    style="width:100%;padding:11px"
    onclick="submitCreateMatch()">

    Publish Match

   </button>

  </div>

 </div>
 `;
}


async function submitCreateMatch(){

 const title=
 document.getElementById("newTitle").value.trim();

 const mode=
 document.getElementById("newMode").value.trim()||"Solo";

 const map=
 document.getElementById("newMap").value.trim()||"Bermuda";

 const entry_fee=
 Number(document.getElementById("newFee").value)||0;

 const prize_pool=
 Number(document.getElementById("newPrize").value)||0;

 const match_date=
 document.getElementById("newDate").value||null;

 if(!title){

  alert("Tournament title lazmi enter karein.");
  return;

 }

 const {error}=
 await supabaseClient
 .from("tournaments")
 .insert([{
  title,
  mode,
  map,
  entry_fee,
  prize_pool,
  match_date,
  room_id:"",
  room_password:""
 }]);

 if(error){

  alert("Error: "+error.message);
  return;

 }

 alert("✅ Tournament successfully created.");

 closeAdminModal();

 loadAdminStatsAndTournaments();

}


/* =========================
   EDIT MATCH
========================= */

function openEditMatchModal(t){

 document.getElementById("adminModalContainer").innerHTML=`

 <div class="modal-overlay">

  <div class="modal-box">

   <div class="modal-header">

    <span>Edit Tournament</span>

    <button class="modal-close"
     onclick="closeAdminModal()">✕</button>

   </div>

   <label class="admin-label">Title</label>
   <input id="editTitle"
    class="admin-input"
    value="${escapeAttr(t.title||"")}">

   <label class="admin-label">Mode</label>
   <input id="editMode"
    class="admin-input"
    value="${escapeAttr(t.mode||"")}">

   <label class="admin-label">Map</label>
   <input id="editMap"
    class="admin-input"
    value="${escapeAttr(t.map||"")}">

   <label class="admin-label">Entry Fee</label>
   <input id="editFee"
    type="number"
    class="admin-input"
    value="${Number(t.entry_fee||0)}">

   <label class="admin-label">Prize Pool</label>
   <input id="editPrize"
    type="number"
    class="admin-input"
    value="${Number(t.prize_pool||0)}">

   <label class="admin-label">Room ID</label>
   <input id="editRoomId"
    class="admin-input"
    value="${escapeAttr(t.room_id||"")}"
    placeholder="Room ID">

   <label class="admin-label">Room Password</label>
   <input id="editRoomPass"
    class="admin-input"
    value="${escapeAttr(t.room_password||"")}"
    placeholder="Room Password">

   <button
    class="btn-edit"
    style="width:100%;padding:11px"
    onclick="submitEditMatch('${t.id}')">

    Save Changes

   </button>

  </div>

 </div>
 `;
}


async function submitEditMatch(id){

 const title=
 document.getElementById("editTitle").value.trim();

 const mode=
 document.getElementById("editMode").value.trim();

 const map=
 document.getElementById("editMap").value.trim();

 const entry_fee=
 Number(document.getElementById("editFee").value)||0;

 const prize_pool=
 Number(document.getElementById("editPrize").value)||0;

 const room_id=
 document.getElementById("editRoomId").value.trim();

 const room_password=

/* =========================
   PAYMENTS
========================= */

async function openPaymentApprovals(){

 const {data,error}=
 await supabaseClient
 .from("payments")
 .select("*")
 .order("created_at",{ascending:false});

 if(error){

  showModal(`
   <div class="empty">
    ${escapeHtml(error.message)}
   </div>
  `,"Payment Approvals");

  return;
 }

 let html="";

 if(!data||data.length===0){

  html=
  `<div class="empty">
   No payment requests found.
  </div>`;

 }else{

  data.forEach(p=>{

   html+=`

    <div class="list-item">

     <div class="list-title">
      Rs. ${Number(p.amount||0)}
     </div>

     <div class="list-info">
      Status:
      <b class="${p.status==="approved"?"success":"danger"}">
       ${escapeHtml(p.status||"pending")}
      </b>
     </div>

     ${
      p.status==="pending"
      ?
      `<button
       class="add-match-btn"
       style="margin-top:8px"
       onclick="approvePayment('${p.id}')">
       Approve Payment
      </button>`
      :
      ""
     }

    </div>

   `;

  });

 }

 showModal(html,"Payment Approvals");

}


async function approvePayment(id){

 if(!confirm("Payment approve karna hai?")){
  return;
 }

 const {error}=
 await supabaseClient
 .from("payments")
 .update({status:"approved"})
 .eq("id",id);

 if(error){

  alert("Error: "+error.message);
  return;

 }

 alert("✅ Payment approved.");

 await loadPendingPayments();

 openPaymentApprovals();

}

async function banPlayer(){

 document.getElementById("banUID").value.trim();

 await supabaseClient
 .from("banned_uids")
 .insert([{

 }]);

  alert("Ban error: "+error.message);
  return;

 }

 alert("🚫 Player banned successfully.");

 closeAdminModal();

}


async function showBannedPlayers(){

 const {data,error}=
 await supabaseClient
 .from("banned_uids")
 .select("*")
 .order("id",{ascending:false});

 if(error){

  showModal(
   `<div class="empty">${escapeHtml(error.message)}</div>`,

 let html="";

 if(!data||data.length===0){

  html=`<div class="empty">No banned players.</div>`;

}

async function announceWinner(){

 const tournament_id=
 document.getElementById("winnerTournament").value.trim();

 const ign=
 document.getElementById("winnerIGN").value.trim();

 const uid=
 document.getElementById("winnerUID").value.trim();

 const prize_amount=
 Number(document.getElementById("winnerPrize").value)||0;

 if(!tournament_id||!ign){

  alert("Tournament ID aur Winner IGN lazmi enter karein.");
  return;

 }

 /*
   IMPORTANT:
   winners table agar abhi database mein nahi hai
   to yahan error aa sakta hai.
 */

 const {error}=
 await supabaseClient
 .from("winners")
 .insert([{
  tournament_id,
  ign,
  free_fire_uid:uid,
  prize_amount
 }]);

 if(error){

  alert(
   "Winner save nahi hua:\n"+
   error.message+
   "\n\nWinners table database mein create karni hogi."
  );

  return;

 }

 alert("🏆 Winner successfully announced.");

 closeAdminModal();

}

function closeAdminModal(){

 document.getElementById("adminModalContainer").innerHTML="";

}


/* =========================
   SECURITY HELPERS
========================= */

function escapeHtml(value){

 return String(value??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");

}


function escapeAttr(value){

 return escapeHtml(value);

}
