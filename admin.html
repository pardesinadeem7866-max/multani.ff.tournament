<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multani FF Admin Control Center</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16',
                        cardBg: '#131b2e',
                        cardBorder: '#1e293b',
                        neonRed: '#ff2a5f',
                        neonYellow: '#ffbe0b',
                        neonGreen: '#06d6a0',
                        accentBlue: '#3a86ff'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #090d16;
            color: #f8fafc;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        .heading-font {
            font-family: 'Rajdhani', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 2px;
        }
        .glass-card {
            background: rgba(19, 27, 46, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .neon-glow-red {
            box-shadow: 0 0 15px rgba(255, 42, 95, 0.3);
        }
        .neon-glow-yellow {
            box-shadow: 0 0 15px rgba(255, 190, 11, 0.3);
        }
    </style>
</head>
<body class="pb-24 select-none">

    <!-- Global Loading Overlay -->
    <div id="global-loader" class="fixed inset-0 z-50 bg-darkBg/90 backdrop-blur-md flex flex-col items-center justify-center transition-opacity duration-300 hidden">
        <div class="relative w-16 h-16 mb-4">
            <div class="absolute inset-0 border-4 border-neonRed/20 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-neonRed rounded-full border-t-transparent animate-spin"></div>
        </div>
        <p id="loader-text" class="heading-font text-lg tracking-wider text-slate-300 font-semibold animate-pulse">PROCESSING ADMIN ACTION...</p>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-11/12 max-w-md flex flex-col gap-2 pointer-events-none"></div>

    <!-- MAIN APP CONTAINER -->
    <div id="app" class="relative w-full min-h-screen flex flex-col">

        <!-- HEADER -->
        <header class="sticky top-0 z-30 glass-card px-4 py-3 flex items-center justify-between border-b border-cardBorder">
            <div class="flex items-center space-x-3">
                <div id="back-btn-container" class="hidden">
                    <button onclick="goBack()" class="w-9 h-9 rounded-xl bg-slate-800/80 border border-slate-700 flex items-center justify-center text-slate-200 hover:bg-slate-700 active:scale-95 transition">
                        <i class="fa-solid fa-arrow-left text-sm"></i>
                    </button>
                </div>
                <div class="flex items-center space-x-2">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-neonRed to-neonYellow p-0.5 flex items-center justify-center shadow-lg neon-glow-red">
                        <div class="w-full h-full bg-darkBg rounded-[10px] flex items-center justify-center">
                            <i class="fa-solid fa-shield-halved text-neonRed text-sm"></i>
                        </div>
                    </div>
                    <div>
                        <h1 class="heading-font font-bold text-lg tracking-wider bg-gradient-to-r from-white via-slate-200 to-neonRed bg-clip-text text-transparent leading-none">ADMIN PANEL</h1>
                        <span class="text-[10px] text-neonYellow font-semibold tracking-widest uppercase">Multani FF Control</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <button onclick="navigateTo('user-home')" class="px-2.5 py-1.5 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 text-xs font-semibold flex items-center space-x-1 hover:bg-slate-700 transition">
                    <i class="fa-solid fa-house"></i>
                    <span>App</span>
                </button>
            </div>
        </header>

        <!-- DYNAMIC VIEWS CONTAINER -->
        <main id="main-content" class="flex-1 flex flex-col pb-16">
            <!-- Content injected dynamically via JS router -->
        </main>

        <!-- BOTTOM NAVIGATION BAR (New 4 Buttons) -->
        <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 max-w-[480px] mx-auto glass-card border-t border-cardBorder px-2 py-2 z-40 flex items-center justify-around">
            <button onclick="navigateTo('admin-dashboard')" data-nav="admin-dashboard" class="nav-item flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-neonRed transition">
                <i class="fa-solid fa-house text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium tracking-wide">Home</span>
            </button>
            <button onclick="navigateTo('admin-tournaments-list')" data-nav="admin-tournaments-list" class="nav-item flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-neonRed transition">
                <i class="fa-solid fa-gamepad text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium tracking-wide">Tournament</span>
            </button>
            <button onclick="navigateTo('admin-users')" data-nav="admin-users" class="nav-item flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-neonRed transition">
                <i class="fa-solid fa-users-gear text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium tracking-wide">User List Ban/Unban</span>
            </button>
            <button onclick="navigateTo('admin-giveaways')" data-nav="admin-giveaways" class="nav-item flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-neonRed transition">
                <i class="fa-solid fa-gift text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium tracking-wide">Giveaways</span>
            </button>
        </nav>

    </div>

    <!-- MODAL ROOT -->
    <div id="modal-root" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden"></div>

    <!-- JAVASCRIPT ADMIN APPLICATION CORE -->
    <script>
        const SUPABASE_URL = 'https://eyrwqmirdigsckcwbmxn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_N2bFvVebY84Ac4kF7KPYjw_1YCdUUHX';

        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: true, autoRefreshToken: true }
        });

        let state = {
            currentUser: null,
            isAdmin: true,
            currentView: 'admin-dashboard',
            currentParams: {},
            navigationHistory: [],
            tournamentsCache: [],
            depositsCache: [],
            usersCache: [],
            winnersCache: [],
            settingsCache: {}
        };

        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-slate-800 border-slate-700 text-slate-200';
            let icon = 'fa-info-circle text-accentBlue';
            if (type === 'success') {
                bgClass = 'bg-emerald-950/90 border-emerald-500/30 text-emerald-200';
                icon = 'fa-circle-check text-neonGreen';
            } else if (type === 'error') {
                bgClass = 'bg-rose-950/90 border-rose-500/30 text-rose-200';
                icon = 'fa-triangle-exclamation text-neonRed';
            }

            toast.className = `pointer-events-auto flex items-center space-x-3 px-4 py-3 rounded-xl border shadow-xl backdrop-blur-md transition-all duration-300 transform translate-y-2 opacity-0 ${bgClass}`;
            toast.innerHTML = `
                <i class="fa-solid ${icon} text-base flex-shrink-0"></i>
                <span class="text-xs font-medium flex-1">${escapeHTML(message)}</span>
            `;

            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function setGlobalLoading(isLoading, text = 'PROCESSING...') {
            const loader = document.getElementById('global-loader');
            const loaderText = document.getElementById('loader-text');
            if (isLoading) {
                loaderText.textContent = text;
                loader.classList.remove('hidden');
            } else {
                loader.classList.add('hidden');
            }
        }

        function formatCurrency(amount) {
            return `Rs. ${Number(amount || 0).toLocaleString()}`;
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'TBD';
            const d = new Date(dateStr);
            return isNaN(d.getTime()) ? dateStr : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function navigateTo(viewName, params = {}, pushHistory = true) {
            if (viewName === 'user-home') {
                window.location.href = 'index.html';
                return;
            }
            if (pushHistory && state.currentView) {
                state.navigationHistory.push({ view: state.currentView, params: state.currentParams || {} });
            }
            state.currentView = viewName;
            state.currentParams = params;
            renderCurrentView();
            updateBottomNavActiveState();
            updateBackButtonVisibility();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goBack() {
            if (state.navigationHistory.length > 0) {
                const prev = state.navigationHistory.pop();
                state.currentView = prev.view;
                state.currentParams = prev.params;
                renderCurrentView();
                updateBottomNavActiveState();
                updateBackButtonVisibility();
            } else {
                navigateTo('admin-dashboard', {}, false);
            }
        }

        function updateBackButtonVisibility() {
            const backContainer = document.getElementById('back-btn-container');
            if (state.currentView === 'admin-dashboard') {
                backContainer.classList.add('hidden');
            } else {
                backContainer.classList.remove('hidden');
            }
        }

        function updateBottomNavActiveState() {
            document.querySelectorAll('.nav-item').forEach(btn => {
                const nav = btn.getAttribute('data-nav');
                if (nav === state.currentView) {
                    btn.classList.add('text-neonRed');
                    btn.classList.remove('text-slate-400');
                } else {
                    btn.classList.remove('text-neonRed');
                    btn.classList.add('text-slate-400');
                }
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            setGlobalLoading(true, 'LOADING ADMIN PANEL...');
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session?.user) {
                    state.currentUser = session.user;
                }
                await fetchAdminData();
                navigateTo('admin-dashboard', {}, false);
            } catch (err) {
                console.error('Admin init error:', err);
                showToast('Data load warning.', 'error');
                navigateTo('admin-dashboard', {}, false);
            } finally {
                setGlobalLoading(false);
            }
        });

        async function fetchAdminData() {
            try {
                const [tourns, deposits, users, winners, settings] = await Promise.all([
                    supabaseClient.from('tournaments').select('*').order('match_date', { ascending: false }),
                    supabaseClient.from('deposit_requests').select('*, profiles(username, free_fire_uid)').order('created_at', { ascending: false }),
                    supabaseClient.from('profiles').select('*').order('created_at', { ascending: false }),
                    supabaseClient.from('winners').select('*').order('created_at', { ascending: false }),
                    supabaseClient.from('site_settings').select('*')
                ]);

                state.tournamentsCache = tourns.data || [];
                state.depositsCache = deposits.data || [];
                state.usersCache = users.data || [];
                state.winnersCache = winners.data || [];

                if (settings.data) {
                    settings.data.forEach(s => {
                        if (s.key) state.settingsCache[s.key] = s.value;
                    });
                }
            } catch (err) {
                console.error('Fetch admin data error:', err);
            }
        }

        function renderCurrentView() {
            const container = document.getElementById('main-content');

            switch (state.currentView) {
                case 'admin-dashboard':
                    container.innerHTML = renderAdminDashboard();
                    break;
                case 'admin-winner-announcement':
                    container.innerHTML = renderWinnerAnnouncementPage();
                    break;
                case 'admin-register-players':
                    container.innerHTML = renderRegisterPlayerListPage();
                    break;
                case 'admin-tournaments-list':
                    container.innerHTML = renderTournamentsSubPage();
                    break;
                case 'admin-create-tournament':
                    container.innerHTML = renderAdminTournamentForm();
                    break;
                case 'admin-edit-tournament':
                    container.innerHTML = renderAdminTournamentForm(state.currentParams?.id);
                    break;
                case 'admin-chat':
                    container.innerHTML = renderChatPage();
                    break;
                case 'admin-payment':
                    container.innerHTML = renderPaymentPage();
                    break;
                case 'admin-users':
                    container.innerHTML = renderAdminUsers();
                    break;
                case 'admin-giveaways':
                    container.innerHTML = renderGiveawaysPage();
                    break;
                case 'admin-deposits':
                    container.innerHTML = renderAdminDeposits();
                    break;
                default:
                    container.innerHTML = renderAdminDashboard();
            }
        }

        // ==================== VIEWS ====================

        function renderAdminDashboard() {
            const totalTourneys = state.tournamentsCache.length;
            const activeTourneys = state.tournamentsCache.filter(t => t.status === 'live' || t.status === 'upcoming').length;
            const pendingDeposits = state.depositsCache.filter(d => d.status === 'pending').length;
            const totalUsers = state.usersCache.length;

            return `
                <div class="p-3 flex flex-col space-y-3">
                    <!-- 4 Compact Stats Boxes -->
                    <div class="grid grid-cols-2 gap-2">
                        <div class="glass-card rounded-xl p-2.5 border border-cardBorder">
                            <span class="text-[9px] text-slate-400 font-medium block">Total Tournaments</span>
                            <span class="heading-font font-bold text-lg text-neonYellow">${totalTourneys}</span>
                            <span class="text-[8px] text-emerald-400 mt-0.5 block">${activeTourneys} Active/Upcoming</span>
                        </div>
                        <div class="glass-card rounded-xl p-2.5 border border-cardBorder">
                            <span class="text-[9px] text-slate-400 font-medium block">Pending Deposits</span>
                            <span class="heading-font font-bold text-lg text-neonRed">${pendingDeposits}</span>
                            <span class="text-[8px] text-slate-400 mt-0.5 block">Requires action</span>
                        </div>
                        <div class="glass-card rounded-xl p-2.5 border border-cardBorder">
                            <span class="text-[9px] text-slate-400 font-medium block">Total Users</span>
                            <span class="heading-font font-bold text-lg text-white">${totalUsers}</span>
                            <span class="text-[8px] text-slate-400 mt-0.5 block">Registered players</span>
                        </div>
                        <div class="glass-card rounded-xl p-2.5 border border-cardBorder">
                            <span class="text-[9px] text-slate-400 font-medium block">Platform Status</span>
                            <span class="heading-font font-bold text-sm text-neonGreen">ONLINE</span>
                            <span class="text-[8px] text-slate-400 mt-0.5 block">Supabase Connected</span>
                        </div>
                    </div>

                    <!-- 6 Feature Buttons -->
                    <div class="glass-card rounded-2xl p-3.5 border border-cardBorder space-y-2.5">
                        <h3 class="heading-font font-bold text-sm text-white">Admin Control Modules</h3>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="navigateTo('admin-winner-announcement')" class="py-2.5 px-2 rounded-xl bg-slate-800/90 border border-slate-700/80 text-white text-xs font-semibold flex flex-col items-center justify-center space-y-1 hover:bg-slate-700 hover:border-neonYellow/50 transition active:scale-95">
                                <i class="fa-solid fa-trophy text-neonYellow text-sm"></i>
                                <span class="text-center">Winner Announcement</span>
                            </button>
                            <button onclick="navigateTo('admin-register-players')" class="py-2.5 px-2 rounded-xl bg-slate-800/90 border border-slate-700/80 text-white text-xs font-semibold flex flex-col items-center justify-center space-y-1 hover:bg-slate-700 hover:border-accentBlue/50 transition active:scale-95">
                                <i class="fa-solid fa-users-rectangle text-accentBlue text-sm"></i>
                                <span class="text-center">Register Player List</span>
                            </button>
                            <button onclick="navigateTo('admin-tournaments-list')" class="py-2.5 px-2 rounded-xl bg-slate-800/90 border border-slate-700/80 text-white text-xs font-semibold flex flex-col items-center justify-center space-y-1 hover:bg-slate-700 hover:border-neonRed/50 transition active:scale-95">
                                <i class="fa-solid fa-gamepad text-neonRed text-sm"></i>
                                <span class="text-center">Tournaments</span>
                            </button>
                            <button onclick="navigateTo('admin-chat')" class="py-2.5 px-2 rounded-xl bg-slate-800/90 border border-slate-700/80 text-white text-xs font-semibold flex flex-col items-center justify-center space-y-1 hover:bg-slate-700 hover:border-emerald-400/50 transition active:scale-95">
                                <i class="fa-solid fa-comments text-emerald-400 text-sm"></i>
                                <span class="text-center">Chat</span>
                            </button>
                            <button onclick="navigateTo('admin-payment')" class="py-2.5 px-2 rounded-xl bg-slate-800/90 border border-slate-700/80 text-white text-xs font-semibold flex flex-col items-center justify-center space-y-1 hover:bg-slate-700 hover:border-neonYellow/50 transition active:scale-95">
                                <i class="fa-solid fa-wallet text-neonYellow text-sm"></i>
                                <span class="text-center">Payment</span>
                            </button>
                            <button onclick="navigateTo('admin-users')" class="py-2.5 px-2 rounded-xl bg-slate-800/90 border border-slate-700/80 text-white text-xs font-semibold flex flex-col items-center justify-center space-y-1 hover:bg-slate-700 hover:border-purple-400/50 transition active:scale-95">
                                <i class="fa-solid fa-users-gear text-purple-400 text-sm"></i>
                                <span class="text-center">User List & Ban</span>
                            </button>
                        </div>
                    </div>

                    <div class="glass-card rounded-2xl p-3.5 border border-cardBorder space-y-2.5">
                        <h3 class="heading-font font-bold text-sm text-white">Quick Shortcuts</h3>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="navigateTo('admin-create-tournament')" class="py-2 px-2.5 rounded-xl bg-neonRed text-white text-xs font-semibold flex items-center justify-center space-x-1.5 shadow-lg neon-glow-red hover:bg-rose-600 transition">
                                <i class="fa-solid fa-plus-circle"></i>
                                <span>Create Match</span>
                            </button>
                            <button onclick="navigateTo('admin-deposits')" class="py-2 px-2.5 rounded-xl bg-slate-800 border border-slate-700 text-slate-200 text-xs font-semibold flex items-center justify-center space-x-1.5 hover:bg-slate-700 transition">
                                <i class="fa-solid fa-wallet"></i>
                                <span>Verify Deposits</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- SUB-PAGES ---

        function renderWinnerAnnouncementPage() {
            const winners = state.winnersCache || [];

            return `
                <div class="p-4 flex flex-col space-y-4">
                    <div class="flex items-center space-x-3">
                        <button onclick="goBack()" class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-200 hover:bg-slate-700 transition">
                            <i class="fa-solid fa-arrow-left text-sm"></i>
                        </button>
                        <h2 class="heading-font font-bold text-xl text-white">Winner Announcement</h2>
                    </div>

                    <form onsubmit="handleWinnerSubmit(event)" class="glass-card rounded-2xl p-4 border border-cardBorder space-y-3">
                        <h3 class="font-bold text-xs text-neonYellow uppercase tracking-wider">Publish New Winner</h3>
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">Player Name</label>
                            <input type="text" id="w-name" required placeholder="Enter player name" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-neonRed">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">Free Fire UID</label>
                            <input type="text" id="w-uid" required placeholder="Enter Free Fire UID" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-neonRed">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">Payment Screenshot</label>
                            <input type="file" id="w-proof-file" accept="image/*" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-300 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-neonRed file:text-white hover:file:bg-rose-600 focus:outline-none">
                        </div>
                        <button type="submit" class="w-full py-2.5 rounded-xl bg-neonRed text-white text-xs font-bold shadow-lg neon-glow-red hover:bg-rose-600 transition">Publish Announcement</button>
                    </form>

                    <div class="space-y-2">
                        <h3 class="font-bold text-xs text-slate-400 uppercase tracking-wider">Recent Announcements</h3>
                        ${winners.length === 0 ? `<p class="text-xs text-slate-500">No winners announced yet.</p>` : winners.map(w => `
                            <div class="glass-card rounded-xl p-3 border border-cardBorder flex justify-between items-center text-xs">
                                <div>
                                    <strong class="text-white">${escapeHTML(w.player_name)}</strong> (UID: ${escapeHTML(w.free_fire_uid)})
                                    <div class="text-[10px] text-slate-400">Proof: ${w.payment_proof ? `<a href="${escapeHTML(w.payment_proof)}" target="_blank" class="text-neonYellow underline">View Image</a>` : 'N/A'}</div>
                                </div>
                                <button onclick="deleteWinner('${w.id}')" class="text-rose-400 hover:text-rose-300 text-xs px-2 py-1"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        async function handleWinnerSubmit(e) {
            e.preventDefault();
            const playerName = document.getElementById('w-name').value.trim();
            const freeFireUid = document.getElementById('w-uid').value.trim();
            const fileInput = document.getElementById('w-proof-file');
            
            setGlobalLoading(true, 'UPLOADING & PUBLISHING...');
            try {
                let proofUrl = '';
                if (fileInput.files && fileInput.files[0]) {
                    const file = fileInput.files[0];
                    proofUrl = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(file);
                    });
                }

                const { error } = await supabaseClient.from('winners').insert({
                    player_name: playerName,
                    free_fire_uid: freeFireUid,
                    payment_proof: proofUrl
                });

        async function handleTournamentSubmit(e, tournamentId) {
            e.preventDefault();
            const title = document.getElementById('t-title').value.trim();
            const game = document.getElementById('t-game').value.trim();
            const mode = document.getElementById('t-mode').value;
            const mapFilter = document.getElementById('t-map').value;
            const prizePool = parseFloat(document.getElementById('t-prize').value);
            const entryFee = parseFloat(document.getElementById('t-fee').value);
            const maxPlayers = parseInt(document.getElementById('t-max').value);
            const status = document.getElementById('t-status').value;
            const matchDate = document.getElementById('t-date').value;
            const roomId = document.getElementById('t-room').value.trim();
            const roomPassword = document.getElementById('t-pass').value.trim();
            const description = document.getElementById('t-desc').value.trim();

            setGlobalLoading(true, 'SAVING TOURNAMENT...');
            try {
                const payload = {
                    title, game, mode, map: mapFilter, prize_pool: prizePool, entry_fee: entryFee,
                    max_players: maxPlayers, status, match_date: matchDate,
                    room_id: roomId || null, room_password: roomPassword || null, description
                };

                let error;
                if (tournamentId) {
                    const res = await supabaseClient.from('tournaments').update(payload).eq('id', tournamentId);
                    error = res.error;
                } else {
                    const res = await supabaseClient.from('tournaments').insert(payload);
                    error = res.error;
                }

                if (error) throw error;

                showToast('Tournament saved successfully!', 'success');
                await fetchAdminData();
                navigateTo('admin-tournaments-list');
            } catch (err) {
                console.error('Save tournament error:', err);
                showToast(err.message || 'Failed to save tournament.', 'error');
            } finally {
                setGlobalLoading(false);
            }
        }

        async function approveDeposit(depositId, userId, amount) {
            setGlobalLoading(true, 'APPROVING DEPOSIT...');
            try {
                const { error: depError } = await supabaseClient.from('deposit_requests').update({ status: 'approved' }).eq('id', depositId);
                if (depError) throw depError;

                const { data: userProfile, error: profError } = await supabaseClient.from('profiles').select('wallet_balance').eq('id', userId).single();
                if (profError) throw profError;

                const newBalance = Number(userProfile.wallet_balance || 0) + Number(amount);
                const { error: updateError } = await supabaseClient.from('profiles').update({ wallet_balance: newBalance }).eq('id', userId);
                if (updateError) throw updateError;

                showToast('Deposit approved and balance added successfully!', 'success');
                await fetchAdminData();
                renderCurrentView();
            } catch (err) {
                console.error('Approve deposit error:', err);
                showToast(err.message || 'Failed to approve deposit.', 'error');
            } finally {
                setGlobalLoading(false);
            }
        }

                                    </div>
                                    <div>
                                        <span class="text-slate-400">Gmail:</span> <strong class="text-white">${escapeHTML(u.email || u.gmail || 'N/A')}</strong>
                                    </div>
                                </div>

                                <div class="flex space-x-2 pt-1">
                                    <button onclick="toggleUserBan('${u.id}', ${Boolean(u.is_banned)})" class="flex-1 py-2 rounded-xl ${u.is_banned ? 'bg-emerald-950/40 border border-emerald-500/30 text-emerald-400' : 'bg-rose-950/40 border border-rose-500/30 text-rose-400'} text-xs font-semibold transition">
                                        ${u.is_banned ? 'Unban User' : 'Ban User'}
                                    </button>
                                    <button onclick="deleteUser('${u.id}')" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white text-xs font-semibold transition">Delete</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        async function toggleUserBan(userId, currentStatus) {
            setGlobalLoading(true, 'UPDATING USER STATUS...');
            try {
                const { error } = await supabaseClient.from('profiles').update({ is_banned: !currentStatus }).eq('id', userId);
                if (error) throw error;
                showToast('User status updated successfully.', 'success');
                await fetchAdminData();
                renderCurrentView();
            } catch (err) {
                showToast('Failed to update user status.', 'error');
            } finally {
                setGlobalLoading(false);
            }
        }

        async function deleteUser(userId) {
            if (!confirm('Are you sure you want to delete this user profile?')) return;
            setGlobalLoading(true, 'DELETING USER...');
            try {
                const { error } = await supabaseClient.from('profiles').delete().eq('id', userId);
                if (error) throw error;
                showToast('User deleted successfully.', 'success');
                await fetchAdminData();
                renderCurrentView();
            } catch (err) {
                showToast('Failed to delete user.', 'error');
            } finally {
                setGlobalLoading(false);
            }
        }
    </script>
</body>
</html>
