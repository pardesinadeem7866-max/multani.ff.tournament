<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multani.ff - Admin Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --admin-bg: #050b14;
      --card-bg: #0d1626;
      --card-border: #1c2b42;
      --mint: #00e676;
      --gold: #ffb703;
      --blue: #38bdf8;
      --red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--admin-bg); color: var(--text-main); min-height: 100vh; padding-bottom: 90px; display: flex; justify-content: center; }

    .app-viewport {
      width: 100%;
      max-width: 440px;
      background: #080e1a;
      min-height: 100vh;
      position: relative;
      border-left: 1px solid var(--card-border);
      border-right: 1px solid var(--card-border);
    }

    .hero-top-box {
      background: radial-gradient(circle at 50% 0%, #20132b 0%, #0d1626 70%);
      border-bottom: 1px solid var(--card-border);
      padding: 16px;
      margin-bottom: 12px;
    }
    .hero-top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .brand-title { font-size: 13px; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 6px; }
    
    .btn-pink-match {
      background: linear-gradient(135deg, #ec4899, #db2777);
      color: #fff; border: none; padding: 6px 14px; border-radius: 16px; font-size: 11px; font-weight: 900; cursor: pointer;
    }

    .content-section { padding: 0 16px; }
    .section-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; font-weight: 900; color: var(--gold); }
    
    .panel-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .form-ctrl { margin-bottom: 10px; }
    .form-ctrl label { font-size: 10.5px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 3px; }
    .form-ctrl input, .form-ctrl select {
      width: 100%;
      background: #050b14;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 10px;
      color: #fff;
      font-size: 12px;
      outline: none;
    }

    .btn-action {
      background: var(--mint); border: none; color: #012817; padding: 8px 10px; border-radius: 6px; font-size: 11px; font-weight: 900; cursor: pointer;
    }
    .btn-danger { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--red); color: var(--red); }
    .btn-orange { background: rgba(245, 158, 11, 0.2); border: 1px solid var(--gold); color: var(--gold); }

    .modal-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); z-index: 999; justify-content: center; align-items: center; padding: 16px;
    }
    .modal-dialog {
      background: var(--card-bg); border: 1px solid var(--card-border); width: 100%; max-width: 400px; border-radius: 14px; padding: 16px;
    }

    .bottom-nav {
      position: fixed; bottom: 0; width: 100%; max-width: 440px; height: 68px; background: rgba(13, 22, 38, 0.95); border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; align-items: center; z-index: 100;
    }
    .bot-tab { background: transparent; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
    .bot-tab.active { color: var(--mint); }
  </style>
</head>
<body>

  <div class="app-viewport">
    
    <div class="hero-top-box">
      <div class="hero-top-row">
        <div>
          <div class="brand-title"><i class="fa-solid fa-shield-halved" style="color:var(--mint);"></i> Multani.ff Admin</div>
        </div>
        <div>
          <button class="btn-pink-match" onclick="openCreateMatchModal()">+ MATCH ROOM</button>
        </div>
      </div>
    </div>

    <div class="content-section">
      <div id="sectionMatches" class="panel-box">
        <div class="section-header-row">
          <span><i class="fa-solid fa-gamepad"></i> Match / Room Manager</span>
        </div>
        <div id="activeMatchesList"></div>
      </div>
    </div>

    <!-- Create Match Modal -->
    <div class="modal-backdrop" id="createMatchModal">
      <div class="modal-dialog">
        <div class="section-header-row" style="margin-bottom:12px;">
          <span>Create Room Box</span>
          <i class="fa-solid fa-xmark" style="cursor:pointer; color:#fff;" onclick="closeCreateMatchModal()"></i>
        </div>
        <div class="form-ctrl"><label>Room Title</label><input type="text" id="mTitle" placeholder="e.g. Solo Night Cup"></div>
        <div class="form-ctrl">
          <label>Map</label>
          <select id="mMap">
            <option value="Bermuda">Bermuda</option>
            <option value="Purgatory">Purgatory</option>
            <option value="Kalahari">Kalahari</option>
            <option value="Clash Squad">Clash Squad</option>
          </select>
        </div>
        <div class="form-ctrl"><label>Total Slots</label><input type="number" id="mSlots" value="12"></div>
        <div class="form-ctrl"><label>Entry Fee (Rs)</label><input type="number" id="mFee" value="30"></div>
        <div class="form-ctrl"><label>Prize (Rs)</label><input type="number" id="mPrize" value="300"></div>
        <div class="form-ctrl"><label>Timing</label><input type="text" id="mTime" placeholder="e.g. 5:00 PM Today"></div>
        <button class="btn-action" onclick="createMatchRoom()">Publish Room</button>
      </div>
    </div>

    <!-- Edit Match Modal -->
    <div class="modal-backdrop" id="editMatchModal">
      <div class="modal-dialog">
        <div class="section-header-row" style="margin-bottom:12px;">
          <span>Edit Room Box</span>
          <i class="fa-solid fa-xmark" style="cursor:pointer; color:#fff;" onclick="closeEditModal()"></i>
        </div>
        <input type="hidden" id="editMatchIndex">
        <div class="form-ctrl"><label>Room Title</label><input type="text" id="editTitle"></div>
        <div class="form-ctrl">
          <label>Map</label>
          <select id="editMap">
            <option value="Bermuda">Bermuda</option>
            <option value="Purgatory">Purgatory</option>
            <option value="Kalahari">Kalahari</option>
            <option value="Clash Squad">Clash Squad</option>
          </select>
        </div>
        <div class="form-ctrl"><label>Slots</label><input type="number" id="editSlots"></div>
        <div class="form-ctrl"><label>Fee (Rs)</label><input type="number" id="editFee"></div>
        <div class="form-ctrl"><label>Prize (Rs)</label><input type="number" id="editPrize"></div>
        <div class="form-ctrl"><label>Timing</label><input type="text" id="editTime"></div>
        <button class="btn-action" onclick="saveEditedMatch()">Save Changes</button>
      </div>
    </div>

    <div class="bottom-nav">
      <button class="bot-tab active">
        <i class="fa-solid fa-gamepad"></i>
        <span>Rooms</span>
      </button>
    </div>

  </div>

  <script>
    const syncChannel = new BroadcastChannel('mff_tournament_sync');

    function notifyWebsiteUpdate() {
      syncChannel.postMessage({ type: 'REFRESH_TOURNAMENTS' });
    }

    function openCreateMatchModal() {
      document.getElementById('createMatchModal').style.display = 'flex';
    }
    function closeCreateMatchModal() {
      document.getElementById('createMatchModal').style.display = 'none';
    }

    function createMatchRoom() {
      const title = document.getElementById('mTitle').value.trim();
      const map = document.getElementById('mMap').value;
      const slots = Number(document.getElementById('mSlots').value);
      const fee = Number(document.getElementById('mFee').value);
      const prize = Number(document.getElementById('mPrize').value);
      const time = document.getElementById('mTime').value.trim();

      if (!title || !time) {
        alert("Title aur timing likhna lazmi hai!");
        return;
      }

      let matches = JSON.parse(localStorage.getItem('mff_tournaments')) || [];
      matches.push({
        id: "m_" + Date.now(),
        title, map, totalSlots: slots, fee, prize, time,
        coverImage: "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=400&q=80",
        roomId: "", roomPass: "", players: []
      });

      localStorage.setItem('mff_tournaments', JSON.stringify(matches));
      notifyWebsiteUpdate();
      closeCreateMatchModal();
      renderAdminMatches();
      alert("✅ Room create ho gaya!");
    }

    function renderAdminMatches() {
      const container = document.getElementById('activeMatchesList');
      container.innerHTML = "";
      let matches = JSON.parse(localStorage.getItem('mff_tournaments')) || [];

      if (matches.length === 0) {
        container.innerHTML = `<div style="font-size:11px; color:var(--text-muted); text-align:center; padding:15px;">Koi room available nahi hai.</div>`;
        return;
      }

      matches.forEach((m, idx) => {
        const div = document.createElement('div');
        div.style = "background:#050b14; border:1px solid var(--card-border); border-radius:10px; padding:10px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;";
        
        div.innerHTML = `
          <div>
            <div style="font-size:12px; font-weight:800; color:#fff;">${m.title} (${m.map})</div>
            <div style="font-size:10px; color:var(--text-muted);">${m.time} | Fee: Rs.${m.fee} | Win: Rs.${m.prize}</div>
          </div>
          <div style="display:flex; gap:4px;">
            <button class="btn-action btn-orange" style="padding:5px 8px; font-size:10px;" onclick="openEditModal(${idx})">Edit</button>
            <button class="btn-action btn-danger" style="padding:5px 8px; font-size:10px;" onclick="deleteMatchAdmin(${idx})">Delete</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function deleteMatchAdmin(idx) {
      if (!confirm("Kya aap waqai is room box ko delete karna chahte hain?")) return;
      
      let matches = JSON.parse(localStorage.getItem('mff_tournaments')) || [];
      matches.splice(idx, 1);
      localStorage.setItem('mff_tournaments', JSON.stringify(matches));
      
      notifyWebsiteUpdate();
      renderAdminMatches();
      alert("🗑️ Room successfully delete ho gaya hai!");
    }

    function openEditModal(idx) {
      let matches = JSON.parse(localStorage.getItem('mff_tournaments')) || [];
      let m = matches[idx];
      if (!m) return;

      document.getElementById('editMatchIndex').value = idx;
      document.getElementById('editTitle').value = m.title || '';
      document.getElementById('editMap').value = m.map || 'Bermuda';
      document.getElementById('editSlots').value = m.totalSlots || 12;
      document.getElementById('editFee').value = m.fee || 30;
      document.getElementById('editPrize').value = m.prize || 300;
      document.getElementById('editTime').value = m.time || '';

      document.getElementById('editMatchModal').style.display = 'flex';
    }

    function closeEditModal() {
      document.getElementById('editMatchModal').style.display = 'none';
    }

    function saveEditedMatch() {
      let idx = document.getElementById('editMatchIndex').value;
      let matches = JSON.parse(localStorage.getItem('mff_tournaments')) || [];
      if (!matches[idx]) return;

      matches[idx].title = document.getElementById('editTitle').value.trim();
      matches[idx].map = document.getElementById('editMap').value;
      matches[idx].totalSlots = Number(document.getElementById('editSlots').value);
      matches[idx].fee = Number(document.getElementById('editFee').value);
      matches[idx].prize = Number(document.getElementById('editPrize').value);
      matches[idx].time = document.getElementById('editTime').value.trim();

      localStorage.setItem('mff_tournaments', JSON.stringify(matches));
      notifyWebsiteIndexUpdate = true;
      notifyWebsiteUpdate();

      closeEditModal();
      renderAdminMatches();
      alert("✅ Room settings update ho gayi hain!");
    }

    window.onload = function() {
      renderAdminMatches();
    };
  </script>
</body>
</html>
