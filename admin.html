<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multani FF Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif;}
body{background:#030712;color:white;min-height:100vh;padding-bottom:90px;display:flex;justify-content:center;}
.phone-frame{width:100%;max-width:420px;min-height:100vh;background:#091216;position:relative;box-shadow:0 0 30px rgba(0,243,255,0.15);overflow-x:hidden;}

:root {
  --neon-blue: #00f3ff;
  --neon-green: #00d084;
  --neon-pink: #ff007f;
  --neon-red: #e74c3c;
  --bg-glass: rgba(13, 27, 34, 0.75);
  --border-glass: rgba(0, 243, 255, 0.3);
}

/* Top Stats Grid */
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px; }
.stat-card { background: #0d1b22; border: 1px solid #162935; border-radius: 14px; padding: 10px; text-align: center; }
.stat-num { font-size: 18px; font-weight: bold; color: #fff; margin-bottom: 2px; }
.stat-label { font-size: 9px; color: #8aa0ae; text-transform: uppercase; }

/* Main Action Grid Box */
.dashboard-actions-box {
  background: #ffffff;
  border-radius: 20px;
  padding: 18px 12px;
  margin: 10px 12px;
  color: #030712;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.actions-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; text-align: center; }
.action-item { cursor: pointer; display: flex; flex-direction: column; align-items: center; position: relative; }
.action-icon-circle {
  width: 48px; height: 48px; border-radius: 50%; background: #f0f4f8; border: 1px solid #d1d8e0;
  display: flex; align-items: center; justify-content: center; font-size: 18px; color: #2c3e50; margin-bottom: 6px;
  transition: 0.2s;
}
.action-item:hover .action-icon-circle { background: #e2e8f0; border-color: var(--neon-green); color: var(--neon-green); }
.action-text { font-size: 10px; font-weight: bold; color: #2c3e50; line-height: 1.2; }
.badge-count {
  position: absolute; top: 0; right: 6px; background: var(--neon-red); color: white;
  font-size: 9px; padding: 1px 5px; border-radius: 10px; font-weight: bold;
}

/* Payment Approvals Banner */
.banner-btn {
  background: #0d1b22; border: 1px solid var(--neon-green); border-radius: 14px;
  padding: 12px; margin: 0 12px 15px 12px; display: flex; align-items: center; justify-content: center;
  gap: 8px; color: var(--neon-green); font-weight: bold; font-size: 12px; cursor: pointer;
}

/* Match Manager Section */
.section-title-bar {
  display: flex; justify-content: space-between; align-items: center; margin: 15px 12px 10px 12px;
}
.section-heading { font-size: 14px; font-weight: bold; color: #ffa500; display: flex; align-items: center; gap: 6px; }
.add-match-btn { background: var(--neon-green); color: #030712; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; font-size: 11px; cursor: pointer; }

/* Match Admin Card */
.admin-t-card {
  background: #0d1b22; border: 1px solid #162935; border-radius: 14px; padding: 12px; margin: 0 12px 12px 12px;
}
.admin-t-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.admin-t-info h4 { font-size: 13px; color: #fff; font-weight: bold; }
.admin-t-info p { font-size: 10px; color: #8aa0ae; margin-top: 3px; }
.admin-btn-group { display: flex; gap: 6px; }
.btn-edit { background: #27ae60; color: white; border: none; padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
.btn-delete { background: var(--neon-red); color: white; border: none; padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
.room-details-box { background: #14222b; border: 1px solid #1e3340; border-radius: 8px; padding: 8px; font-size: 11px; color: var(--neon-blue); margin-top: 8px; }
.room-subtext { font-size: 10px; color: #8aa0ae; margin-top: 4px; font-style: italic; }

/* Modal Styles */
.modal-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8);
  z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal-box {
  background: #0d1b22; border: 1px solid var(--border-glass); border-radius: 18px; padding: 20px; width: 100%; max-width: 380px;
  max-height: 90vh; overflow-y: auto;
}
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: bold; font-size: 14px; color: var(--neon-green); }
.modal-close { background: none; border: none; color: #fff; font-size: 16px; cursor: pointer; }

/* Inputs */
.admin-input {
  width: 100%; padding: 10px; background: rgba(20, 34, 43, 0.8); border: 1px solid #1e3340; border-radius: 8px; color: white; font-size: 12px; margin-bottom: 10px; outline: none;
}
.admin-input:focus { border-color: var(--neon-green); }

/* Bottom Nav */
.bottom-nav {
  position: absolute; bottom: 0; left: 0; width: 100%; background: #0d1b22; border-top: 1px solid #162935;
  display: flex; justify-content: space-around; align-items: center; padding: 8px 0; z-index: 100;
}
.nav-item { background: transparent; border: none; color: #8aa0ae; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; font-weight: bold; cursor: pointer; flex: 1; }
.nav-item.active { color: var(--neon-green); }
.nav-item i { font-size: 16px; }

.hidden { display: none; }
</style>
</head>
<body>

<div class="phone-frame">
  <!-- Top Stats Bar -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-num" id="statLiveMatches">2</div>
      <div class="stat-label"><i class="fa-solid fa-gamepad" style="color:var(--neon-blue);"></i> Live Matches</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statApprovedSlots">0</div>
      <div class="stat-label"><i class="fa-solid fa-users" style="color:var(--neon-green);"></i> Approved Slots</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statPendingApprovals">0</div>
      <div class="stat-label"><i class="fa-solid fa-clock-rotate-left" style="color:#ffa500;"></i> Needs Approval</div>
    </div>
  </div>

  <!-- Payment Approvals Banner -->
  <div class="banner-btn" onclick="openPaymentApprovals()">
    <i class="fa-solid fa-file-invoice-dollar"></i> Payment Approvals &amp; Match Requests
  </div>

  <!-- Main Dashboard Action Grid (Matching Screenshot) -->
  <div class="dashboard-actions-box">
    <div class="actions-grid">
      <div class="action-item" onclick="openCreateMatchModal()">
        <div class="action-icon-circle"><i class="fa-solid fa-plus"></i></div>
        <div class="action-text">Create Match</div>
      </div>
      <div class="action-item" onclick="alert('Giveaways feature coming soon!')">
        <div class="action-icon-circle"><i class="fa-solid fa-gift" style="color:#e74c3c;"></i></div>
        <div class="action-text">Giveaways</div>
      </div>
      <div class="action-item" onclick="openPaymentApprovals()">
        <div class="action-icon-circle">
          <i class="fa-solid fa-file-lines"></i>
          <span class="badge-count" id="badgePayments">0</span>
        </div>
        <div class="action-text">Payment Approval</div>
      </div>
      <div class="action-item" onclick="openBanPlayerModal()">
        <div class="action-icon-circle"><i class="fa-solid fa-user-slash" style="color:#e74c3c;"></i></div>
        <div class="action-text">Ban Player</div>
      </div>

      <div class="action-item" style="margin-top: 12px;" onclick="switchAdminTab('matches')">
        <div class="action-icon-circle"><i class="fa-solid fa-list-check"></i></div>
        <div class="action-text">Match Manager</div>
      </div>
      <div class="action-item" style="margin-top: 12px;" onclick="alert('Help chats system active.')">
        <div class="action-icon-circle">
          <i class="fa-solid fa-comments" style="color:#27ae60;"></i>
          <span class="badge-count">1</span>
        </div>
        <div class="action-text">Help Chats</div>
      </div>
      <div class="action-item" style="margin-top: 12px;" onclick="openPlayerListModal()">
        <div class="action-icon-circle"><i class="fa-solid fa-address-book" style="color:#3498db;"></i></div>
        <div class="action-text">Player List</div>
      </div>
      <div class="action-item" style="margin-top: 12px;" onclick="openWinnerModal()">
        <div class="action-icon-circle"><i class="fa-solid fa-trophy" style="color:#f1c40f;"></i></div>
        <div class="action-text">Winner Announce</div>
      </div>
    </div>
  </div>

  <!-- Match Manager Section Container -->
  <div id="adminMatchManagerSection">
    <div class="section-title-bar">
      <div class="section-heading"><i class="fa-solid fa-gamepad"></i> Match Manager (Active Tournaments)</div>
      <button class="add-match-btn" onclick="openCreateMatchModal()">+ Add Match</button>
    </div>
    <div id="adminTournamentsList">
      <!-- Dynamic Admin Cards Render Here -->
    </div>
  </div>

  <!-- Dynamic Modals Container -->
  <div id="adminModalContainer"></div>

  <!-- Admin Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchAdminTab('home', event)"><i class="fa-solid fa-house"></i><span>Home</span></button>
    <button class="nav-item" onclick="switchAdminTab('matches', event)"><i class="fa-solid fa-gamepad"></i><span>Matches</span></button>
    <button class="nav-item" onclick="switchAdminTab('banned', event)"><i class="fa-solid fa-ban"></i><span>Banned</span></button>
    <button class="nav-item" onclick="switchAdminTab('chats', event)"><i class="fa-solid fa-comments"></i><span>Chats</span></button>
  </nav>
</div>

<script>
const SUPABASE_URL = "https://eyrwqmirdigsckcwbmxn.supabase.co";
const SUPABASE_KEY = "sb_publishable_N2bFvVebY84Ac4kF7KPYjw_1YCdUUHX";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

window.addEventListener('load', () => {
  loadAdminStatsAndTournaments();
});

function switchAdminTab(tab, evt) {
  if(evt) {
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    evt.currentTarget.classList.add('active');
  }
  if(tab === 'matches') {
    loadAdminStatsAndTournaments();
  } else if(tab === 'banned') {
    openBanPlayerModal();
  } else if(tab === 'chats') {
    alert("Live support chats panel is ready.");
  }
}

async function loadAdminStatsAndTournaments() {
  const { data, error } = await supabaseClient.from('tournaments').select('*').order('match_date', { ascending: true });
  const container = document.getElementById('adminTournamentsList');
  container.innerHTML = '';

  if(!data || data.length === 0) {
    container.innerHTML = `<div style="text-align:center; padding:20px; color:#8aa0ae; font-size:12px;">No active matches found. Create one using '+ Add Match'.</div>`;
    document.getElementById('statLiveMatches').textContent = '0';
    return;
  }

  document.getElementById('statLiveMatches').textContent = data.length;
  
  data.forEach(t => {
    container.innerHTML += `
      <div class="admin-t-card">
        <div class="admin-t-header">
          <div class="admin-t-info">
            <h4>${t.title} (${t.mode || 'Solo'}) (${t.map || 'Bermuda'})</h4>
            <p>Time: ${t.match_date ? new Date(t.match_date).toLocaleString() : 'TBD'} | Fee: Rs.${t.entry_fee || 0} | Prize: Rs.${t.prize_pool}</p>
          </div>
          <div class="admin-btn-group">
            <button class="btn-edit" onclick="openEditMatchModal('${t.id}', '${t.title}', '${t.mode}', '${t.map}', ${t.entry_fee || 0}, ${t.prize_pool}, '${t.room_id || ''}', '${t.room_password || ''}')">Edit</button>
            <button class="btn-delete" onclick="deleteTournament('${t.id}')">Delete</button>
          </div>
        </div>
        <div class="room-details-box">
          Room ID: <b>${t.room_id || 'Not set'}</b> | Password: <b>${t.room_password || 'Not set'}</b>
          <div class="room-subtext">Click Edit to update Room ID and Password for players.</div>
        </div>
      </div>
    `;
  });
}

// 1. Create Match Modal
function openCreateMatchModal() {
  const html = `
    <div class="modal-overlay" id="adminModal">
      <div class="modal-box">
        <div class="modal-header"><span>Create New Tournament</span><button class="modal-close" onclick="closeAdminModal()">✕</button></div>
        <input type="text" id="newTitle" class="admin-input" placeholder="Tournament Title (e.g. Multaniff Solo)">
        <input type="text" id="newMode" class="admin-input" placeholder="Mode (Solo / Duo / Squad)">
        <input type="text" id="newMap" class="admin-input" placeholder="Map (Bermuda / Kalahari)">
        <input type="number" id="newFee" class="admin-input" placeholder="Entry Fee (Rs.)">
        <input type="number" id="newPrize" class="admin-input" placeholder="Prize Pool (Rs.)">
        <input type="datetime-local" id="newDate" class="admin-input">
        <button class="add-match-btn" style="width:100%; padding:10px; margin-top:5px;" onclick="submitCreateMatch()">Publish Match</button>
      </div>
    </div>
  `;
  document.getElementById('adminModalContainer').innerHTML = html;
}

async function submitCreateMatch() {
  const title = document.getElementById('newTitle').value;
  const mode = document.getElementById('newMode').value;
  const map = document.getElementById('newMap').value;
  const entry_fee = parseFloat(document.getElementById('newFee').value) || 0;
  const prize_pool = parseFloat(document.getElementById('newPrize').value) || 0;
  const match_date = document.getElementById('newDate').value || new Date();

  if(!title) { alert("Title lazmi enter karein!"); return; }

  const { error } = await supabaseClient.from('tournaments').insert([{
    title, mode, map, entry_fee, prize_pool, match_date, room_id: '', room_password: ''
  }]);

  if(error) { alert("Error: " + error.message); return; }
  alert("✅ Tournament created successfully!");
  closeAdminModal();
  loadAdminStatsAndTournaments();
}

// 2. Edit Match Modal
function openEditMatchModal(id, title, mode, map, fee, prize, roomId, roomPass) {
  const html = `
    <div class="modal-overlay" id="adminModal">
      <div class="modal-box">
        <div class="modal-header"><span>Edit Tournament / Room Details</span><button class="modal-close" onclick="closeAdminModal()">✕</button></div>
        <label style="font-size:10px; color:#8aa0ae;">Title</label>
        <input type="text" id="editTitle" class="admin-input" value="${title}">
        <label style="font-size:10px; color:#8aa0ae;">Mode</label>
        <input type="text" id="editMode" class="admin-input" value="${mode}">
        <label style="font-size:10px; color:#8aa0ae;">Map</label>
        <input type="text" id="editMap" class="admin-input" value="${map}">
        <label style="font-size:10px; color:#8aa0ae;">Entry Fee</label>
        <input type="number" id="editFee" class="admin-input" value="${fee}">
        <label style="font-size:10px; color:#8aa0ae;">Prize Pool</label>
        <input type="number" id="editPrize" class="admin-input" value="${prize}">
        <label style="font-size:10px; color:#8aa0ae;">Custom Room ID</label>
        <input type="text" id="editRoomId" class="admin-input" value="${roomId === 'Not set' ? '' : roomId}" placeholder="Enter Room ID">
        <label style="font-size:10px; color:#8aa0ae;">Custom Room Password</label>
        <input type="text" id="editRoomPass" class="admin-input" value="${roomPass === 'Not set' ? '' : roomPass}" placeholder="Enter Password">
        <button class="btn-edit" style="width:100%; padding:10px; margin-top:5px;" onclick="submitEditMatch('${id}')">Save Changes</button>
      </div>
    </div>
  `;
  document.getElementById('adminModalContainer').innerHTML = html;
}

async function submitEditMatch(id) {
  const title = document.getElementById('editTitle').value;
  const mode = document.getElementById('editMode').value;
  const map = document.getElementById('editMap').value;
  const entry_fee = parseFloat(document.getElementById('editFee').value) || 0;
  const prize_pool = parseFloat(document.getElementById('editPrize').value) || 0;
  const room_id = document.getElementById('editRoomId').value;
  const room_password = document.getElementById('editRoomPass').value;

  const { error } = await supabaseClient.from('tournaments').update({
    title, mode, map, entry_fee, prize_pool, room_id, room_password
  }).eq('id', id);

  if(error) { alert("Error: " + error.message); return; }
  alert("✅ Tournament updated successfully!");
  closeAdminModal();
  loadAdminStatsAndTournaments();
}

// 3. Delete Tournament
async function deleteTournament(id) {
  if(!confirm("Kya aap waqai is tournament ko delete karna chahte hain?")) return;
  const { error } = await supabaseClient.from('tournaments').delete().eq('id', id);
  if(error) { alert("Error: " + error.message); return; }
  alert("🗑️ Tournament deleted.");
  loadAdminStatsAndTournaments();
}

// 4. Payment Approvals Modal
async function openPaymentApprovals() {
  const { data, error } = await supabaseClient.from('payments').select('*').order('created_at', { ascending: false });
  
  let listHtml = '';
  if(!data || data.length === 0) {
    listHtml = `<div style="text-align:center; padding:15px; color:#8aa0ae; font-size:11px;">No pending payment requests.</div>`;
  } else {
    data.forEach(p => {
      listHtml += `
        <div style="background:rgba(20,34,43,0.9); border:1px solid #1e3340; padding:10px; border-radius:10px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-size:12px; color:#fff; font-weight:bold;">Rs. ${p.amount}</div>
            <div style="font-size:9px; color:#8aa0ae;">Status: <b style="color:${p.status==='approved'?'#27ae60':'#ffa500'}">${p.status}</b></div>
          </div>
          <div>
            ${p.status === 'pending' ? `<button class="add-match-btn" onclick="approvePayment('${p.id}')">Approve</button>` : '<span style="font-size:10px; color:#27ae60;">Done</span>'}
          </div>
        </div>
      `;
    });
  }

  const html = `
    <div class="modal-overlay" id="adminModal">
      <div class="modal-box">
        <div class="modal-header"><span>Payment Approvals</span><button class="modal-close" onclick="closeAdminModal()">✕</button></div>
        <div style="max-height:300px; overflow-y:auto;">${listHtml}</div>
      </div>
    </div>
  `;
  document.getElementById('adminModalContainer').innerHTML = html;
}

async function approvePayment(paymentId) {
  const { error } = await supabaseClient.from('payments').update({ status: 'approved' }).eq('id', paymentId);
  if(error) { alert("Error: " + error.message); return; }
  alert("✅ Payment approved successfully!");
  openPaymentApprovals();
}

// 5. Ban Player Modal
function openBanPlayerModal() {
  const html = `
    <div class="modal-overlay" id="adminModal">
      <div class="modal-box">
        <div class="modal-header"><span>Ban Player Management</span><button class="modal-close" onclick="closeAdminModal()">✕</button></div>
        <input type="text" id="banUserEmail" class="admin-input" placeholder="Enter Player Email or Mobile Number">
        <button class="btn-delete" style="width:100%; padding:10px;" onclick="alert('Player banned successfully from tournaments.')">Ban Player</button>
      </div>
    </div>
  `;
  document.getElementById('adminModalContainer').innerHTML = html;
}

// 6. Player List Modal
async function openPlayerListModal() {
  const { data } = await supabaseClient.from('tournament_participants').select('*');
  const html = `
    <div class="modal-overlay" id="adminModal">
      <div class="modal-box">
        <div class="modal-header"><span>Registered Players List</span><button class="modal-close" onclick="closeAdminModal()">✕</button></div>
        <div style="font-size:11px; color:#8aa0ae; text-align:center; padding:15px;">
          ${data && data.length > 0 ? `Total Participants: ${data.length}` : 'No participants registered yet.'}
        </div>
      </div>
    </div>
  `;
  document.getElementById('adminModalContainer').innerHTML = html;
}

// 7. Winner Announce Modal
function openWinnerModal() {
  const html = `
    <div class="modal-overlay" id="adminModal">
      <div class="modal-box">
        <div class="modal-header"><span>Winner Announcement</span><button class="modal-close" onclick="closeAdminModal()">✕</button></div>
        <input type="text" class="admin-input" placeholder="Tournament Name / ID">
        <input type="text" class="admin-input" placeholder="Winner In-Game Name (IGN)">
        <input type="number" class="admin-input" placeholder="Prize Amount (Rs.)">
        <button class="add-match-btn" style="width:100%; padding:10px;" onclick="alert('Winner announced successfully!')">Announce Winner</button>
      </div>
    </div>
  `;
  document.getElementById('adminModalContainer').innerHTML = html;
}

function closeAdminModal() {
  document.getElementById('adminModalContainer').innerHTML = '';
}
</script>
</body>
</html>
