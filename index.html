<body>

  <div class="app-viewport">
    
    <div class="top-header">
      <div class="top-left-group">
        <div class="share-icon-btn" onclick="shareWebsiteLink()" title="Share">
          <i class="fa-solid fa-share-nodes"></i>
        </div>

          <span>Rs. <b id="navWalletBal">0</b></span>
        </div>
      </div>

      <div class="nav-tabs">
        <span class="nav-tab-item active" id="tabMatchesBtn" onclick="switchMainTab('matches')">Matches</span>
        <span class="nav-tab-item" id="tabWinnersBtn" onclick="switchMainTab('winners')">Winners</span>
      </div>

      <div class="top-menu-btn" onclick="openMenuModal()" style="cursor:pointer; padding:6px 8px; color:#fff; font-size:16px;">
        <i class="fa-solid fa-bars"></i>
      </div>
    </div>

    <div class="hero-banner-container">
      <div class="hero-glass-card">
        <div class="mine-ribbon">Mine</div>
        <div class="hero-avatar"><i class="fa-solid fa-crown"></i></div>
        <div class="hero-details">
          <div class="hero-title-row">
            <span><i class="fa-brands fa-whatsapp" style="color:#25d366;"></i> Multani FF Official Tournament</span>
            <span style="font-size: 10px; color:#00b0ff;"><i class="fa-solid fa-signal"></i> LIVE</span>
          </div>
          <div class="hero-subtitle">🔥 Free Fire Esports Gaming Arena 🎮</div>
        </div>
      </div>
    </div>

    <div id="matchesMainView">
      <div class="filter-track">
        <div class="filter-item active" onclick="setMapFilter('All', this)">Recently</div>
        <div class="filter-item" onclick="setMapFilter('Bermuda', this)">Bermuda</div>
        <div class="filter-item" onclick="setMapFilter('Purgatory', this)">Purgatory</div>
        <div class="filter-item" onclick="setMapFilter('Clash Squad', this)">CS Battle</div>
      </div>

      <div class="grid-container" id="matchesContainer"></div>
    </div>

    <div id="winnersMainView" style="display: none; padding: 0 16px 20px;">
      <div style="font-size:13px; font-weight:900; color:var(--gold); margin-bottom:12px;">
        <i class="fa-solid fa-trophy"></i> Hall of Fame
      </div>
      <div id="winnersListContainer"></div>
    </div>

    <div class="bottom-bar">
      <button class="bot-item" onclick="openEventsModal()">
        <div class="bot-icon-circle"><i class="fa-solid fa-gift" style="color:#ff4625;"></i></div>
        <span>Events</span>
      </button>

      <button class="bot-item active" onclick="switchMainTab('matches')">
        <div class="bot-icon-circle"><i class="fa-solid fa-shield-halved"></i></div>
        <span>Battle</span>
      </button>

      <button class="bot-add-fund-btn" onclick="openWalletModal()">
        <div class="bot-add-fund-circle"><i class="fa-solid fa-plus"></i></div>
        <span>Add Fund</span>
      </button>

      <button class="bot-item" onclick="openProfileManageModal()">
        <div class="bot-icon-circle"><i class="fa-solid fa-users" style="color:#ffd000;"></i></div>
        <span>Profile</span>
      </button>
    </div>

  </div>

  <script>
    const defaultMatches = [
      {
        id: "m_1",
        title: "Multaniff (Solo)",
        subtitle: "All guns allow",
        map: "Kalahari",
        time: "Hfte din 1 bje",
        fee: 30,
        prize: 300,
        totalSlots: 12,
        coverImage: "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=400&q=80",
        roomId: "", roomPass: "", players: []
      },
      {
        id: "m_2",
        title: "Friday MATCH ROOM",
        subtitle: "Clash Squad 4v4",
        map: "Bermuda",
        time: "5.00 pm. Friday",
        fee: 50,
        prize: 500,
        totalSlots: 8,
        coverImage: "https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=400&q=80",
        roomId: "", roomPass: "", players: []
      }
    ];

    let currentUser = JSON.parse(localStorage.getItem('mff_user')) || null;
    let activeFilter = "All";

    function renderMatches() {
      let tournaments = JSON.parse(localStorage.getItem('mff_tournaments'));
      if (!tournaments || tournaments.length === 0) {
        tournaments = defaultMatches;
        localStorage.setItem('mff_tournaments', JSON.stringify(defaultMatches));
      }

      const container = document.getElementById('matchesContainer');
      container.innerHTML = "";

      const filtered = activeFilter === "All" 
        ? tournaments 
        : tournaments.filter(m => (m.map || "Bermuda").toLowerCase().includes(activeFilter.toLowerCase()));

      if (filtered.length === 0) {
        container.innerHTML = `<div style="grid-column: span 2; text-align:center; padding: 30px; color:#a7f3d0; font-size:12px;">No matches available.</div>`;
        return;
      }

      filtered.forEach((m) => {
        const approvedPlayers = (m.players || []).filter(p => p.status === "approved");
        const card = document.createElement('div');
        card.className = "tournament-grid-card";
        card.innerHTML = `
          <div class="card-thumb-wrap">
            <img class="card-thumb" src="${m.coverImage || defaultMatches[0].coverImage}" alt="Match">
            <div class="thumb-overlay"></div>
            <div class="card-live-badge">${approvedPlayers.length}/${m.totalSlots}</div>
            <div class="card-thumb-text">${m.time} | ${m.map}</div>
          </div>
          <div class="card-body">
            <div class="card-room-title">${m.title}</div>
            <div class="card-room-desc">${m.subtitle || m.map}</div>
            <div class="card-footer-info">
              <span class="fee-badge">Fee: Rs.${m.fee}</span>
              <span class="prize-badge">Win: Rs.${m.prize}</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function switchMainTab(tab) {
      document.getElementById('matchesMainView').style.display = (tab === 'matches') ? 'block' : 'none';
      document.getElementById('winnersMainView').style.display = (tab === 'winners') ? 'block' : 'none';
      document.getElementById('tabMatchesBtn').classList.toggle('active', tab === 'matches');
      document.getElementById('tabWinnersBtn').classList.toggle('active', tab === 'winners');
    }

    function setMapFilter(mapName, btn) {
      document.querySelectorAll('.filter-item').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = mapName;
      renderMatches();
    }

    // Real-time sync with Admin panel
    const syncChannel = new BroadcastChannel('mff_tournament_sync');
    syncChannel.onmessage = function(event) {
      if (event.data && event.data.type === 'REFRESH_TOURNAMENTS') {
        renderMatches();
      }
    };

    window.onload = function() {
      renderMatches();
    };
  </script>
</body>
