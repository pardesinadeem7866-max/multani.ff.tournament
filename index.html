<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multani FF Official Tournament Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16',
                        cardBg: '#131b2e',
                        cardBorder: '#1e293b',
                        neonRed: '#ff2a5f',
                        neonYellow: '#ffbe0b',
                        neonGreen: '#06d6a0',
                        accentBlue: '#3a86ff'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #090d16;
            color: #f8fafc;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        .heading-font {
            font-family: 'Rajdhani', sans-serif;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 2px;
        }
        .glass-card {
            background: rgba(19, 27, 46, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .neon-glow-red {
            box-shadow: 0 0 15px rgba(255, 42, 95, 0.3);
        }
        .neon-glow-yellow {
            box-shadow: 0 0 15px rgba(255, 190, 11, 0.3);
        }
        .animate-pulse-slow {
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="pb-24 select-none">

    <!-- Global Loading Overlay -->
    <div id="global-loader" class="fixed inset-0 z-50 bg-darkBg/90 backdrop-blur-md flex flex-col items-center justify-center transition-opacity duration-300 hidden">
        <div class="relative w-16 h-16 mb-4">
            <div class="absolute inset-0 border-4 border-neonRed/20 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-neonRed rounded-full border-t-transparent animate-spin"></div>
        </div>
        <p id="loader-text" class="heading-font text-lg tracking-wider text-slate-300 font-semibold animate-pulse">LOADING MULTANI FF...</p>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-11/12 max-w-md flex flex-col gap-2 pointer-events-none"></div>

    <!-- Connection Status Banner -->
    <div id="connection-banner" class="hidden fixed top-0 left-0 right-0 z-50 bg-red-600 text-white text-xs py-1 text-center font-medium">
        <i class="fa-solid fa-triangle-exclamation mr-1"></i> Connection Issue / Offline Mode
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="app" class="relative w-full min-h-screen flex flex-col">

        <!-- HEADER -->
        <header class="sticky top-0 z-30 glass-card px-4 py-3 flex items-center justify-between border-b border-cardBorder">
            <div class="flex items-center space-x-3">
                <div id="back-btn-container" class="hidden">
                    <button onclick="goBack()" class="w-9 h-9 rounded-xl bg-slate-800/80 border border-slate-700 flex items-center justify-center text-slate-200 hover:bg-slate-700 active:scale-95 transition">
                        <i class="fa-solid fa-arrow-left text-sm"></i>
                    </button>
                </div>
                <div class="flex items-center space-x-2">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-neonRed to-neonYellow p-0.5 flex items-center justify-center shadow-lg neon-glow-red">
                        <div class="w-full h-full bg-darkBg rounded-[10px] flex items-center justify-center">
                            <i class="fa-solid fa-fire text-neonRed text-sm"></i>
                        </div>
                    </div>
                    <div>
                        <h1 class="heading-font font-bold text-lg tracking-wider bg-gradient-to-r from-white via-slate-200 to-neonRed bg-clip-text text-transparent leading-none">MULTANI FF</h1>
                        <span class="text-[10px] text-neonYellow font-semibold tracking-widest uppercase">Official Arena</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <!-- Notifications Bell -->
                <button onclick="navigateTo('notifications')" class="relative w-9 h-9 rounded-xl bg-slate-800/60 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-white transition">
                    <i class="fa-solid fa-bell text-sm"></i>
                    <span id="notif-badge" class="absolute -top-1 -right-1 w-4 h-4 bg-neonRed text-white text-[10px] font-bold rounded-full flex items-center justify-center hidden">0</span>
                </button>
                <!-- Admin Portal Button (Conditional) -->
                <div id="admin-btn-container" class="hidden">
                    <a href="admin.html" class="px-2.5 py-1.5 rounded-xl bg-neonRed/10 border border-neonRed/30 text-neonRed text-xs font-semibold flex items-center space-x-1 hover:bg-neonRed/20 transition">
                        <i class="fa-solid fa-shield-halved"></i>
                        <span>Admin</span>
                    </a>
                </div>
            </div>
        </header>

        <!-- DYNAMIC VIEWS CONTAINER -->
        <main id="main-content" class="flex-1 flex flex-col pb-16">
            <!-- Content injected dynamically via JS router -->
        </main>

        <!-- BOTTOM NAVIGATION BAR -->
        <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 max-w-[480px] mx-auto glass-card border-t border-cardBorder px-2 py-2 z-40 flex items-center justify-around">
            <button onclick="navigateTo('home')" data-nav="home" class="nav-item flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-neonRed transition">
                <i class="fa-solid fa-house text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium tracking-wide">Home</span>
            </button>
            <button onclick="navigateTo('matches')" data-nav="matches" class="nav-item flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-neonRed transition">
                <i class="fa-solid fa-gamepad text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium tracking-wide">Matches</span>
            </button>
            <button onclick="navigateTo('my-matches')" data-nav="my-matches" class="nav-item flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-neonRed transition">
                <i class="fa-solid fa-ticket text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium tracking-wide">My Matches</span>
            </button>
            <button onclick="navigateTo('wallet')" data-nav="wallet" class="nav-item flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-neonRed transition">
                <i class="fa-solid fa-wallet text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium tracking-wide">Wallet</span>
            </button>
            <button onclick="navigateTo('profile')" data-nav="profile" class="nav-item flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-neonRed transition">
                <i class="fa-solid fa-user text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium tracking-wide">Profile</span>
            </button>
        </nav>

    </div>

    <!-- MODAL ROOT -->
    <div id="modal-root" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <!-- Dynamic Modal Content -->
    </div>

    <!-- JAVASCRIPT APPLICATION CORE -->
    <script>
        /* ==========================================================================
           1. SUPABASE CLIENT & CONFIGURATION
           ========================================================================== */
        const SUPABASE_URL = 'https://eyrwqmirdigsckcwbmxn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_N2bFvVebY84Ac4kF7KPYjw_1YCdUUHX';

        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        });

        /* ==========================================================================
           2. GLOBAL APPLICATION STATE
           ========================================================================== */
        let state = {
            currentUser: null,
            currentProfile: null,
            currentView: 'home',
            navigationHistory: [],
            tournamentsCache: [],
            myMatchesCache: [],
            winnersCache: [],
            giveawaysCache: [],
            notificationsCache: [],
            supportCache: [],
            paymentsCache: [],
            siteSettings: {},
            isAdmin: false,
            isBanned: false,
            activeTournamentFilter: 'all'
        };

        let authListenerRegistered = false;
        let realtimeSubscriptions = [];

        /* ==========================================================================
           3. SECURITY & UTILITY HELPERS
           ========================================================================== */
        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-slate-800 border-slate-700 text-slate-200';
            let icon = 'fa-info-circle text-accentBlue';
            if (type === 'success') {
                bgClass = 'bg-emerald-950/90 border-emerald-500/30 text-emerald-200';
                icon = 'fa-circle-check text-neonGreen';
            } else if (type === 'error') {
                bgClass = 'bg-rose-950/90 border-rose-500/30 text-rose-200';
                icon = 'fa-triangle-exclamation text-neonRed';
            }

            toast.className = `pointer-events-auto flex items-center space-x-3 px-4 py-3 rounded-xl border shadow-xl backdrop-blur-md transition-all duration-300 transform translate-y-2 opacity-0 ${bgClass}`;
            toast.innerHTML = `
                <i class="fa-solid ${icon} text-base flex-shrink-0"></i>
                <span class="text-xs font-medium flex-1">${escapeHTML(message)}</span>
            `;

            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function setGlobalLoading(isLoading, text = 'LOADING MULTANI FF...') {
            const loader = document.getElementById('global-loader');
            const loaderText = document.getElementById('loader-text');
            if (isLoading) {
                loaderText.textContent = text;
                loader.classList.remove('hidden');
            } else {
                loader.classList.add('hidden');
            }
        }

        function formatCurrency(amount) {
            return `Rs. ${Number(amount || 0).toLocaleString()}`;
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'TBD';
            const d = new Date(dateStr);
            return isNaN(d.getTime()) ? dateStr : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        /* ==========================================================================
           4. NAVIGATION SYSTEM & HISTORY MANAGEMENT
           ========================================================================== */
        function navigateTo(viewName, params = {}, pushHistory = true) {
            if (state.currentView === viewName && JSON.stringify(state.currentParams || {}) === JSON.stringify(params)) return;

            if (pushHistory && state.currentView) {
                state.navigationHistory.push({ view: state.currentView, params: state.currentParams || {} });
            }

            state.currentView = viewName;
            state.currentParams = params;

            renderCurrentView();
            updateBottomNavActiveState();
            updateBackButtonVisibility();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goBack() {
            if (state.navigationHistory.length > 0) {
                const prev = state.navigationHistory.pop();
                state.currentView = prev.view;
                state.currentParams = prev.params;
                renderCurrentView();
                updateBottomNavActiveState();
                updateBackButtonVisibility();
            } else {
                navigateTo('home', {}, false);
            }
        }

        window.addEventListener('popstate', (e) => {
            if (state.navigationHistory.length > 0) {
                goBack();
            } else {
                navigateTo('home', {}, false);
            }
        });

        function updateBackButtonVisibility() {
            const backContainer = document.getElementById('back-btn-container');
            if (['home', 'matches', 'my-matches', 'wallet', 'profile'].includes(state.currentView)) {
                backContainer.classList.add('hidden');
            } else {
                backContainer.classList.remove('hidden');
            }
        }

        function updateBottomNavActiveState() {
            document.querySelectorAll('.nav-item').forEach(btn => {
                const nav = btn.getAttribute('data-nav');
                if (nav === state.currentView) {
                    btn.classList.add('text-neonRed');
                    btn.classList.remove('text-slate-400');
                } else {
                    btn.classList.remove('text-neonRed');
                    btn.classList.add('text-slate-400');
                }
            });
        }

        /* ==========================================================================
           5. INITIALIZATION & AUTHENTICATION BOOTSTRAP
           ========================================================================== */
        document.addEventListener('DOMContentLoaded', async () => {
            setGlobalLoading(true, 'CONNECTING TO ARENA...');
            
            try {
                if (!authListenerRegistered) {
                    authListenerRegistered = true;
                    supabaseClient.auth.onAuthStateChange(async (event, session) => {
                        console.log('Auth state change:', event);
                        if (session?.user) {
                            state.currentUser = session.user;
                            await fetchUserProfile(session.user.id);
                        } else {
                            state.currentUser = null;
                            state.currentProfile = null;
                            state.isAdmin = false;
                            state.isBanned = false;
                        }
                    });
                }

                const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
                if (sessionError) throw sessionError;

                if (session?.user) {
                    state.currentUser = session.user;
                    await fetchUserProfile(session.user.id);
                }

                await fetchInitialData();
                setupRealtimeSubscriptions();

                if (!state.currentUser) {
                    navigateTo('login', {}, false);
                } else if (state.isBanned) {
                    navigateTo('banned', {}, false);
                } else {
                    navigateTo('home', {}, false);
                }

            } catch (err) {
                console.error('Initialization error:', err);
                showToast('Failed to connect securely to server.', 'error');
                navigateTo('login', {}, false);
            } finally {
                setGlobalLoading(false);
            }
        });

        async function fetchUserProfile(userId) {
            try {
                const { data, error } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('id', userId)
                    .maybeSingle();

                if (error) throw error;

                if (data) {
                    state.currentProfile = data;
                    state.isBanned = Boolean(data.is_banned);
                    
                    const { data: adminData } = await supabaseClient
                        .from('admin_users')
                        .select('*')
                        .or(`id.eq.${userId},user_id.eq.${userId}`)
                        .maybeSingle();

                    state.isAdmin = Boolean(adminData || data.is_admin);
                    
                    const adminContainer = document.getElementById('admin-btn-container');
                    if (state.isAdmin) {
                        adminContainer.classList.remove('hidden');
                    } else {
                        adminContainer.classList.add('hidden');
                    }

                    if (state.isBanned && state.currentView !== 'banned') {
                        navigateTo('banned', {}, false);
                    }
                }
            } catch (err) {
                console.error('Error fetching user profile:', err);
            }
        }

        async function fetchInitialData() {
            try {
                const { data: tourns } = await supabaseClient
                    .from('tournaments')
                    .select('*')
                    .order('match_date', { ascending: true });
                state.tournamentsCache = tourns || [];

                const { data: wins } = await supabaseClient
                    .from('winners')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(20);
                state.winnersCache = wins || [];

                const { data: giveaways } = await supabaseClient
                    .from('giveaways')
                    .select('*')
                    .order('created_at', { ascending: false });
                state.giveawaysCache = giveaways || [];

                const { data: settings } = await supabaseClient
                    .from('site_settings')
                    .select('*');
                
                if (settings && Array.isArray(settings)) {
                    settings.forEach(s => {
                        if (s.key && s.value) state.siteSettings[s.key] = s.value;
                    });
                }

                if (state.currentUser) {
                    await fetchUserDataAuthenticated();
                }
            } catch (err) {
                console.error('Error fetching initial data:', err);
            }
        }

        async function fetchUserDataAuthenticated() {
            if (!state.currentUser) return;
            try {
                const { data: entries } = await supabaseClient
                    .from('tournament_entries')
                    .select('*, tournaments(*)')
                    .eq('user_id', state.currentUser.id);
                state.myMatchesCache = entries || [];

                const { data: notifs } = await supabaseClient
                    .from('notifications')
                    .select('*')
                    .or(`user_id.eq.${state.currentUser.id},user_id.is.null`)
                    .order('created_at', { ascending: false })
                    .limit(50);
                state.notificationsCache = notifs || [];
                updateNotificationBadge();

                const { data: support } = await supabaseClient
                    .from('support_messages')
                    .select('*')
                    .eq('user_id', state.currentUser.id)
                    .order('created_at', { ascending: true });
                state.supportCache = support || [];

                const { data: payments } = await supabaseClient
                    .from('deposit_requests')
                    .select('*')
                    .eq('user_id', state.currentUser.id)
                    .order('created_at', { ascending: false });
                state.paymentsCache = payments || [];

            } catch (err) {
                console.error('Error fetching authenticated user data:', err);
            }
        }

        function updateNotificationBadge() {
            const badge = document.getElementById('notif-badge');
            const unread = state.notificationsCache.filter(n => !n.is_read).length;
            if (unread > 0) {
                badge.textContent = unread;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function setupRealtimeSubscriptions() {
            if (realtimeSubscriptions.length > 0) return;

            try {
                const tournSub = supabaseClient
                    .channel('public:tournaments')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'tournaments' }, payload => {
                        fetchInitialData().then(() => renderCurrentView());
                    })
                    .subscribe();

                const winnerSub = supabaseClient
                    .channel('public:winners')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'winners' }, payload => {
                        fetchInitialData().then(() => renderCurrentView());
                    })
                    .subscribe();

                realtimeSubscriptions.push(tournSub, winnerSub);

                if (state.currentUser) {
                    const profileSub = supabaseClient
                        .channel(`public:profiles:id=eq.${state.currentUser.id}`)
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles', filter: `id=eq.${state.currentUser.id}` }, payload => {
                            if (payload.new) {
                                state.currentProfile = payload.new;
                                renderCurrentView();
                            }
                        })
                        .subscribe();
                    realtimeSubscriptions.push(profileSub);
                }
            } catch (err) {
                console.error('Realtime subscription error:', err);
            }
        }

        /* ==========================================================================
           6. VIEW ROUTER & RENDER ENGINE
           ========================================================================== */
        function renderCurrentView() {
            const container = document.getElementById('main-content');
            const bottomNav = document.getElementById('bottom-nav');

            if (state.isBanned && state.currentView !== 'banned') {
                state.currentView = 'banned';
            }

            if (['login', 'register', 'forgot', 'banned'].includes(state.currentView)) {
                bottomNav.classList.add('hidden');
            } else {
                bottomNav.classList.remove('hidden');
            }

            switch (state.currentView) {
                case 'home':
                    container.innerHTML = renderHomeView();
                    break;
                case 'matches':
                    container.innerHTML = renderMatchesView();
                    break;
                case 'my-matches':
                    container.innerHTML = renderMyMatchesView();
                    break;
                case 'wallet':
                    container.innerHTML = renderWalletView();
                    break;
                case 'profile':
                    container.innerHTML = renderProfileView();
                    break;
                case 'tournament-detail':
                    container.innerHTML = renderTournamentDetailView(state.currentParams?.id);
                    break;
                case 'leaderboard':
                    container.innerHTML = renderLeaderboardView();
                    break;
                case 'giveaways':
                    container.innerHTML = renderGiveawaysView();
                    break;
                case 'notifications':
                    container.innerHTML = renderNotificationsView();
                    break;
                case 'support':
                    container.innerHTML = renderSupportView();
                    break;
                case 'payment-history':
                    container.innerHTML = renderPaymentHistoryView();
                    break;
                case 'deposit':
                    container.innerHTML = renderDepositView();
                    break;
                case 'edit-profile':
                    container.innerHTML = renderEditProfileView();
                    break;
                case 'login':
                    container.innerHTML = renderLoginView();
                    break;
                case 'register':
                    container.innerHTML = renderRegisterView();
                    break;
                case 'forgot':
                    container.innerHTML = renderForgotView();
                    break;
                case 'banned':
                    container.innerHTML = renderBannedView();
                    break;
                default:
                    container.innerHTML = renderHomeView();
            }
        }

        /* ==========================================================================
           7. VIEW TEMPLATE BUILDERS
           ========================================================================== */

        function renderHomeView() {
            const profile = state.currentProfile || {};
            const featuredTournaments = state.tournamentsCache.filter(t => t.is_featured || t.status === 'upcoming' || t.status === 'live').slice(0, 5);
            const recentWinners = state.winnersCache.slice(0, 3);
            const announcement = state.siteSettings.announcement_text || 'Welcome to Multani FF Official Esports Platform! Join matches & win big prizes.';

            return `
                <div class="p-4 flex flex-col space-y-5">
                    <div class="glass-card rounded-xl p-3 border-neonYellow/20 bg-gradient-to-r from-amber-950/20 to-darkBg flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-lg bg-neonYellow/10 flex items-center justify-center text-neonYellow flex-shrink-0">
                            <i class="fa-solid fa-bullhorn text-sm"></i>
                        </div>
                        <div class="overflow-hidden flex-1">
                            <p class="text-xs text-slate-300 font-medium whitespace-nowrap animate-marquee">${escapeHTML(announcement)}</p>
                        </div>
                    </div>

                    <div class="glass-card rounded-2xl p-4 relative overflow-hidden border-neonRed/20 bg-gradient-to-br from-cardBg via-cardBg to-rose-950/30">
                        <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-neonRed/10 rounded-full blur-2xl pointer-events-none"></div>
                        <div class="flex items-center justify-between mb-4">
                            <div class="flex items-center space-x-3">
                                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-neonRed to-neonYellow p-0.5 flex items-center justify-center">
                                    <div class="w-full h-full bg-slate-900 rounded-[14px] flex items-center justify-center overflow-hidden">
                                        ${profile.avatar_url ? `<img src="${escapeHTML(profile.avatar_url)}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-user text-slate-400"></i>`}
                                    </div>
                                </div>
                                <div>
                                    <span class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Welcome Back</span>
                                    <h2 class="heading-font font-bold text-lg text-white leading-tight">${escapeHTML(profile.username || profile.full_name || 'Free Fire Warrior')}</h2>
                                </div>
                            </div>
                            <button onclick="fetchInitialData(); showToast('Refreshed arena data', 'success');" class="w-8 h-8 rounded-xl bg-slate-800/80 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-white transition">
                                <i class="fa-solid fa-rotate text-xs"></i>
                            </button>
                        </div>

                        <div class="grid grid-cols-2 gap-3 pt-2 border-t border-slate-800">
                            <div>

            e.preventDefault();
            if (!state.currentUser) return;

        async function handleProfileUpdate(e) {
            e.preventDefault();
            if (!state.currentUser) return;

            const username = document.getElementById('edit-username').value.trim();
            const fullName = document.getElementById('edit-fullname').value.trim();
            const ffUid = document.getElementById('edit-ff-uid').value.trim();
            const ffName = document.getElementById('edit-ff-name').value.trim();
            const phone = document.getElementById('edit-phone').value.trim();
            const fileInput = document.getElementById('edit-avatar-file');
            let avatarUrl = document.getElementById('edit-avatar-url').value.trim();

            setGlobalLoading(true, 'SAVING PROFILE...');
            try {
                if (fileInput.files && fileInput.files[0]) {
                    const file = fileInput.files[0];
                    avatarUrl = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(file);
                    });
                }

                const { error } = await supabaseClient
                    .from('profiles')
                    .update({
                        username: username,
                        full_name: fullName,
                        free_fire_uid: ffUid,
                        free_fire_name: ffName,
                        phone: phone,
                        avatar_url: avatarUrl,
                        updated_at: new Date()
                    })
                    .eq('id', state.currentUser.id);

                if (error) throw error;

                showToast('Profile updated successfully!', 'success');
                await fetchUserProfile(state.currentUser.id);
                navigateTo('profile');
            } catch (err) {
                console.error('Profile update error:', err);
                showToast(err.message || 'Failed to update profile.', 'error');
            } finally {
                setGlobalLoading(false);
            }
        }

        async function joinTournamentRPC(tournamentId) {
            if (!state.currentUser) {
                showToast('Please login to join tournaments.', 'error');
                navigateTo('login');
                return;

            if (!state.currentProfile?.free_fire_uid || !state.currentProfile?.free_fire_name) {
                showToast('Please set your Free Fire UID and IGN in your profile first.', 'error');
                navigateTo('edit-profile');
                return;
            }

            setGlobalLoading(true, 'JOINING TOURNAMENT...');
            try {
                const { data, error } = await supabaseClient.rpc('join_tournament', {
                    tournament_id_input: tournamentId,
                    user_id_input: state.currentUser.id
                });

                if (error) throw error;

                showToast('Successfully joined tournament!', 'success');
                await fetchInitialData();
                await fetchUserDataAuthenticated();
                navigateTo('tournament-detail', { id: tournamentId });
            } catch (err) {
                console.error('Join tournament error:', err);
                showToast(err.message || 'Failed to join tournament.', 'error');
            } finally {
                setGlobalLoading(false);
            }
        }

                                        <h4 class="text-xs font-bold text-white mb-0.5">${escapeHTML(p.payment_method)}</h4>
                                        <span class="text-[10px] text-slate-400 font-mono">TID: ${escapeHTML(p.transaction_id || 'N/A')}</span>
                                        <span class="text-[9px] text-slate-500 block mt-1">${formatDate(p.created_at)}</span>
                                    </div>
                                    <div class="text-right">
                                        <span class="heading-font font-bold text-sm text-white block mb-1">${formatCurrency(p.amount)}</span>
                                        <span class="px-2 py-0.5 rounded-full text-[9px] font-bold uppercase bg-slate-800 text-slate-300">${escapeHTML(p.status)}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        function renderLoginView() {
            return `
                <div class="p-6 flex flex-col justify-center min-h-screen">
                    <div class="text-center mb-8">
                        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-neonRed to-neonYellow p-0.5 mx-auto mb-3 shadow-xl neon-glow-red flex items-center justify-center">
                            <div class="w-full h-full bg-darkBg rounded-[14px] flex items-center justify-center">
                                <i class="fa-solid fa-fire text-neonRed text-2xl"></i>
                            </div>
                        </div>
                        <h1 class="heading-font font-bold text-2xl text-white tracking-wider">MULTANI FF</h1>
                        <p class="text-xs text-slate-400 mt-1">Official Esports Tournament Platform</p>
                    </div>

                    <form onsubmit="handleLoginSubmit(event)" class="glass-card rounded-2xl p-5 border border-cardBorder space-y-4">
                        <h2 class="heading-font font-bold text-base text-white">Login to Your Account</h2>

                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
                            <input type="email" id="login-email" required placeholder="player@example.com" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-3 text-xs text-white focus:outline-none focus:border-neonRed">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                            <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-3 text-xs text-white focus:outline-none focus:border-neonRed">
                        </div>

                        <button type="submit" class="w-full py-3 rounded-xl bg-neonRed text-white text-xs font-bold shadow-lg neon-glow-red hover:bg-rose-600 transition">Login to Arena</button>

                        <div class="text-center pt-2">
                            <span class="text-xs text-slate-400">Don't have an account? <button type="button" onclick="navigateTo('register', {}, false)" class="text-neonRed font-bold hover:underline">Register</button></span>
                        </div>
                    </form>
                </div>
            `;
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            setGlobalLoading(true, 'LOGGING IN...');
            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) throw error;

                showToast('Login successful!', 'success');
                await fetchInitialData();
                if (state.isBanned) {
                    navigateTo('banned', {}, false);
                } else {
                    navigateTo('home', {}, false);
                }
            } catch (err) {
                console.error('Login error:', err);
                showToast(err.message || 'Invalid email or password.', 'error');
            } finally {
                setGlobalLoading(false);
            }
        }

        function renderRegisterView() {
            return `
                <div class="p-6 flex flex-col justify-center min-h-screen">
                    <div class="text-center mb-6">
                        <h1 class="heading-font font-bold text-2xl text-white tracking-wider">CREATE ACCOUNT</h1>
                        <p class="text-xs text-slate-400 mt-1">Join the ultimate Free Fire esports arena</p>
                    </div>

                    <form onsubmit="handleRegisterSubmit(event)" class="glass-card rounded-2xl p-5 border border-cardBorder space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">Username</label>
                            <input type="text" id="reg-username" required placeholder="MultaniKing" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-neonRed">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
                            <input type="email" id="reg-email" required placeholder="player@example.com" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-neonRed">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                            <input type="password" id="reg-password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-neonRed">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">Free Fire UID</label>
                            <input type="text" id="reg-ff-uid" required placeholder="123456789" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-neonRed">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">Free Fire IGN</label>
                            <input type="text" id="reg-ff-name" required placeholder="MULTANI_WARRIOR" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-neonRed">
                        </div>

                        <button type="submit" class="w-full py-3 rounded-xl bg-neonRed text-white text-xs font-bold shadow-lg neon-glow-red hover:bg-rose-600 transition mt-2">Register Account</button>

                        <div class="text-center pt-2">
                            <span class="text-xs text-slate-400">Already have an account? <button type="button" onclick="navigateTo('login', {}, false)" class="text-neonRed font-bold hover:underline">Login</button></span>
                        </div>
                    </form>
                </div>
            `;
        }

        async function handleRegisterSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const ffUid = document.getElementById('reg-ff-uid').value.trim();
            const ffName = document.getElementById('reg-ff-name').value.trim();

            setGlobalLoading(true, 'CREATING ACCOUNT...');
            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email,
                    password,
                    options: {
                        data: {
                            username: username,
                            free_fire_uid: ffUid,
                            free_fire_name: ffName
                        }
                    }
                });

                if (error) throw error;

                showToast('Registration successful! Please login.', 'success');
                navigateTo('login', {}, false);
            } catch (err) {
                console.error('Registration error:', err);
                showToast(err.message || 'Registration failed.', 'error');
            } finally {
                setGlobalLoading(false);
            }
        }

        function renderBannedView() {
            return `
                <div class="p-6 flex flex-col items-center justify-center min-h-screen text-center">
                    <div class="w-16 h-16 rounded-2xl bg-rose-500/10 text-neonRed flex items-center justify-center text-3xl mb-4 border border-rose-500/20">
                        <i class="fa-solid fa-ban"></i>
                    </div>
                    <h1 class="heading-font font-bold text-2xl text-white mb-2">Account Banned</h1>
                    <p class="text-xs text-slate-400 mb-6 leading-relaxed">Your account has been restricted due to violation of platform rules or fair play policies.</p>
                    <button onclick="handleLogout()" class="px-6 py-3 rounded-xl bg-slate-800 text-white text-xs font-bold hover:bg-slate-700 transition">Logout</button>
                </div>
            `;
        }

        async function handleLogout() {
            setGlobalLoading(true, 'LOGGING OUT...');
            try {
                await supabaseClient.auth.signOut();
                state.currentUser = null;
                state.currentProfile = null;
                state.isAdmin = false;
                state.isBanned = false;
                showToast('Logged out successfully', 'success');
                navigateTo('login', {}, false);
            } catch (err) {
                console.error('Logout error:', err);
            } finally {
                setGlobalLoading(false);
            }
        }

        function copyToClipboard(text, label = 'Text') {
            if (!text) {
                showToast(`No ${label} available to copy.`, 'error');
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                showToast(`${label} copied to clipboard!`, 'success');
            }).catch(() => {
                showToast(`Failed to copy ${label}.`, 'error');
            });
        }

        function copyReferralCode() {
            const code = state.currentProfile?.referral_code || state.currentUser?.id?.slice(0, 8) || 'MULTANI2026';
            copyToClipboard(code, 'Referral Code');
        }

        async function markAllNotificationsRead() {
            if (!state.currentUser) return;
            try {
                await supabaseClient
                    .from('notifications')
                    .update({ is_read: true })
                    .eq('user_id', state.currentUser.id);
                
                await fetchUserDataAuthenticated();
                renderCurrentView();
                showToast('Marked all as read', 'success');
            } catch (err) {
                console.error('Error marking notifications read:', err);
            }
        }
    </script>
</body>
</html>
