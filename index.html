<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multani FF Official Tournament Arena</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-dark: #022013;
      --bg-gradient: radial-gradient(circle at 50% 0%, #08482c 0%, #032316 45%, #01130a 100%);
      --mint-primary: #00e676;
      --gold: #ffb703;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #010d07; color: #f8fafc; display: flex; justify-content: center; min-height: 100vh; }
    .app-viewport { width: 100%; max-width: 440px; background: var(--bg-gradient); min-height: 100vh; padding-bottom: 90px; position: relative; box-shadow: 0 0 40px rgba(0,0,0,0.8); }
    .top-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(2, 32, 19, 0.95); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(0,230,118,0.2); }
    .wallet-badge { background: rgba(255,183,3,0.2); border: 1px solid var(--gold); padding: 5px 10px; border-radius: 14px; color: var(--gold); font-size: 11.5px; font-weight: 800; }
    .main-container { padding: 16px; }
    .btn-action { width: 100%; background: var(--mint-primary); color: #012817; border: none; padding: 12px; border-radius: 8px; font-weight: 900; cursor: pointer; margin-top: 8px; font-size: 13px; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; padding: 16px; }
    .modal-box { background: #0d121a; border: 1px solid rgba(0,230,118,0.4); width: 100%; max-width: 400px; border-radius: 12px; padding: 16px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { font-size: 11px; color: #a7f3d0; display: block; margin-bottom: 4px; font-weight: 700; }
    .form-group input { width: 100%; background: #06090e; border: 1px solid rgba(0,230,118,0.3); border-radius: 6px; padding: 9px; color: #fff; font-size: 12px; outline: none; }
  </style>
</head>
<body>

  <div class="app-viewport">
    <div class="top-header">
      <div class="wallet-badge"><i class="fa-solid fa-coins"></i> Rs. <span id="navWalletBal">0</span></div>
      <div style="display:flex; gap:10px;">
        <button onclick="openAuthModal()" style="background:var(--mint-primary); border:none; padding:5px 12px; border-radius:6px; font-weight:900; font-size:11px; cursor:pointer;">Login / Signup</button>
        <button onclick="openAdminModal()" style="background:var(--gold); border:none; padding:5px 10px; border-radius:6px; font-weight:900; font-size:11px; cursor:pointer;"><i class="fa-solid fa-shield"></i> Admin</button>
      </div>
    </div>

    <div class="main-container">
      <h2 style="font-size:15px; color:var(--mint-primary); margin-bottom:12px;"><i class="fa-solid fa-gamepad"></i> Multani FF Tournaments</h2>
      <div id="tournamentsList" style="display:flex; flex-direction:column; gap:10px;">
        <!-- Dynamic Tournaments Load Here -->
      </div>
    </div>
  </div>

  <!-- Auth Modal -->
  <div class="modal" id="authModal">
    <div class="modal-box">
      <h3 style="color:#fff; font-size:14px; margin-bottom:10px;">Player Login / Signup</h3>
      <div class="form-group"><label>Gmail</label><input type="email" id="authEmail" placeholder="player@gmail.com"></div>
      <div class="form-group"><label>Password</label><input type="password" id="authPass" placeholder="Password"></div>
      <button class="btn-action" onclick="supabaseLogin()">Login</button>
      <button class="btn-action" onclick="supabaseSignup()" style="background:#38bdf8;">Sign Up</button>
      <button onclick="closeModal('authModal')" style="width:100%; background:transparent; border:none; color:#94a3b8; margin-top:8px; cursor:pointer;">Close</button>
    </div>
  </div>

  <!-- Admin Modal Panel -->
  <div class="modal" id="adminModal">
    <div class="modal-box">
      <h3 style="color:var(--gold); font-size:14px; margin-bottom:10px;"><i class="fa-solid fa-gear"></i> Admin Control Panel</h3>
      <div class="form-group"><label>Tournament Title</label><input type="text" id="admTitle" placeholder="Bermuda Daily Clash"></div>
      <div class="form-group"><label>Entry Fee (Rs)</label><input type="number" id="admFee" placeholder="50"></div>
      <div class="form-group"><label>Prize (Rs)</label><input type="number" id="admPrize" placeholder="500"></div>
      <button class="btn-action" onclick="adminAddTournament()">Add Tournament to Supabase</button>
      <button onclick="closeModal('adminModal')" style="width:100%; background:transparent; border:none; color:#94a3b8; margin-top:8px; cursor:pointer;">Close</button>
    </div>
  </div>

  <script>
    // Supabase Credentials Configured
    const SUPABASE_URL = 'https://eyrwqmirdigsckcwbmxn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_N2bFvVebY84Ac4kF7KPYjw_1YCdUUHX';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = JSON.parse(localStorage.getItem('mff_user')) || null;

    function openAuthModal() { document.getElementById('authModal').style.display = 'flex'; }
    function openAdminModal() { document.getElementById('adminModal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    async function supabaseSignup() {
      const email = document.getElementById('authEmail').value.trim();
      const pass = document.getElementById('authPass').value.trim();
      if (!email || !pass) { alert("Email aur password likhein!"); return; }

      const { data, error } = await supabase.auth.signUp({ email, password: pass });
      if (error) { alert("Error: " + error.message); return; }
      alert("✅ Signup successful! Ab login karein.");
    }

    async function supabaseLogin() {
      const email = document.getElementById('authEmail').value.trim();
      const pass = document.getElementById('authPass').value.trim();
      if (!email || !pass) { alert("Email aur password likhein!"); return; }

      const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });
      if (error) { alert("❌ Login Failed: " + error.message); return; }

      currentUser = data.user;
      localStorage.setItem('mff_user', JSON.stringify(currentUser));
      closeModal('authModal');
      alert("✅ Login Successful!");
      loadTournaments();
    }

    async function adminAddTournament() {
      const title = document.getElementById('admTitle').value.trim();
      const fee = Number(document.getElementById('admFee').value);
      const prize = Number(document.getElementById('admPrize').value);

      if (!title) { alert("Title likhein!"); return; }

      const { error } = await supabase
        .from('tournaments')
        .insert([{ title: title, fee: fee, prize: prize, map: 'Bermuda', time: '8:00 PM', total_slots: 12 }]);

      if (error) { alert("Error adding: " + error.message); return; }
      alert("✅ Tournament database mein add ho gaya!");
      closeModal('adminModal');
      loadTournaments();
    }

    async function loadTournaments() {
      const container = document.getElementById('tournamentsList');
      container.innerHTML = "Loading...";

      const { data, error } = await supabase.from('tournaments').select('*');
      if (error) {
        container.innerHTML = "Error loading tournaments.";
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = "<div style='font-size:11px; color:#94a3b8;'>Koi tournament available nahi hai. Admin panel se add karein.</div>";
        return;
      }

      container.innerHTML = "";
      data.forEach(m => {
        const div = document.createElement('div');
        div.style.cssText = "background:#04130b; border:1px solid rgba(0,230,118,0.3); border-radius:8px; padding:10px; font-size:12px;";
        div.innerHTML = `
          <div style="font-weight:900; color:#fff;">${m.title}</div>
          <div style="color:#a7f3d0; font-size:11px; margin-top:2px;">Fee: Rs.${m.fee} | Prize: Rs.${m.prize}</div>
        `;
        container.appendChild(div);
      });
    }

    window.onload = function() {
      loadTournaments();
      if (currentUser) {
        document.getElementById('navWalletBal').innerText = currentUser.walletBalance || 0;
      }
    };
  </script>
</body>
</html>
