<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multani.ff - Arena Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #022013;
      --bg-gradient: radial-gradient(circle at 50% 0%, #08482c 0%, #032316 45%, #01130a 100%);
      --mint-primary: #00e676;
      --mint-accent: #2de28d;
      --card-white: #ffffff;
      --text-dark: #0a291b;
      --gold: #ffb703;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #010d07; color: #f8fafc; display: flex; justify-content: center; min-height: 100vh; }

    .app-viewport {
      width: 100%;
      max-width: 440px;
      background: var(--bg-gradient);
      min-height: 100vh;
      padding-bottom: 96px;
      position: relative;
      border-left: 1px solid rgba(0, 230, 118, 0.2);
      border-right: 1px solid rgba(0, 230, 118, 0.2);
      box-shadow: 0 0 50px rgba(0,0,0,0.9);
      overflow-x: hidden;
    }

    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(2, 32, 19, 0.9);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .profile-avatar-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 230, 118, 0.2);
      border: 1px solid var(--mint-accent);
      padding: 4px 10px 4px 5px;
      border-radius: 20px;
      cursor: pointer;
    }
    .avatar-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--mint-primary), #004d40);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 900;
      color: #fff;
    }
    .badge-name { font-size: 11px; font-weight: 800; color: #fff; max-width: 75px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .nav-tabs { display: flex; gap: 14px; font-size: 15px; font-weight: 800; }
    .nav-tab-item { color: rgba(255,255,255,0.6); cursor: pointer; position: relative; }
    .nav-tab-item.active { color: #fff; }
    .nav-tab-item.active::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 3px;
      background: var(--mint-primary);
      border-radius: 2px;
    }
    .top-search-btn { font-size: 17px; color: var(--mint-primary); cursor: pointer; }

    .hero-banner-container { padding: 12px 16px; }
    .hero-glass-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 14px;
      padding: 12px 14px;
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      color: var(--text-dark);
    }
    .mine-ribbon {
      position: absolute;
      top: 0;
      left: 0;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #fff;
      font-size: 8px;
      font-weight: 900;
      padding: 3px 12px;
      border-bottom-right-radius: 8px;
      border-top-left-radius: 14px;
      letter-spacing: 0.5px;
    }
    .hero-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #022013;
      border: 2px solid var(--mint-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--mint-primary);
      font-size: 20px;
      flex-shrink: 0;
    }
    .hero-details { flex: 1; margin-top: 4px; }
    .hero-title-row { display: flex; align-items: center; justify-content: space-between; font-weight: 900; font-size: 13px; }
    .hero-subtitle { font-size: 11px; color: #475569; margin-top: 2px; }
    .easypaisa-tag {
      display: inline-block;
      margin-top: 5px;
      background: #e8f5e9;
      color: #1b5e20;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid #a5d6a7;
    }

    .filter-track {
      margin: 4px 16px 14px;
      background: rgba(0, 48, 25, 0.6);
      padding: 4px;
      border-radius: 26px;
      display: flex;
      justify-content: space-between;
      border: 1px solid rgba(0, 230, 118, 0.2);
    }
    .filter-item {
      flex: 1;
      text-align: center;
      padding: 8px 4px;
      font-size: 11px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.25s ease;
    }
    .filter-item.active {
      background: linear-gradient(135deg, var(--mint-primary), #00b0ff);
      color: #012817;
      font-weight: 900;
      box-shadow: 0 3px 10px rgba(0, 230, 118, 0.4);
    }

    .grid-container {
      padding: 0 16px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .tournament-grid-card {
      background: #ffffff;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
      cursor: pointer;
      position: relative;
      transition: transform 0.2s;
    }
    .tournament-grid-card:active { transform: scale(0.98); }
    .card-thumb-wrap { position: relative; width: 100%; height: 125px; background: #0d1e15; }
    .card-thumb { width: 100%; height: 100%; object-fit: cover; }
    .thumb-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.7)); }
    .card-live-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.55);
      border-radius: 12px;
      padding: 2px 7px;
      font-size: 9px;
      font-weight: 800;
      color: #00f0ff;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .card-thumb-text {
      position: absolute;
      bottom: 6px;
      left: 8px;
      right: 8px;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .card-body {
      padding: 9px 8px;
      background: #ffffff;
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .card-room-title {
      font-size: 12px;
      font-weight: 900;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-room-desc { font-size: 10px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-footer-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      padding-top: 4px;
      border-top: 1px dashed #e2e8f0;
      font-size: 10px;
      font-weight: 800;
    }
    .fee-badge { color: #059669; }
    .prize-badge { color: #d97706; }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 440px;
      height: 70px;
      background: rgba(1, 22, 12, 0.95);
      backdrop-filter: blur(15px);
      border-top: 1px solid rgba(0, 230, 118, 0.25);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }
    .bot-item {
      background: transparent;
      border: none;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      position: relative;
    }
    .bot-item.active { color: var(--mint-primary); }
    .bot-icon-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .bot-item.active .bot-icon-circle {
      background: linear-gradient(135deg, var(--mint-primary), #00796b);
      color: #fff;
      border-color: var(--mint-accent);
      box-shadow: 0 0 10px rgba(0, 230, 118, 0.5);
    }
    .bot-item span { font-size: 10px; font-weight: 800; }
    .bot-badge-bubble {
      position: absolute;
      top: -2px;
      right: -2px;
      background: #ef4444;
      color: #fff;
      font-size: 9px;
      font-weight: 900;
      min-width: 16px;
      height: 16px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #012213;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-dialog {
      background: #071f14;
      border: 1px solid rgba(0, 230, 118, 0.3);
      width: 100%;
      max-width: 380px;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-title { font-size: 15px; font-weight: 900; color: #fff; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    .form-ctrl { margin-bottom: 12px; }
    .form-ctrl label { font-size: 11px; font-weight: 700; color: #a7f3d0; display: block; margin-bottom: 4px; }
    .form-ctrl input {
      width: 100%;
      background: #02110a;
      border: 1px solid rgba(0, 230, 118, 0.2);
      border-radius: 10px;
      padding: 10px 12px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .form-ctrl input:focus { border-color: var(--mint-primary); }
    .btn-green-action {
      width: 100%;
      background: linear-gradient(135deg, var(--mint-primary), #00b0ff);
      border: none;
      color: #012817;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn-modal-close {
      width: 100%;
      background: transparent;
      border: none;
      color: #64748b;
      padding: 8px;
      cursor: pointer;
      font-size: 11px;
      margin-top: 4px;
    }

    /* Event Card Styles */
    .event-card {
      background: linear-gradient(135deg, rgba(2, 38, 20, 0.95), rgba(7, 49, 28, 0.8));
      border: 1px solid rgba(0, 230, 118, 0.3);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }
    .event-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--gold);
    }
    .event-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .event-card-title { font-size: 13px; font-weight: 900; color: #fff; }
    .event-badge {
      background: rgba(255, 183, 3, 0.15);
      border: 1px solid var(--gold);
      color: var(--gold);
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .event-desc { font-size: 11px; color: #94a3b8; line-height: 1.4; margin-bottom: 8px; }
    .event-reward-tag {
      background: rgba(0, 230, 118, 0.15);
      border: 1px solid var(--mint-primary);
      color: var(--mint-primary);
      font-size: 11px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    
    <div class="top-header">
      <div class="profile-avatar-badge" onclick="openLoginModal()">
        <div class="avatar-circle"><i class="fa-solid fa-gamepad"></i></div>
        <span class="badge-name" id="navUserBadge">LOGIN</span>
      </div>
      <div class="nav-tabs">
        <span class="nav-tab-item">Explore</span>
        <span class="nav-tab-item">Hot</span>
        <span class="nav-tab-item active">My</span>
      </div>
      <div class="top-search-btn" onclick="openLoginModal()"><i class="fa-solid fa-magnifying-glass"></i></div>
    </div>

    <div class="hero-banner-container">
      <div class="hero-glass-card">
        <div class="mine-ribbon">Mine</div>
        <div class="hero-avatar"><i class="fa-solid fa-crown"></i></div>
        <div class="hero-details">
          <div class="hero-title-row">
            <span><i class="fa-brands fa-whatsapp" style="color:#25d366;"></i> Multani Official</span>
            <span style="font-size: 10px; color:#00b0ff;"><i class="fa-solid fa-signal"></i> LIVE</span>
          </div>
          <div class="hero-subtitle">💖 Prince & Princess Esports Arena 🔥</div>
          <div class="easypaisa-tag">EasyPaisa: 03186815926 (Nadeem)</div>
        </div>
      </div>
    </div>

    <div class="filter-track">
      <div class="filter-item active" onclick="setMapFilter('All', this)">Recently</div>
      <div class="filter-item" onclick="setMapFilter('Bermuda', this)">Bermuda</div>
      <div class="filter-item" onclick="setMapFilter('Purgatory', this)">Purgatory</div>
      <div class="filter-item" onclick="setMapFilter('Clash Squad', this)">CS Battle</div>
    </div>

    <div class="grid-container" id="matchesContainer"></div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-bar">
      <button class="bot-item" onclick="openEventsModal()">
        <div class="bot-icon-circle">
          <i class="fa-solid fa-gift" style="color:#ff4625;"></i>
        </div>
        <span class="bot-badge-bubble" id="eventsBadgeCount">0</span>
        <span>Events</span>
      </button>

      <button class="bot-item active" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
        <div class="bot-icon-circle"><i class="fa-solid fa-shield-halved"></i></div>
        <span>Battle</span>
      </button>

      <button class="bot-item" onclick="openSupportModal()">
        <div class="bot-icon-circle"><i class="fa-solid fa-comments" style="color:var(--mint-primary);"></i></div>
        <span class="bot-badge-bubble" id="supportNotifyDot" style="display:none;">1</span>
        <span>Chat</span>
      </button>

      <button class="bot-item" onclick="openLoginModal()">
        <div class="bot-icon-circle"><i class="fa-solid fa-users" style="color:#ffd000;"></i></div>
        <span class="bot-badge-bubble">1</span>
        <span>Profile</span>
      </button>
    </div>

  </div>

  <!-- Dynamic Events & Giveaway Modal -->
  <div class="modal-backdrop" id="eventsModal">
    <div class="modal-dialog">
      <div class="modal-title">
        <span style="color:#ff4625;"><i class="fa-solid fa-gift"></i> Active Giveaways & Events</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeModal('eventsModal')"></i>
      </div>
      
      <div id="eventsListContainer">
        <!-- Dynamic Giveaways Load Here -->
      </div>

      <button class="btn-modal-close" onclick="closeModal('eventsModal')">Close</button>
    </div>
  </div>

  <script>
    // Initial Default Giveaways
    const initialGiveaways = [
      {
        id: "ev_1",
        title: "Weekly Diamond Giveaway 💎",
        desc: "Top 3 highest killer players ko 1000 Diamonds free transfer kiye jayenge Sunday raat.",
        reward: "1,000 Diamonds",
        endDate: "Sunday 10:00 PM"
      }
    ];

    function getGiveaways() {
      return JSON.parse(localStorage.getItem('mff_giveaways')) || initialGiveaways;
    }

    function updateEventsBadge() {
      const gList = getGiveaways();
      const badge = document.getElementById('eventsBadgeCount');
      if (badge) badge.innerText = gList.length;
    }

    function openEventsModal() {
      const gList = getGiveaways();
      const container = document.getElementById('eventsListContainer');
      container.innerHTML = "";

      if (gList.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding: 30px 10px; color:#94a3b8; font-size:12px;">
            <i class="fa-solid fa-box-open" style="font-size:32px; color:rgba(255,255,255,0.2); margin-bottom:8px; display:block;"></i>
            Filhal koi naya giveaway ya event live nahi hai.
          </div>`;
      } else {
        gList.forEach(ev => {
          const card = document.createElement('div');
          card.className = "event-card";
          card.innerHTML = `
            <div class="event-card-header">
              <span class="event-card-title">${ev.title}</span>
              <span class="event-badge"><i class="fa-solid fa-clock"></i> ${ev.endDate}</span>
            </div>
            <div class="event-desc">${ev.desc}</div>
            <div class="event-reward-tag"><i class="fa-solid fa-trophy"></i> Reward: ${ev.reward}</div>
          `;
          container.appendChild(card);
        });
      }

      document.getElementById('eventsModal').style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = "none";
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (!localStorage.getItem('mff_giveaways')) {
        localStorage.setItem('mff_giveaways', JSON.stringify(initialGiveaways));
      }
      updateEventsBadge();
    });
  </script>
</body>
</html>
