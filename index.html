</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multani FF Official Tournament</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#091216;
  color:white;
  min-height:100vh;
  padding-bottom:90px;
}

/* Top Header */
.top-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 15px;
  background:#0d1b22;
  border-bottom:1px solid #162935;
  position:sticky;
  top:0;
  z-index:100;
}

.logo-area{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:bold;
  font-size:15px;
  color:#00ff9d;
}

.logo-icon{
  background:#00d084;
  color:#091216;
  width:28px;
  height:28px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
}

.search-box{
  flex:1;
  margin:0 10px;
  background:#14222b;
  border-radius:20px;
  padding:6px 12px;
  display:flex;
  align-items:center;
  gap:8px;
  border:1px solid #1e3340;
}

.search-box input{
  background:transparent;
  border:none;
  color:white;
  font-size:13px;
  width:100%;
  outline:none;
}

.header-icons{
  display:flex;
  gap:8px;
}

.icon-btn{
  background:#14222b;
  border:1px solid #1e3340;
  color:#a3e4d7;
  width:32px;
  height:32px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:13px;
}

.container{
  width:95%;
  max-width:700px;
  margin:15px auto;
}

/* Featured Banner Card */
.featured-card{
  background:linear-gradient(135deg, #0d1b22 0%, #112836 100%);
  border:1px solid #1a3848;
  border-radius:18px;
  padding:15px;
  position:relative;
  overflow:hidden;
  box-shadow:0 4px 15px rgba(0,0,0,0.5);
  margin-bottom:15px;
}

.badge-featured{
  background:#00d084;
  color:#091216;
  font-size:10px;
  font-weight:bold;
  padding:3px 8px;
  border-radius:6px;
  display:inline-block;
  margin-bottom:10px;
}

.profile-info{
  text-align:center;
}

.avatar-circle{
  width:55px;
  height:55px;
  border-radius:50%;
  border:2px solid #00ff9d;
  margin:0 auto 8px auto;
  object-fit:cover;
  background:#1b3644;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.profile-name{
  font-size:15px;
  font-weight:bold;
  color:#fff;
}

.profile-sub{
  font-size:12px;
  color:#00ff9d;
  margin-top:2px;
}

/* Download APK Banner */
.download-banner{
  background:#0d261e;
  border:1px solid #144535;
  border-radius:15px;
  padding:12px 15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.download-banner h4{
  font-size:13px;
  color:#00ff9d;
}

.download-banner p{
  font-size:11px;
  color:#a3e4d7;
}

.dl-btn{
  background:#00d084;
  color:#05150a;
  padding:8px 14px;
  border-radius:12px;
  font-weight:bold;
  font-size:12px;
  border:none;
  cursor:pointer;
}

/* Filter Bar */
.filter-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.filter-title{
  font-size:14px;
  font-weight:bold;
  color:#fff;
  display:flex;
  align-items:center;
  gap:6px;
}

.sort-dropdown{
  background:#14222b;
  color:#a3e4d7;
  border:1px solid #1e3340;
  padding:6px 10px;
  border-radius:12px;
  font-size:12px;
  outline:none;
}

/* Category Pills */
.pills-container{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:12px;
  white-space:nowrap;
}

.pill{
  background:#14222b;
  color:#a3e4d7;
  border:1px solid #1e3340;
  padding:7px 16px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
}

.pill.active{
  background:#00d084;
  color:#091216;
  border-color:#00ff9d;
}

/* Grid Tournaments */
.grid-tournaments{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.t-card{
  background:#0d1b22;
  border:1px solid #162935;
  border-radius:16px;
  overflow:hidden;
  position:relative;
  box-shadow:0 3px 10px rgba(0,0,0,0.3);
  cursor:pointer;
}

.t-thumb{
  height:110px;
  background:#14222b;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#00ff9d;
  font-size:26px;
}

.whatsapp-tag{
  position:absolute;
  top:8px;
  right:8px;
  background:rgba(0,0,0,0.6);
  color:#00ff9d;
  font-size:9px;
  padding:2px 6px;
  border-radius:6px;
  border:1px solid #00d084;
}

.t-body{
  padding:10px;
}

.t-title{
  font-size:13px;
  font-weight:bold;
  color:#fff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.t-cat{
  font-size:10px;
  color:#8aa0ae;
  margin-top:3px;
}

.t-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:8px;
  padding-top:6px;
  border-top:1px solid #14222b;
  font-size:10px;
  color:#8aa0ae;
}

/* Bottom Navigation */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#0d1b22;
  border-top:1px solid #162935;
  display:flex;
  justify-content:space-around;
  align-items:center;
  padding:10px 0;
  z-index:100;
}

.nav-item{
  background:transparent;
  border:none;
  color:#8aa0ae;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  font-size:11px;
  cursor:pointer;
}

.nav-item.active{
  color:#00ff9d;
}

.nav-center-btn{
  background:#00d084;
  color:#091216;
  width:42px;
  height:42px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  border:none;
  box-shadow:0 0 15px rgba(0,208,132,0.4);
  margin-top:-15px;
  cursor:pointer;
}

.card{
  background:#0d1b22;
  border:1px solid #162935;
  border-radius:18px;
  padding:20px;
  margin-bottom:15px;
}

.hidden{ display:none; }
input{ width:100%; padding:12px; margin:6px 0; background:#14222b; border:1px solid #1e3340; border-radius:10px; color:white; font-size:14px; outline:none; }
button.main-btn{ width:100%; padding:12px; margin-top:10px; background:#00d084; color:#091216; font-weight:bold; border:none; border-radius:10px; cursor:pointer; }
.blue-btn{ background:#1b4f72 !important; color:white !important; }
</style>
</head>

<body>

<!-- TOP HEADER BAR -->
<header class="top-header">
  <div class="logo-area">
    <div class="logo-icon"><i class="fa-solid fa-fire"></i></div>
    <span>Multani FF Official</span>
  </div>
  <div class="search-box">
    <i class="fa-solid fa-search" style="color:#8aa0ae; font-size:12px;"></i>
    <input type="text" placeholder="Search Tournament...">
  </div>
  <div class="header-icons">
    <div class="icon-btn"><i class="fa-solid fa-share-nodes"></i></div>
    <div class="icon-btn"><i class="fa-solid fa-gear"></i></div>
    <div class="icon-btn"><i class="fa-solid fa-bars"></i></div>
  </div>
</header>

<div class="container">

  <!-- HOME DASHBOARD SECTION -->
  <div id="homeSection">

    <!-- FEATURED PROFILE CARD -->
    <div class="featured-card">
      <span class="badge-featured">🔥 OFFICIAL TOURNAMENT</span>
      <div class="profile-info">
        <div class="avatar-circle"><i class="fa-solid fa-trophy" style="color:#00ff9d;"></i></div>
        <div class="profile-name" id="dashUsername">☆Mr ᝰ Nadeem.ff ᝰ</div>
        <div class="profile-sub">🔥 Multani FF Official ©</div>
        <div style="font-size:11px; color:#a3e4d7; margin-top:4px;">Free Fire UID: <span id="dashUid">3239454397</span></div>
      </div>
    </div>

    <!-- DOWNLOAD APK BANNER -->
    <div class="download-banner">
      <div>
        <h4>ڈاون لوڈ آفیشل ایپ</h4>
        <p>Download Official App (APK)</p>
      </div>
      <button class="dl-btn"><i class="fa-solid fa-download"></i> Download</button>
    </div>

    <!-- FILTER & CATEGORIES -->
    <div class="filter-row">
      <div class="filter-title"><i class="fa-solid fa-layer-group" style="color:#00ff9d;"></i> Tournaments</div>
      <select class="sort-dropdown">
        <option>Latest First</option>
        <option>Oldest First</option>
      </select>
    </div>

    <div class="pills-container">
      <button class="pill active">All Matches</button>
      <button class="pill">Solo</button>
      <button class="pill">Duo</button>
      <button class="pill">Squad</button>
    </div>

    <!-- TOURNAMENTS GRID SECTION -->
    <div id="tournamentsGrid" class="grid-tournaments">
      <!-- Dynamic Tournaments will load here -->
    </div>

  </div>

  <!-- AUTH / PROFILE SECTION -->
  <div id="profileAuthSection" class="hidden">
    <div class="card" id="loginCard">
      <h2>🔐 Login / Signup</h2>
      <input id="email" type="email" placeholder="Email">
      <input id="password" type="password" placeholder="Password">
      <button class="main-btn" onclick="signup()">CREATE ACCOUNT</button>
      <button class="main-btn blue-btn" onclick="login()">LOGIN</button>
    </div>

    <div class="card hidden" id="userCard">
      <h2>👤 My Profile</h2>
      <p style="margin-top:10px;">Username: <b id="profileName" style="color:#00ff9d;">-</b></p>
      <p style="margin-top:5px;">UID: <b id="profileUid" style="color:#00ff9d;">-</b></p>
      <div style="display:flex; gap:10px; margin-top:15px;">
        <div style="flex:1; background:#14222b; padding:12px; border-radius:12px; text-align:center;">
          💰 Wallet <div style="font-size:18px; font-weight:bold; color:#00ff9d;" id="walletBal">0</div>
        </div>
        <div style="flex:1; background:#14222b; padding:12px; border-radius:12px; text-align:center;">
          🏆 Wins <div style="font-size:18px; font-weight:bold; color:#00ff9d;" id="totalWins">0</div>
        </div>
      </div>
      <button class="main-btn" style="background:#e74c3c; color:white; margin-top:15px;" onclick="logout()">LOGOUT</button>
    </div>
  </div>

</div>

<!-- BOTTOM NAVIGATION BAR -->
<nav class="bottom-nav">
  <button class="nav-item active" onclick="switchBottomNav('home')">
    <i class="fa-solid fa-house" style="font-size:16px;"></i>
    <span>Home</span>
  </button>
  <button class="nav-center-btn" onclick="openAddMatch()">
    <i class="fa-solid fa-plus"></i>
  </button>
  <button class="nav-item" onclick="switchBottomNav('me')">
    <i class="fa-solid fa-user" style="font-size:16px;"></i>
    <span>Me</span>
  </button>
</nav>

<script>
const SUPABASE_URL = "https://eyrwqmirdigsckcwbmxn.supabase.co";
const SUPABASE_KEY = "sb_publishable_N2bFvVebY84Ac4kF7KPYjw_1YCdUUHX";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;

function switchBottomNav(tab) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  if(tab === 'home') {
    document.getElementById('homeSection').classList.remove('hidden');
    document.getElementById('profileAuthSection').classList.add('hidden');
    event.currentTarget.classList.add('active');
    loadTournaments();
  } else if(tab === 'me') {
    document.getElementById('homeSection').classList.add('hidden');
    document.getElementById('profileAuthSection').classList.remove('hidden');
    event.currentTarget.classList.add('active');
  }
}

function openAddMatch() {
  alert("Match create karne ke liye admin panel open karein.");
}

async function loadTournaments() {
  const { data, error } = await supabaseClient
    .from('tournaments')
    .select('*')
    .eq('status', 'upcoming')
    .order('match_date', { ascending: true });

  const grid = document.getElementById('tournamentsGrid');
  grid.innerHTML = '';

  if(!data || data.length === 0) {
    grid.innerHTML = `<div style="grid-column: span 2; text-align:center; padding:20px; color:#8aa0ae;">No active tournaments.</div>`;
    return;
  }

  data.forEach(t => {
    grid.innerHTML += `
      <div class="t-card">
        <div class="t-thumb">
          <i class="fa-solid fa-gamepad"></i>
          <span class="whatsapp-tag">${escapeHTML(t.mode)}</span>
        </div>
        <div class="t-body">
          <div class="t-title">${escapeHTML(t.title)}</div>
          <div class="t-cat"><i class="fa-solid fa-map"></i> ${escapeHTML(t.map)}</div>
          <div class="t-footer">
            <span>👥 ${t.joined_players}/${t.max_players}</span>
            <span style="color:#00ff9d; font-weight:bold;">Rs.${t.prize_pool}</span>
          </div>
        </div>
      </div>
    `;
  });
}

async function signup() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if(!email || !password) { alert("Email aur password enter karein"); return; }
  const { error } = await supabaseClient.auth.signUp({ email, password });
  if(error) { alert(error.message); return; }
  alert("Account created successfully!");
}

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(error) { alert(error.message); return; }
  currentUser = data.user;
  checkAuthSession();
}

async function checkAuthSession() {
  const { data } = await supabaseClient.auth.getSession();
  if(data.session) {
    currentUser = data.session.user;
    document.getElementById('loginCard').classList.add('hidden');
    document.getElementById('userCard').classList.remove('hidden');

    const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
    if(profile) {
      document.getElementById('profileName').textContent = profile.username || "FF Player";
      document.getElementById('profileUid').textContent = profile.free_fire_uid || "Not Added";
      document.getElementById('walletBal').textContent = Number(profile.wallet_balance || 0).toFixed(2);
      document.getElementById('totalWins').textContent = profile.total_wins || 0;
      document.getElementById('dashUsername').textContent = profile.username || "☆Mr ᝰ Nadeem.ff ᝰ";
      document.getElementById('dashUid').textContent = profile.free_fire_uid || "3239454397";
    }
  }
}

async function logout() {
  await supabaseClient.auth.signOut();
  location.reload();
}

function escapeHTML(value) {
  return String(value ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

loadTournaments();
checkAuthSession();
</script>

</body>
</html>
