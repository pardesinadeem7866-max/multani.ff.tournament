<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multani FF Official Tournament</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif;}
body{background:#030712;color:white;min-height:100vh;padding-bottom:90px;display:flex;justify-content:center;}
.phone-frame{width:100%;max-width:420px;min-height:100vh;background:#091216;position:relative;box-shadow:0 0 30px rgba(0,243,255,0.15);overflow-x:hidden;}

/* Header */
.top-header{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;background:#0d1b22;border-bottom:1px solid #162935;position:sticky;top:0;z-index:100;}
.logo-area{display:flex;align-items:center;gap:8px;font-weight:bold;font-size:14px;color:#00ff9d;}
.logo-icon{background:#00d084;color:#030712;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;}
.header-wallet{background:#14222b;border:1px solid #00d084;padding:4px 10px;border-radius:12px;font-size:11px;color:#00ff9d;font-weight:bold;}
.header-icons{display:flex;gap:6px;}
.icon-btn{background:#14222b;border:1px solid #1e3340;color:#a3e4d7;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;}

.container{padding:15px;}

/* Cards & Banners */
.featured-card{background:linear-gradient(135deg, #0d1b22 0%, #112836 100%);border:1px solid #1a3848;border-radius:18px;padding:15px;margin-bottom:15px;box-shadow:0 4px 15px rgba(0,0,0,0.5);}
.badge-featured{background:#00d084;color:#091216;font-size:10px;font-weight:bold;padding:3px 8px;border-radius:6px;display:inline-block;margin-bottom:10px;}
.profile-info{text-align:center;}
.avatar-circle{width:55px;height:55px;border-radius:50%;border:2px solid #00ff9d;margin:0 auto 8px auto;background:#1b3644;display:flex;align-items:center;justify-content:center;font-size:22px;}
.profile-name{font-size:15px;font-weight:bold;color:#fff;}
.profile-sub{font-size:12px;color:#00ff9d;margin-top:2px;}

.action-buttons-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px;}
.action-card-btn{background:#0d1b22;border:1px solid #00d084;padding:12px;border-radius:14px;text-align:center;color:#00ff9d;font-size:12px;font-weight:bold;cursor:pointer;}

.grid-tournaments{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.t-card{background:#0d1b22;border:1px solid #162935;border-radius:16px;overflow:hidden;}
.t-thumb{height:100px;background:linear-gradient(135deg, #14222b, #1b3644);position:relative;display:flex;align-items:center;justify-content:center;color:#00ff9d;font-size:26px;border-bottom:1px solid #162935;}
.whatsapp-tag{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.7);color:#00ff9d;font-size:9px;padding:2px 6px;border-radius:6px;border:1px solid #00d084;}
.t-body{padding:10px;}
.t-title{font-size:13px;font-weight:bold;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.t-cat{font-size:10px;color:#8aa0ae;margin-top:3px;}
.t-footer{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:10px;color:#8aa0ae;}
.join-match-btn{width:100%;margin-top:8px;background:#00d084;color:#091216;border:none;padding:6px;border-radius:8px;font-weight:bold;font-size:11px;cursor:pointer;}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;width:100%;max-width:420px;background:#0d1b22;border-top:1px solid #162935;display:flex;justify-content:space-around;align-items:center;padding:10px 0;z-index:100;}
.nav-item{background:transparent;border:none;color:#8aa0ae;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;cursor:pointer;}
.nav-item.active{color:#00ff9d;}
.nav-center-btn{background:#00d084;color:#091216;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;border:none;margin-top:-15px;cursor:pointer;}

.card{background:#0d1b22;border:1px solid #162935;border-radius:18px;padding:20px;margin-bottom:15px;}
.hidden{display:none;}
input, select{width:100%;padding:12px;margin:6px 0;background:#14222b;border:1px solid #1e3340;border-radius:10px;color:white;font-size:14px;outline:none;}
button.main-btn{width:100%;padding:12px;margin-top:10px;background:#00d084;color:#091216;font-weight:bold;border:none;border-radius:10px;cursor:pointer;}
.blue-btn{background:#1b4f72 !important;color:white !important;}
</style>
</head>
<body>

<div class="phone-frame">
  <!-- Top Header -->
  <header class="top-header">
    <div class="logo-area">
      <div class="logo-icon"><i class="fa-solid fa-fire"></i></div>
      <span>Multani FF</span>
    </div>
    <div class="header-wallet">Rs. <span id="topWalletBal">0</span></div>
    <div class="header-icons">
      <div class="icon-btn" onclick="shareApp()"><i class="fa-solid fa-share-nodes"></i></div>
      <div class="icon-btn" onclick="openSettings()"><i class="fa-solid fa-gear"></i></div>
    </div>
  </header>

  <div class="container">
    <!-- Home Section -->
    <div id="homeSection">
      <div class="featured-card">
        <span class="badge-featured">🔥 OFFICIAL TOURNAMENT</span>
        <div class="profile-info">
          <div class="avatar-circle"><i class="fa-solid fa-trophy" style="color:#00ff9d;"></i></div>
          <div class="profile-name" id="dashUsername">☆Mr ᝰ Nadeem.ff ᝰ</div>
          <div class="profile-sub">🔥 Multani FF Official ©</div>
          <div style="font-size:11px; color:#a3e4d7; margin-top:4px;">Free Fire UID: <span id="dashUid">3239454397</span></div>
        </div>
      </div>

      <div class="action-buttons-grid">
        <div class="action-card-btn" onclick="openAddBalance()"><i class="fa-solid fa-wallet fa-lg"></i><br>💰 Add Balance</div>
        <div class="action-card-btn" style="border-color:#3498db; color:#5dade2;" onclick="contactAdmin()"><i class="fa-solid fa-headset fa-lg"></i><br>💬 Admin Support</div>
      </div>

      <div style="font-size:14px; font-weight:bold; margin-bottom:10px; color:#fff;"><i class="fa-solid fa-layer-group" style="color:#00ff9d;"></i> Active Tournaments</div>
      <div id="tournamentsGrid" class="grid-tournaments"></div>
    </div>

    <!-- Auth / Profile Section -->
    <div id="profileAuthSection" class="hidden">
      <div class="card" id="loginCard">
        <h2>🔐 Login / Signup</h2>
        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <button class="main-btn" onclick="signup()">CREATE ACCOUNT</button>
        <button class="main-btn blue-btn" onclick="login()">LOGIN</button>
      </div>

      <div class="card hidden" id="userCard">
        <h2>👤 My Profile</h2>
        <p style="margin-top:10px;">Username: <b id="profileName" style="color:#00ff9d;">-</b></p>
        <p style="margin-top:5px;">UID: <b id="profileUid" style="color:#00ff9d;">-</b></p>
        <div style="display:flex; gap:10px; margin-top:15px;">
          <div style="flex:1; background:#14222b; padding:12px; border-radius:12px; text-align:center;">💰 Wallet <div style="font-size:18px; font-weight:bold; color:#00ff9d;" id="walletBal">0</div></div>
          <div style="flex:1; background:#14222b; padding:12px; border-radius:12px; text-align:center;">🏆 Wins <div style="font-size:18px; font-weight:bold; color:#00ff9d;" id="totalWins">0</div></div>
        </div>
        <button class="main-btn" onclick="openAddBalance()" style="background:#f39c12; color:white; margin-top:10px;">💰 Add Balance Request & Screenshot</button>
        <button class="main-btn" style="background:#e74c3c; color:white; margin-top:15px;" onclick="logout()">LOGOUT</button>
      </div>
    </div>

    <!-- Match Details Section -->
    <div id="matchSection" class="hidden">
      <div class="card">
        <button class="main-btn blue-btn" onclick="backToHome()" style="margin-bottom:15px;">← BACK</button>
        <h2 id="matchTitle" style="color:#00ff9d;"></h2>
        <div style="margin:8px 0;">🎮 Mode: <b id="matchMode"></b></div>
        <div style="margin:8px 0;">🗺️ Map: <b id="matchMap"></b></div>
        <div style="margin:8px 0;">💰 Entry Fee: <b>Rs. <span id="matchFee"></span></b></div>
        <div style="margin:8px 0;">🏆 Prize Pool: <b>Rs. <span id="matchPrize"></span></b></div>
        <button class="main-btn" onclick="joinCurrentTournament()" style="margin-top:20px;">🎮 JOIN TOURNAMENT NOW</button>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchBottomNav('home', event)"><i class="fa-solid fa-house" style="font-size:16px;"></i><span>Home</span></button>
    <button class="nav-center-btn" onclick="openAddBalance()"><i class="fa-solid fa-plus"></i></button>
    <button class="nav-item" onclick="switchBottomNav('me', event)"><i class="fa-solid fa-user" style="font-size:16px;"></i><span>Me</span></button>
  </nav>
</div>

<script>
const SUPABASE_URL = "https://eyrwqmirdigsckcwbmxn.supabase.co";
const SUPABASE_KEY = "sb_publishable_N2bFvVebY84Ac4kF7KPYjw_1YCdUUHX";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let selectedTournamentId = null;

function switchBottomNav(tab, evt) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  if(tab === 'home') {
    document.getElementById('homeSection').classList.remove('hidden');
    document.getElementById('profileAuthSection').classList.add('hidden');
    document.getElementById('matchSection').classList.add('hidden');
    if(evt) evt.currentTarget.classList.add('active');
    loadTournaments();
  } else if(tab === 'me') {
    document.getElementById('homeSection').classList.add('hidden');
    document.getElementById('profileAuthSection').classList.remove('hidden');
    document.getElementById('matchSection').classList.add('hidden');
    if(evt) evt.currentTarget.classList.add('active');
  }
}

function shareApp() { alert("Website link copied!"); }
function openSettings() { alert("Settings: Multani FF Tournament v1.0"); }

async function openAddBalance() {
  let amt = prompt("Kitna balance add karna hai? (Amount enter karein):", "500");
  if(amt) {
    if(!currentUser) { alert("Pehle login karein!"); return; }
    // Send payment request/proof to admin database
    const { error } = await supabaseClient.from('payments').insert([
      { user_id: currentUser.id, amount: parseFloat(amt), status: 'pending', created_at: new Date() }
    ]);
    if(error) { alert("Error: " + error.message); return; }
    alert("Balance request submitted! Admin approval ke baad wallet mein add ho jayega.");
  }
}

function contactAdmin() {
  window.open(`https://wa.me/?text=${encodeURIComponent("Hello Admin, I need help with Multani FF.")}`, '_blank');
}

async function loadTournaments() {
  const { data, error } = await supabaseClient.from('tournaments').select('*').order('match_date', { ascending: true });
  const grid = document.getElementById('tournamentsGrid');
  grid.innerHTML = '';
  if(!data || data.length === 0) {
    grid.innerHTML = `<div style="grid-column: span 2; text-align:center; padding:20px; color:#8aa0ae;">No active tournaments.</div>`;
    return;
  }
  data.forEach(t => {
    grid.innerHTML += `
      <div class="t-card">
        <div class="t-thumb"><i class="fa-solid fa-gamepad"></i><span class="whatsapp-tag">${t.mode || 'Solo'}</span></div>
        <div class="t-body">
          <div class="t-title">${t.title}</div>
          <div class="t-cat"><i class="fa-solid fa-map"></i> ${t.map || 'Bermuda'}</div>
          <div class="t-footer"><span>👥 ${t.max_players || 48}</span><span style="color:#00ff9d; font-weight:bold;">Rs.${t.prize_pool}</span></div>
          <button class="join-match-btn" onclick="openMatchDetails('${t.id}', '${t.title}', '${t.mode}', '${t.map}', ${t.entry_fee || 0}, ${t.prize_pool})">VIEW / JOIN</button>
        </div>
      </div>
    `;
  });
}

function openMatchDetails(id, title, mode, map, fee, prize) {
  selectedTournamentId = id;
  document.getElementById('matchTitle').textContent = title;
  document.getElementById('matchMode').textContent = mode;
  document.getElementById('matchMap').textContent = map;
  document.getElementById('matchFee').textContent = fee;
  document.getElementById('matchPrize').textContent = prize;
  document.getElementById('homeSection').classList.add('hidden');
  document.getElementById('profileAuthSection').classList.add('hidden');
  document.getElementById('matchSection').classList.remove('hidden');
}

function backToHome() {
  document.getElementById('matchSection').classList.add('hidden');
  document.getElementById('homeSection').classList.remove('hidden');
  loadTournaments();
}

async function joinCurrentTournament() {
  if(!currentUser) { alert("Pehle Login karein!"); switchBottomNav('me'); return; }
  alert("Tournament successfully joined!");
  backToHome();
}

async function signup() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const { error } = await supabaseClient.auth.signUp({ email, password });
  if(error) { alert(error.message); return; }
  alert("Account created successfully!");
}

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(error) { alert(error.message); return; }
  currentUser = data.user;
  checkAuthSession();
}

async function checkAuthSession() {
  const { data } = await supabaseClient.auth.getSession();
  if(data.session) {
    currentUser = data.session.user;
    document.getElementById('loginCard').classList.add('hidden');
    document.getElementById('userCard').classList.remove('hidden');
  }
}

async function logout() {
  await supabaseClient.auth.signOut();
  location.reload();
}

loadTournaments();
checkAuthSession();
</script>
</body>
</html>
