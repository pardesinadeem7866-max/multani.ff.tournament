<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multani FF Official Tournament</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#080014;
 color:white;
}

header{
 padding:18px;
 text-align:center;
 background:#12002b;
 border-bottom:1px solid #8a2be2;
}

h1{
 margin:0;
 color:#b84dff;
}

.container{
 max-width:900px;
 margin:auto;
 padding:20px;
}

.card{
 background:#140020;
 border:1px solid #7d2cff;
 border-radius:16px;
 padding:18px;
 margin:15px 0;
 box-shadow:0 0 18px #5b00a8;
}

input{
 width:100%;
 padding:13px;
 margin:7px 0;
 border-radius:9px;
 border:1px solid #7d2cff;
 background:#09000f;
 color:white;
}

button{
 width:100%;
 padding:13px;
 margin-top:8px;
 border:0;
 border-radius:10px;
 background:#8a2be2;
 color:white;
 font-weight:bold;
 cursor:pointer;
}

button:hover{
 background:#a94cff;
}

.hidden{
 display:none;
}

.stats{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}

.stat{
 padding:15px;
 background:#0d0018;
 border-radius:10px;
 text-align:center;
}

.small{
 color:#aaa;
 font-size:13px;
}

.tournament-btn{
 background:#8a2be2;
}

.danger{
 background:#d00050;
}
</style>
</head>

<body>

<header>
<h1>🔥 MULTANI FF</h1>
<div>OFFICIAL TOURNAMENT</div>
</header>

<div class="container">

<!-- AUTH -->
<div id="authBox" class="card">

<h2>🔐 Login / Signup</h2>

<input
 id="email"
 type="email"
 placeholder="Email">

<input
 id="password"
 type="password"
 placeholder="Password">

<button onclick="login()">
LOGIN
</button>

<button onclick="signup()">
CREATE ACCOUNT
</button>

<p id="authMsg" class="small"></p>

</div>


<!-- APP -->
<div id="app" class="hidden">

<!-- PROFILE -->
<div class="card">

<h2>👤 My Profile</h2>

<p>
<b id="username">Loading...</b>
</p>

<p id="uid">
UID: -
</p>

<div class="stats">

<div class="stat">
💰 Wallet
<br>
<b id="wallet">
Rs. 0.00
</b>
</div>

<div class="stat">
🏆 Wins
<br>
<b id="wins">
0
</b>
</div>

</div>

<button
class="danger"
onclick="logout()">
LOGOUT
</button>

</div>


<!-- TOURNAMENTS -->
<h2>🏆 Tournaments</h2>

<div id="tournaments">
Loading tournaments...
</div>

</div>

</div>


<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =========================
   SUPABASE CONFIG
========================= */

const SUPABASE_URL =
"https://eyrwqmirdigsckcwbmxn.supabase.co";

const SUPABASE_KEY =
"sb_publishable_N2bFvVebY84Ac4kF7KPYjw_1YCdUUHX";

const supabase =
createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* =========================
   AUTH MESSAGE
========================= */

function authMsg(text){

 document.getElementById(
   "authMsg"
 ).textContent = text;

}


/* =========================
   SIGNUP
========================= */

window.signup = async function(){

 const email =
 document.getElementById(
   "email"
 ).value.trim();

 const password =
 document.getElementById(
   "password"
 ).value;

 if(!email || !password){

   authMsg(
     "Email aur password enter karo."
   );

   return;
 }

 if(password.length < 6){

   authMsg(
     "Password kam az kam 6 characters ka ho."
   );

   return;
 }


 const { data, error } =
 await supabase.auth.signUp({
   email,
   password
 });


 if(error){

   authMsg(error.message);

   return;
 }


 if(data.session){

   authMsg(
     "Account create ho gaya."
   );

   await loadApp();

 }else{

   authMsg(
     "Account create ho gaya. Email verification check karo."
   );

 }

};


/* =========================
   LOGIN
========================= */

window.login = async function(){

 const email =
 document.getElementById(
   "email"
 ).value.trim();

 const password =
 document.getElementById(
   "password"
 ).value;


 if(!email || !password){

   authMsg(
     "Email aur password enter karo."
   );

   return;
 }


 const { error } =
 await supabase.auth.signInWithPassword({
   email,
   password
 });


 if(error){

   authMsg(error.message);

   return;
 }


 authMsg("");

 await loadApp();

};


/* =========================
   LOGOUT
========================= */

window.logout = async function(){

 await supabase.auth.signOut();

 document
 .getElementById("app")
 .classList.add("hidden");

 document
 .getElementById("authBox")
 .classList.remove("hidden");

};


/* =========================
   LOAD APP
========================= */

async function loadApp(){

 const {
   data:{session}
 } =
 await supabase.auth.getSession();


 if(!session){

   document
   .getElementById("app")
   .classList.add("hidden");

   document
   .getElementById("authBox")
   .classList.remove("hidden");

   return;
 }


 document
 .getElementById("authBox")
 .classList.add("hidden");

 document
 .getElementById("app")
 .classList.remove("hidden");


 await loadProfile();

 await loadTournaments();

}


/* =========================
   PROFILE
========================= */

async function loadProfile(){

 const {
   data:{session}
 } =
 await supabase.auth.getSession();


 if(!session){
   return;
 }


 const {data,error} =
 await supabase
 .from("profiles")
 .select(`
   username,
   free_fire_uid,
   free_fire_name,
   wallet_balance,
   total_wins
 `)
 .eq("id",session.user.id)
 .single();


 if(error){

   console.log(
     "Profile error:",
     error
   );

   return;
 }


 document.getElementById(
   "username"
 ).textContent =
 data.username || "Player";


 document.getElementById(
   "uid"
 ).textContent =
 "UID: " +
 (data.free_fire_uid || "-");


 document.getElementById(
   "wallet"
 ).textContent =
 "Rs. " +
 Number(
   data.wallet_balance || 0
 ).toFixed(2);


 document.getElementById(
   "wins"
 ).textContent =
 data.total_wins || 0;

}


/* =========================
   TOURNAMENTS
========================= */

async function loadTournaments(){

 const {
   data,
   error
 } =
 await supabase
 .from("tournaments")
 .select(`
   id,
   title,
   game,
   mode,
   map,
   entry_fee,
   prize_pool,
   max_players,
   joined_players,
   match_date,
   status
 `)
 .order(
   "created_at",
   {ascending:false}
 );


 const box =
 document.getElementById(
   "tournaments"
 );


 if(error){

   box.innerHTML =
   `<div class="card">
     ❌ ${escapeHTML(error.message)}
   </div>`;

   return;
 }


 if(!data || data.length === 0){

   box.innerHTML =
   `<div class="card">
     No tournaments available.
   </div>`;

   return;
 }


 box.innerHTML = "";


 data.forEach(t => {

   const card =
   document.createElement("div");

   card.className =
   "card";


   const matchDate =
   t.match_date
   ? new Date(
       t.match_date
     ).toLocaleString()
   : "-";


   const isFull =
   Number(t.joined_players || 0)
   >=
   Number(t.max_players || 0);


   card.innerHTML = `

   <h2>
     🏆 ${escapeHTML(t.title)}
   </h2>

   <p>
     🎮 ${escapeHTML(
       t.game || "Free Fire"
     )}
   </p>

   <p>
     👥 Mode:
     ${escapeHTML(
       t.mode || "Squad"
     )}
   </p>

   <p>
     🗺️ Map:
     ${escapeHTML(
       t.map || "Bermuda"
     )}
   </p>

   <p>
     💰 Entry Fee:
     <b>
       Rs. ${Number(
         t.entry_fee || 0
       )}
     </b>
   </p>

   <p>
     🎁 Prize Pool:
     <b>
       Rs. ${Number(
         t.prize_pool || 0
       )}
     </b>
   </p>

   <p>
     👥 Players:
     ${Number(
       t.joined_players || 0
     )}/${Number(
       t.max_players || 0
     )}
   </p>

   <p>
     📅 ${matchDate}
   </p>

   <p>
     📌 Status:
     ${escapeHTML(
       t.status || "upcoming"
     )}
   </p>

   <button
     class="tournament-btn"
     ${isFull ? "disabled" : ""}
     onclick="joinTournament('${t.id}')">

     ${isFull
       ? "TOURNAMENT FULL"
       : "JOIN TOURNAMENT"}

   </button>

   `;


   box.appendChild(card);

 });

}


/* =========================
   JOIN TOURNAMENT
========================= */

window.joinTournament =
async function(tournamentId){

 const {
   data:{session}
 } =
 await supabase.auth.getSession();


 if(!session){

   alert(
     "Pehle login karo."
   );

   return;
 }


 const {
   data:profile,
   error:profileError
 } =
 await supabase
 .from("profiles")
 .select(
   "free_fire_uid,free_fire_name"
 )
 .eq(
   "id",
   session.user.id
 )
 .single();


 if(profileError){

   alert(
     "Profile nahi mili."
   );

   return;
 }


 if(!profile.free_fire_uid){

   alert(
     "Pehle Free Fire UID profile mein add karo."
   );

   return;
 }


 const {
   data,
   error
 } =
 await supabase.rpc(
   "join_tournament",
   {
     p_tournament_id:
       tournamentId,

     p_free_fire_uid:
       profile.free_fire_uid,

     p_free_fire_name:
       profile.free_fire_name ||
       "Player",

     p_team_name:
       null
   }
 );


 if(error){

   alert(
     error.message
   );

   return;
 }


 if(data && data.success){

   alert(
     "🏆 Tournament successfully joined!"
   );


   await loadProfile();

   await loadTournaments();


 }else{

   alert(
     data?.message ||
     "Tournament join nahi ho saka."
   );

 }

};


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

 return String(value ?? "")
 .replaceAll(
   "&",
   "&amp;"
 )
 .replaceAll(
   "<",
   "&lt;"
 )
 .replaceAll(
   ">",
   "&gt;"
 )
 .replaceAll(
   '"',
   "&quot;"
 )
 .replaceAll(
   "'",
   "&#039;"
 );

}


/* =========================
   AUTH STATE
========================= */

supabase.auth.onAuthStateChange(
 async (_event,session)=>{

   if(session){

     await loadApp();

   }else{

     document
     .getElementById("app")
     .classList.add("hidden");

     document
     .getElementById("authBox")
     .classList.remove("hidden");

   }

 });


/* =========================
   START
========================= */

loadApp();

</script>

</body>
</html>
