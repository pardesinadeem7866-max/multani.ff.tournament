<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multani.ff - Arena Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #022013;
      --bg-gradient: radial-gradient(circle at 50% 0%, #08482c 0%, #032316 45%, #01130a 100%);
      --mint-primary: #00e676;
      --mint-accent: #2de28d;
      --mint-glass: rgba(0, 230, 118, 0.15);
      --card-white: #ffffff;
      --text-dark: #0a291b;
      --text-muted: #64748b;
      --gold: #ffb703;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #010d07; color: #f8fafc; display: flex; justify-content: center; min-height: 100vh; }

    .app-viewport {
      width: 100%;
      max-width: 440px;
      background: var(--bg-gradient);
      min-height: 100vh;
      padding-bottom: 96px;
      position: relative;
      border-left: 1px solid rgba(0, 230, 118, 0.2);
      border-right: 1px solid rgba(0, 230, 118, 0.2);
      box-shadow: 0 0 50px rgba(0,0,0,0.9);
      overflow-x: hidden;
    }

    /* Top Bar */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(2, 32, 19, 0.9);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .profile-avatar-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 230, 118, 0.2);
      border: 1px solid var(--mint-accent);
      padding: 4px 10px 4px 5px;
      border-radius: 20px;
      cursor: pointer;
    }
    .avatar-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--mint-primary), #004d40);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 900;
      color: #fff;
    }
    .badge-name { font-size: 11px; font-weight: 800; color: #fff; max-width: 75px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .nav-tabs { display: flex; gap: 14px; font-size: 15px; font-weight: 800; }
    .nav-tab-item { color: rgba(255,255,255,0.6); cursor: pointer; position: relative; }
    .nav-tab-item.active { color: #fff; }
    .nav-tab-item.active::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 3px;
      background: var(--mint-primary);
      border-radius: 2px;
    }
    .top-search-btn { font-size: 17px; color: var(--mint-primary); cursor: pointer; }

    /* Top Hero Card (Image Banner Style) */
    .hero-banner-container { padding: 12px 16px; }
    .hero-glass-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 14px;
      padding: 12px 14px;
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      color: var(--text-dark);
    }
    .mine-ribbon {
      position: absolute;
      top: 0;
      left: 0;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #fff;
      font-size: 8px;
      font-weight: 900;
      padding: 3px 12px;
      border-bottom-right-radius: 8px;
      border-top-left-radius: 14px;
      letter-spacing: 0.5px;
    }
    .hero-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #022013;
      border: 2px solid var(--mint-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--mint-primary);
      font-size: 20px;
      flex-shrink: 0;
    }
    .hero-details { flex: 1; margin-top: 4px; }
    .hero-title-row { display: flex; align-items: center; justify-content: space-between; font-weight: 900; font-size: 13px; }
    .hero-subtitle { font-size: 11px; color: #475569; margin-top: 2px; }
    .easypaisa-tag {
      display: inline-block;
      margin-top: 5px;
      background: #e8f5e9;
      color: #1b5e20;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
      border: 1px solid #a5d6a7;
    }

    /* Mint Pill Filter Track */
    .filter-track {
      margin: 4px 16px 14px;
      background: rgba(0, 48, 25, 0.6);
      padding: 4px;
      border-radius: 26px;
      display: flex;
      justify-content: space-between;
      border: 1px solid rgba(0, 230, 118, 0.2);
    }
    .filter-item {
      flex: 1;
      text-align: center;
      padding: 8px 4px;
      font-size: 11px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.25s ease;
    }
    .filter-item.active {
      background: linear-gradient(135deg, var(--mint-primary), #00b0ff);
      color: #012817;
      font-weight: 900;
      box-shadow: 0 3px 10px rgba(0, 230, 118, 0.4);
    }

    /* 2-Column Grid (From Screenshot) */
    .grid-container {
      padding: 0 16px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .tournament-grid-card {
      background: #ffffff;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
      cursor: pointer;
      position: relative;
      transition: transform 0.2s;
    }
    .tournament-grid-card:active { transform: scale(0.98); }
    .card-thumb-wrap {
      position: relative;
      width: 100%;
      height: 125px;
      background: #0d1e15;
    }
    .card-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .thumb-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.7));
    }
    .card-live-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.55);
      border-radius: 12px;
      padding: 2px 7px;
      font-size: 9px;
      font-weight: 800;
      color: #00f0ff;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .card-thumb-text {
      position: absolute;
      bottom: 6px;
      left: 8px;
      right: 8px;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .card-body {
      padding: 9px 8px;
      background: #ffffff;
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .card-room-title {
      font-size: 12px;
      font-weight: 900;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-room-desc {
      font-size: 10px;
      color: #64748b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-footer-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      padding-top: 4px;
      border-top: 1px dashed #e2e8f0;
      font-size: 10px;
      font-weight: 800;
    }
    .fee-badge { color: #059669; }
    .prize-badge { color: #d97706; }

    /* Bottom Navigation Bar (4-item round styled) */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 440px;
      height: 70px;
      background: rgba(1, 22, 12, 0.95);
      backdrop-filter: blur(15px);
      border-top: 1px solid rgba(0, 230, 118, 0.25);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }
    .bot-item {
      background: transparent;
      border: none;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      position: relative;
    }
    .bot-item.active { color: var(--mint-primary); }
    .bot-icon-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .bot-item.active .bot-icon-circle {
      background: linear-gradient(135deg, var(--mint-primary), #00796b);
      color: #fff;
      border-color: var(--mint-accent);
      box-shadow: 0 0 10px rgba(0, 230, 118, 0.5);
    }
    .bot-item span { font-size: 10px; font-weight: 800; }
    .bot-badge-bubble {
      position: absolute;
      top: -2px;
      right: -2px;
      background: #ef4444;
      color: #fff;
      font-size: 9px;
      font-weight: 900;
      min-width: 16px;
      height: 16px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #012213;
    }

    /* Modals */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-dialog {
      background: #071f14;
      border: 1px solid rgba(0, 230, 118, 0.3);
      width: 100%;
      max-width: 380px;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-title { font-size: 15px; font-weight: 900; color: #fff; margin-bottom: 14px; display: flex; justify-content: space-between; }
    .form-ctrl { margin-bottom: 12px; }
    .form-ctrl label { font-size: 11px; font-weight: 700; color: #a7f3d0; display: block; margin-bottom: 4px; }
    .form-ctrl input {
      width: 100%;
      background: #02110a;
      border: 1px solid rgba(0, 230, 118, 0.2);
      border-radius: 10px;
      padding: 10px 12px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .form-ctrl input:focus { border-color: var(--mint-primary); }
    .btn-green-action {
      width: 100%;
      background: linear-gradient(135deg, var(--mint-primary), #00b0ff);
      border: none;
      color: #012817;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn-modal-close {
      width: 100%;
      background: transparent;
      border: none;
      color: #64748b;
      padding: 8px;
      cursor: pointer;
      font-size: 11px;
      margin-top: 4px;
    }
    .preview-box { width: 100%; max-height: 140px; object-fit: contain; border-radius: 8px; border: 1px dashed var(--mint-primary); margin-top: 8px; display: none; }

    /* Support Chat */
    .chat-history-box {
      background: #02110a;
      border: 1px solid rgba(0, 230, 118, 0.2);
      border-radius: 14px;
      padding: 12px;
      height: 260px;
      overflow-y: auto;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chat-bubble-user {
      background: #113622;
      border: 1px solid rgba(0, 230, 118, 0.3);
      border-radius: 14px 14px 2px 14px;
      padding: 8px 12px;
      align-self: flex-end;
      max-width: 82%;
      font-size: 12px;
      color: #fff;
    }
    .chat-bubble-admin {
      background: rgba(0, 230, 118, 0.15);
      border: 1px solid var(--mint-primary);
      border-radius: 14px 14px 14px 2px;
      padding: 8px 12px;
      align-self: flex-start;
      max-width: 82%;
      font-size: 12px;
      color: #fff;
    }
    .chat-input-row { display: flex; gap: 8px; align-items: center; }
    .chat-input-row input {
      flex: 1;
      background: #02110a;
      border: 1px solid rgba(0, 230, 118, 0.2);
      border-radius: 20px;
      padding: 9px 14px;
      color: #fff;
      font-size: 12px;
      outline: none;
    }
    .chat-send-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--mint-primary);
      border: none;
      color: #012817;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    
    <!-- Top Bar with Image Style Tabs -->
    <div class="top-header">
      <div class="profile-avatar-badge" onclick="openLoginModal()">
        <div class="avatar-circle"><i class="fa-solid fa-gamepad"></i></div>
        <span class="badge-name" id="navUserBadge">LOGIN</span>
      </div>

      <div class="nav-tabs">
        <span class="nav-tab-item">Explore</span>
        <span class="nav-tab-item">Hot</span>
        <span class="nav-tab-item active">My</span>
      </div>

      <div class="top-search-btn" onclick="openLoginModal()">
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>
    </div>

    <!-- Top White Room/Owner Banner (Screenshot style) -->
    <div class="hero-banner-container">
      <div class="hero-glass-card">
        <div class="mine-ribbon">Mine</div>
        <div class="hero-avatar"><i class="fa-solid fa-crown"></i></div>
        <div class="hero-details">
          <div class="hero-title-row">
            <span><i class="fa-brands fa-whatsapp" style="color:#25d366;"></i> Multani Official</span>
            <span style="font-size: 10px; color:#00b0ff;"><i class="fa-solid fa-signal"></i> LIVE</span>
          </div>
          <div class="hero-subtitle">💖 Prince & Princess Esports Arena 🔥</div>
          <div class="easypaisa-tag">EasyPaisa: 03186815926 (Nadeem)</div>
        </div>
      </div>
    </div>

    <!-- Mint Pill Filter Segment -->
    <div class="filter-track">
      <div class="filter-item active" onclick="setMapFilter('All', this)">Recently</div>
      <div class="filter-item" onclick="setMapFilter('Bermuda', this)">Bermuda</div>
      <div class="filter-item" onclick="setMapFilter('Purgatory', this)">Purgatory</div>
      <div class="filter-item" onclick="setMapFilter('Clash Squad', this)">CS Battle</div>
    </div>

    <!-- 2-Column Vertical Match Cards (Screenshot Layout) -->
    <div class="grid-container" id="matchesContainer"></div>

    <!-- Bottom Navigation Bar (Events, Battle, Chat, Social) -->
    <div class="bottom-bar">
      <button class="bot-item" onclick="openEventsAlert()">
        <div class="bot-icon-circle">
          <i class="fa-solid fa-gift" style="color:#ff4625;"></i>
        </div>
        <span class="bot-badge-bubble">6</span>
        <span>Events</span>
      </button>

      <button class="bot-item active" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
        <div class="bot-icon-circle">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <span>Battle</span>
      </button>

      <button class="bot-item" onclick="openSupportModal()">
        <div class="bot-icon-circle">
          <i class="fa-solid fa-comments" style="color:var(--mint-primary);"></i>
        </div>
        <span class="bot-badge-bubble" id="supportNotifyDot" style="display:none;">1</span>
        <span>Chat</span>
      </button>

      <button class="bot-item" onclick="openLoginModal()">
        <div class="bot-icon-circle">
          <i class="fa-solid fa-users" style="color:#ffd000;"></i>
        </div>
        <span class="bot-badge-bubble">1</span>
        <span>Profile</span>
      </button>
    </div>

  </div>

  <!-- Player Profile Modal -->
  <div class="modal-backdrop" id="loginModal">
    <div class="modal-dialog">
      <div class="modal-title">
        <span>🎮 Player Profile Setup</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeModal('loginModal')"></i>
      </div>
      <div class="form-ctrl">
        <label>Game Nickname</label>
        <input type="text" id="logName" placeholder="e.g. MANDOOR_FF">
      </div>
      <div class="form-ctrl">
        <label>Free Fire UID</label>
        <input type="number" id="logUid" placeholder="e.g. 3239454397">
      </div>
      <div class="form-ctrl">
        <label>WhatsApp Number</label>
        <input type="text" id="logPhone" placeholder="03XXXXXXXXX">
      </div>
      <button class="btn-green-action" onclick="saveLogin()">Save Profile</button>
      <button class="btn-modal-close" onclick="closeModal('loginModal')">Cancel</button>
    </div>
  </div>

  <!-- Tournament Action / Fee Screenshot Modal -->
  <div class="modal-backdrop" id="joinModal">
    <div class="modal-dialog">
      <div class="modal-title">
        <span id="modalMatchName">Join Battle</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeModal('joinModal')"></i>
      </div>
      
      <div id="roomCredsContainer" style="margin-bottom: 12px; display: none;"></div>

      <div id="paymentFormBlock">
        <p style="font-size: 11px; color: #a7f3d0; margin-bottom: 10px;">
          EasyPaisa par fee send karke screenshot upload karein:
        </p>
        <div class="form-ctrl">
          <label>EasyPaisa Account</label>
          <input type="text" value="03186815926 (Nadeem)" readonly style="color:var(--mint-primary); font-weight: bold;">
        </div>
        <div class="form-ctrl">
          <label>Payment Screenshot</label>
          <input type="file" id="ssInput" accept="image/*" onchange="previewScreenshot(event)">
          <img id="ssPreview" class="preview-box" alt="Payment Proof">
        </div>
        <button class="btn-green-action" id="submitProofBtn" onclick="submitJoinWithSS()">Submit Proof</button>
      </div>

      <button class="btn-modal-close" onclick="closeModal('joinModal')">Close</button>
    </div>
  </div>

  <!-- Support Chat Modal -->
  <div class="modal-backdrop" id="supportModal">
    <div class="modal-dialog">
      <div class="modal-title">
        <span><i class="fa-solid fa-comments" style="color:var(--mint-primary); margin-right:6px;"></i>Help / Owner Chat</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeModal('supportModal')"></i>
      </div>
      <div class="chat-history-box" id="playerChatHistory"></div>
      <div class="chat-input-row">
        <input type="text" id="suppMsg" placeholder="Type message..." onkeypress="handleChatEnter(event)">
        <button class="chat-send-btn" onclick="submitSupportMessage()"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
      <button class="btn-modal-close" onclick="closeModal('supportModal')">Close</button>
    </div>
  </div>

  <script>
    const matchThumbnails = [
      "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=400&q=80",
      "https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=400&q=80",
      "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?auto=format&fit=crop&w=400&q=80",
      "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=400&q=80"
    ];

    const defaultMatches = [
      {
        id: "m_1",
        title: "Khali Kamra 💥",
        subtitle: "Alhamdulillah For Everything...",
        map: "Bermuda",
        rules: "Gun Attributes OFF | Solo Only",
        time: "09:30 PM",
        fee: 50,
        prize: 400,
        totalSlots: 12,
        roomId: "",
        roomPass: "",
        players: [{ name: "☆Mr Nadeem", uid: "3239454397", status: "approved" }]
      },
      {
        id: "m_2",
        title: "BIG BOSS 👑",
        subtitle: "Welcome to the room. All welcome",
        map: "Purgatory",
        rules: "Standard Rules | Squad",
        time: "10:30 PM",
        fee: 100,
        prize: 800,
        totalSlots: 48,
        roomId: "",
        roomPass: "",
        players: []
      },
      {
        id: "m_3",
        title: "Europe Cafe 🖤",
        subtitle: "Hey beautiful people You j...",
        map: "Clash Squad",
        rules: "Unlimited Ammo | CS 4v4",
        time: "11:00 PM",
        fee: 60,
        prize: 500,
        totalSlots: 8,
        roomId: "",
        roomPass: "",
        players: []
      },
      {
        id: "m_4",
        title: "BLACK WOR 🔥",
        subtitle: "We all members Rules apply",
        map: "Bermuda",
        rules: "Duo Battle | Bermuda",
        time: "Tomorrow",
        fee: 80,
        prize: 600,
        totalSlots: 24,
        roomId: "",
        roomPass: "",
        players: []
      }
    ];

    let tournaments = JSON.parse(localStorage.getItem('mff_tournaments')) || defaultMatches;
    let currentUser = JSON.parse(localStorage.getItem('mff_user')) || null;
    let selectedMatchId = null;
    let uploadedScreenshotBase64 = "";
    let activeFilter = "All";

    function setMapFilter(mapName, btn) {
      document.querySelectorAll('.filter-item').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = mapName;
      renderMatches();
    }

    function renderMatches() {
      tournaments = JSON.parse(localStorage.getItem('mff_tournaments')) || defaultMatches;
      const container = document.getElementById('matchesContainer');
      container.innerHTML = "";

      const filtered = activeFilter === "All" 
        ? tournaments 
        : tournaments.filter(m => (m.map || "Bermuda").toLowerCase().includes(activeFilter.toLowerCase()));

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="grid-column: span 2; text-align:center; padding: 40px 10px; color:#a7f3d0; font-size:12px;">
            <i class="fa-solid fa-gamepad" style="font-size:24px; color:var(--mint-primary); margin-bottom:8px; display:block;"></i>
            Is Map par koi match available nahi hai.
          </div>`;
        return;
      }

      filtered.forEach((m, idx) => {
        const approvedPlayers = (m.players || []).filter(p => p.status === "approved");
        const joinedCount = approvedPlayers.length;
        const thumbUrl = matchThumbnails[idx % matchThumbnails.length];

        let statusText = "Tap to Join";
        let userRecord = currentUser ? (m.players || []).find(p => p.uid === currentUser.uid) : null;
        if (userRecord) {
          statusText = userRecord.status === "approved" ? "✔ CONFIRMED" : "⌛ PENDING";
        } else if (joinedCount >= m.totalSlots) {
          statusText = "FULL";
        }

        const card = document.createElement('div');
        card.className = "tournament-grid-card";
        card.onclick = () => handleCardClick(m.id);
        card.innerHTML = `
          <div class="card-thumb-wrap">
            <img class="card-thumb" src="${thumbUrl}" alt="Match Image">
            <div class="thumb-overlay"></div>
            <div class="card-live-badge"><i class="fa-solid fa-signal"></i> ${joinedCount}/${m.totalSlots}</div>
            <div class="card-thumb-text"><i class="fa-solid fa-clock"></i> ${m.time} | ${m.map}</div>
          </div>
          <div class="card-body">
            <div class="card-room-title">
              <span>🇵🇰</span>
              <span>${m.title}</span>
            </div>
            <div class="card-room-desc">${m.subtitle || m.rules}</div>
            <div class="card-footer-info">
              <span class="fee-badge">Fee: Rs.${m.fee}</span>
              <span class="prize-badge">Win: Rs.${m.prize}</span>
            </div>
            <div style="font-size:9px; font-weight:800; color:${userRecord?.status === 'approved' ? '#059669' : '#0284c7'}; margin-top:2px; text-align:right;">
              ${statusText}
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      checkAdminReplies();
    }

    function handleCardClick(matchId) {
      if (!currentUser) {
        alert("Pehle apna Profile / UID set karein!");
        openLoginModal();
        return;
      }

      selectedMatchId = matchId;
      const match = tournaments.find(m => m.id === matchId);
      if (!match) return;

      document.getElementById('modalMatchName').innerText = match.title;
      const credsBox = document.getElementById('roomCredsContainer');
      const formBlock = document.getElementById('paymentFormBlock');
      const userRecord = (match.players || []).find(p => p.uid === currentUser.uid);

      if (userRecord && userRecord.status === "approved") {
        formBlock.style.display = "none";
        credsBox.style.display = "block";
        if (match.roomId && match.roomPass) {
          credsBox.innerHTML = `
            <div style="background:#022a18; border:1px solid var(--mint-primary); border-radius:10px; padding:12px; font-size:12px;">
              <b style="color:var(--mint-primary); display:block; margin-bottom:6px;">ROOM DETAILS UNLOCKED</b>
              <div>Room ID: <b style="color:#00f0ff;">${match.roomId}</b></div>
              <div>Password: <b style="color:#ffd000;">${match.roomPass}</b></div>
            </div>`;
        } else {
          credsBox.innerHTML = `
            <div style="background:#022a18; border:1px solid #ffd000; border-radius:10px; padding:12px; font-size:12px; color:#ffd000;">
              Slot confirm hai! Match start hone se 15 minute pehle Admin yahan ID Pass dalega.
            </div>`;
        }
      } else if (userRecord && userRecord.status === "pending") {
        formBlock.style.display = "none";
        credsBox.style.display = "block";
        credsBox.innerHTML = `
          <div style="background:#022a18; border:1px solid #ffd000; border-radius:10px; padding:12px; font-size:12px; color:#ffd000;">
            Aapka proof pending hai. Admin check karte hi slot confirm kar dega.
          </div>`;
      } else {
        credsBox.style.display = "none";
        formBlock.style.display = "block";
        uploadedScreenshotBase64 = "";
        document.getElementById('ssInput').value = "";
        document.getElementById('ssPreview').style.display = "none";
      }

      document.getElementById('joinModal').style.display = "flex";
    }

    function updateNavProfile() {
      if (currentUser) {
        document.getElementById('navUserBadge').innerText = currentUser.name;
      } else {
        document.getElementById('navUserBadge').innerText = "LOGIN";
      }
    }

    function openLoginModal() {
      if (currentUser) {
        document.getElementById('logName').value = currentUser.name || "";
        document.getElementById('logUid').value = currentUser.uid || "";
        document.getElementById('logPhone').value = currentUser.phone || "";
      }
      document.getElementById('loginModal').style.display = "flex";
    }

    function saveLogin() {
      const name = document.getElementById('logName').value.trim();
      const uid = document.getElementById('logUid').value.trim();
      const phone = document.getElementById('logPhone').value.trim();

      if (!name || !uid || !phone) {
        alert("Tamam details bharna lazmi hain!");
        return;
      }

      const bans = JSON.parse(localStorage.getItem('mff_banned_uids')) || [];
      if (bans.includes(uid)) {
        alert("Yeh UID blacklist/ban hai!");
        return;
      }

      currentUser = { name, uid, phone };
      localStorage.setItem('mff_user', JSON.stringify(currentUser));
      updateNavProfile();
      closeModal('loginModal');
      renderMatches();
    }

    function previewScreenshot(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          uploadedScreenshotBase64 = evt.target.result;
          const preview = document.getElementById('ssPreview');
          preview.src = evt.target.result;
          preview.style.display = "block";
        };
        reader.readAsDataURL(file);
      }
    }

    function submitJoinWithSS() {
      if (!uploadedScreenshotBase64) {
        alert("Payment screenshot select karein!");
        return;
      }

      let allTournaments = JSON.parse(localStorage.getItem('mff_tournaments')) || defaultMatches;
      const match = allTournaments.find(m => m.id === selectedMatchId);
      if (!match) return;

      if (!match.players) match.players = [];

      match.players.push({
        name: currentUser.name,
        uid: currentUser.uid,
        phone: currentUser.phone,
        screenshot: uploadedScreenshotBase64,
        status: "pending",
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });

      localStorage.setItem('mff_tournaments', JSON.stringify(allTournaments));
      closeModal('joinModal');
      renderMatches();
      alert("Screenshot submit ho gaya hai! Admin verify karega.");
    }

    function openSupportModal() {
      renderPlayerChatHistory();
      document.getElementById('supportModal').style.display = "flex";
      setTimeout(() => {
        const historyBox = document.getElementById('playerChatHistory');
        historyBox.scrollTop = historyBox.scrollHeight;
      }, 100);
    }

    function renderPlayerChatHistory() {
      const historyBox = document.getElementById('playerChatHistory');
      let supportMsgs = JSON.parse(localStorage.getItem('mff_support_msgs')) || [];

      let userMsgs = currentUser 
        ? supportMsgs.filter(m => (m.uid === currentUser.uid || m.contact.includes(currentUser.uid) || m.name === currentUser.name))
        : supportMsgs;

      userMsgs.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

      if (userMsgs.length === 0) {
        historyBox.innerHTML = `<div style="color:#64748b; font-size:11px; text-align:center; margin:auto;">Owner se chat karne ke liye message type karein.</div>`;
        return;
      }

      historyBox.innerHTML = "";
      userMsgs.forEach(msg => {
        const uBubble = document.createElement('div');
        uBubble.className = "chat-bubble-user";
        uBubble.innerHTML = `<div>${msg.message}</div><span style="font-size:9px; color:#94a3b8; display:block; text-align:right;">${msg.time || ''}</span>`;
        historyBox.appendChild(uBubble);

        if (msg.adminReply) {
          const aBubble = document.createElement('div');
          aBubble.className = "chat-bubble-admin";
          aBubble.innerHTML = `<div style="font-size:10px; font-weight:800; color:var(--mint-primary); margin-bottom:3px;"><i class="fa-solid fa-crown"></i> Owner Reply</div><div>${msg.adminReply}</div>`;
          historyBox.appendChild(aBubble);
        }
      });
      historyBox.scrollTop = historyBox.scrollHeight;
    }

    function handleChatEnter(e) {
      if (e.key === 'Enter') submitSupportMessage();
    }

    function submitSupportMessage() {
      const input = document.getElementById('suppMsg');
      const msg = input.value.trim();
      if (!msg) return;

      if (!currentUser) {
        alert("Pehle login karein!");
        closeModal('supportModal');
        openLoginModal();
        return;
      }

      let supportMsgs = JSON.parse(localStorage.getItem('mff_support_msgs')) || [];
      supportMsgs.push({
        id: "msg_" + Date.now(),
        timestamp: Date.now(),
        uid: currentUser.uid,
        name: currentUser.name,
        contact: `UID: ${currentUser.uid} (${currentUser.phone})`,
        message: msg,
        adminReply: "",
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });

      localStorage.setItem('mff_support_msgs', JSON.stringify(supportMsgs));
      input.value = "";
      renderPlayerChatHistory();
      checkAdminReplies();
    }

    function checkAdminReplies() {
      const supportMsgs = JSON.parse(localStorage.getItem('mff_support_msgs')) || [];
      const dot = document.getElementById('supportNotifyDot');
      if (!currentUser) {
        dot.style.display = 'none';
        return;
      }
      const hasReply = supportMsgs.some(m => 
        (m.uid === currentUser.uid || m.contact.includes(currentUser.uid) || m.name === currentUser.name) && m.adminReply
      );
      dot.style.display = hasReply ? 'flex' : 'none';
    }

    function openEventsAlert() {
      alert("Multani.ff Weekly Event: Top 3 Fraggers ko 1000 Diamonds ka Giveaway!");
    }

    function closeModal(id) {
      document.getElementById(id).style.display = "none";
    }

    window.onload = function() {
      updateNavProfile();
      renderMatches();
    };
  </script>
</body>
</html>
