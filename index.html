<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multani.ff Esports Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #06090e; color: #ffffff; display: flex; justify-content: center; min-height: 100vh; }
    .app-container { width: 100%; max-width: 430px; background: #0b1019; min-height: 100vh; padding-bottom: 90px; position: relative; border-left: 1px solid #162032; border-right: 1px solid #162032; }

    /* Top Navbar */
    .top-navbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #080d15; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #162032; }
    .brand-logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; }
    .brand-logo i, .brand-logo span { color: #10b981; }
    .user-pill { background: #141d2c; border: 1px solid #1f2d44; padding: 6px 12px; border-radius: 20px; font-size: 11px; display: flex; align-items: center; gap: 6px; cursor: pointer; }

    /* Hero Banner */
    .featured-section { padding: 12px 16px; }
    .featured-card { background: linear-gradient(180deg, rgba(16, 185, 129, 0.12) 0%, rgba(11, 16, 25, 0.95) 100%), #121927; border: 1px solid #1f2d44; border-radius: 16px; padding: 14px; text-align: center; position: relative; }
    .featured-badge { position: absolute; top: 10px; left: 10px; background: #ef4444; color: #fff; font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 12px; }
    .profile-circle { width: 55px; height: 55px; border-radius: 50%; border: 2px solid #10b981; margin: 4px auto 8px; display: flex; align-items: center; justify-content: center; background: #080d15; color: #10b981; font-size: 22px; }
    .player-title { font-size: 16px; font-weight: 800; display: flex; justify-content: center; align-items: center; gap: 6px; }
    .clan-title { color: #f59e0b; font-size: 13px; font-weight: 700; }
    .org-easypaisa { font-size: 12px; margin-top: 6px; color: #94a3b8; background: #080d15; display: inline-block; padding: 5px 12px; border-radius: 12px; border: 1px dashed #10b981; }
    .org-easypaisa strong { color: #10b981; }

    /* Matches List */
    .section-title { padding: 10px 16px 6px; font-size: 14px; font-weight: 700; color: #94a3b8; display: flex; justify-content: space-between; align-items: center; }
    .matches-list { padding: 0 16px; display: flex; flex-direction: column; gap: 14px; }
    .match-card { background: #101724; border: 1px solid #1a2538; border-radius: 14px; padding: 14px; position: relative; }
    .match-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #172132; padding-bottom: 8px; }
    .match-tag { font-size: 10px; font-weight: 800; background: rgba(239, 68, 68, 0.2); color: #ef4444; padding: 3px 8px; border-radius: 6px; }
    .match-details { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .detail-box { background: #0a0f18; padding: 8px 10px; border-radius: 8px; }
    .detail-box span { font-size: 10px; color: #64748b; display: block; }
    .detail-box strong { font-size: 13px; color: #fff; }
    .detail-box strong.prize { color: #10b981; }

    /* Slots Progress */
    .slot-bar-wrap { margin-bottom: 12px; }
    .slot-bar-text { display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; margin-bottom: 4px; font-weight: 600; }
    .slot-bar { width: 100%; height: 6px; background: #080d15; border-radius: 10px; overflow: hidden; }
    .slot-bar-fill { height: 100%; background: #10b981; width: 0%; transition: width 0.3s ease; }

    /* Approved Players */
    .joined-players-box { background: #080d15; border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; font-size: 11px; }
    .joined-players-title { color: #94a3b8; margin-bottom: 6px; font-weight: 700; display: flex; justify-content: space-between; }
    .player-chips { display: flex; flex-wrap: wrap; gap: 5px; max-height: 70px; overflow-y: auto; }
    .player-chip { background: #141d2c; padding: 3px 8px; border-radius: 6px; font-size: 10px; color: #cbd5e1; border: 1px solid #1f2d44; }

    /* Action Buttons */
    .btn-action { width: 100%; font-weight: 800; border: none; padding: 11px; border-radius: 10px; font-size: 13px; cursor: pointer; text-align: center; display: block; }
    .btn-join { background: #10b981; color: #06090e; }
    .btn-pending { background: #f59e0b; color: #06090e; cursor: default; }
    .btn-approved { background: #141d2c; color: #10b981; border: 1px solid #10b981; cursor: default; }
    .btn-full { background: #1e293b; color: #64748b; cursor: not-allowed; }

    /* Bottom Bar */
    .bottom-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; background: #080d15; border-top: 1px solid #162032; display: flex; justify-content: space-around; align-items: center; padding: 10px 0; z-index: 200; }
    .tab-btn { background: none; border: none; color: #64748b; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; cursor: pointer; }
    .tab-btn.active { color: #10b981; }

    /* Modals */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999; justify-content: center; align-items: center; padding: 20px; }
    .modal-box { background: #101724; border: 1px solid #1a2538; width: 100%; max-width: 380px; border-radius: 16px; padding: 18px; max-height: 90vh; overflow-y: auto; }
    .modal-box h3 { color: #10b981; margin-bottom: 14px; font-size: 16px; }
    .form-group { margin-bottom: 11px; }
    .form-group label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
    .form-group input { width: 100%; background: #080d15; border: 1px solid #1a2538; padding: 9px 12px; border-radius: 8px; color: #fff; font-size: 13px; }
    .btn-submit { width: 100%; background: #10b981; color: #06090e; border: none; padding: 11px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 8px; font-size: 13px; }
    .btn-cancel { width: 100%; background: transparent; color: #94a3b8; border: none; padding: 8px; cursor: pointer; font-size: 12px; }
    .preview-img { width: 100%; max-height: 150px; object-fit: contain; margin-top: 8px; border-radius: 8px; display: none; border: 1px solid #1f2d44; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="top-navbar">
      <div class="brand-logo"><i class="fa-solid fa-gamepad"></i><span>Multani.ff</span></div>
      <div class="user-pill" onclick="openLoginModal()">
        <i class="fa-solid fa-user-astronaut" style="color:#10b981;"></i>
        <span id="navUserName">Login UID</span>
      </div>
    </div>

    <div class="featured-section">
      <div class="featured-card">
        <div class="featured-badge">OFFICIAL TOURNAMENTS</div>
        <div class="profile-circle"><i class="fa-solid fa-crosshairs"></i></div>
        <div class="player-title"><span>☆Mr 💫 Nadeem.ff</span><i class="fa-solid fa-circle-check" style="color:#10b981;"></i></div>
        <div class="clan-title">꧁Multani.ff Official꧂</div>
        <div class="org-easypaisa">EasyPaisa: <strong>03186815926</strong></div>
      </div>
    </div>

    <div class="section-title">
      <span>ACTIVE TOURNAMENTS</span>
      <span style="font-size: 11px; color:#10b981;" id="matchCounter">0 Matches</span>
    </div>

    <div class="matches-list" id="matchesContainer"></div>

    <div class="bottom-bar">
      <button class="tab-btn active"><i class="fa-solid fa-house"></i>Home</button>
      <button class="tab-btn" onclick="openLoginModal()"><i class="fa-solid fa-id-card"></i>My Profile</button>
      <a href="https://wa.me/923186815926" class="tab-btn" target="_blank"><i class="fa-brands fa-whatsapp"></i>Help Support</a>
    </div>
  </div>

  <!-- Player Login Modal -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-box">
      <h3>🎮 Player Account</h3>
      <div class="form-group">
        <label>Game Nickname</label>
        <input type="text" id="logName" placeholder="e.g. MANDOOR_FF">
      </div>
      <div class="form-group">
        <label>Free Fire UID</label>
        <input type="number" id="logUid" placeholder="e.g. 3239454397">
      </div>
      <div class="form-group">
        <label>EasyPaisa / JazzCash Number</label>
        <input type="text" id="logPhone" placeholder="03XXXXXXXXX">
      </div>
      <button class="btn-submit" onclick="saveLogin()">Save Profile</button>
      <button class="btn-cancel" onclick="closeModal('loginModal')">Cancel</button>
    </div>
  </div>

  <!-- Screenshot Upload & Join Modal -->
  <div class="modal-overlay" id="joinModal">
    <div class="modal-box">
      <h3>📸 Submit Payment Proof</h3>
      <p style="font-size: 12px; color: #94a3b8; margin-bottom: 12px;">
        براہ کرم ایزی پیسہ پر فیس ٹرانسفر کر کے اسکرین شاٹ منتخب کریں۔ ایڈمن تصدیق کے بعد آپ کا سلاٹ کنفرم کرے گا۔
      </p>
      <div class="form-group">
        <label>ایزی پیسہ نمبر:</label>
        <input type="text" value="03186815926 (Nadeem)" readonly style="color:#10b981; font-weight:bold;">
      </div>
      <div class="form-group">
        <label>پیمنٹ اسکرین شاٹ اپلوڈ کریں:</label>
        <input type="file" id="ssInput" accept="image/*" onchange="previewScreenshot(event)">
        <img id="ssPreview" class="preview-img" alt="SS Preview">
      </div>
      <button class="btn-submit" onclick="submitJoinWithSS()">Submit for Approval</button>
      <button class="btn-cancel" onclick="closeModal('joinModal')">Cancel</button>
    </div>
  </div>

  <script>
    const defaultMatches = [
      {
        id: "m_1",
        title: "MATCH #1 (SOLO CLASH)",
        time: "DAILY 8:00 PM",
        fee: 50,
        prize: 400,
        totalSlots: 10,
        rules: "Solo - All Guns",
        players: [
          { name: "☆Mr Nadeem", uid: "3239454397", status: "approved" }
        ]
      }
    ];

    let tournaments = JSON.parse(localStorage.getItem('mff_tournaments')) || defaultMatches;
    let currentUser = JSON.parse(localStorage.getItem('mff_user')) || null;
    let selectedMatchId = null;
    let uploadedScreenshotBase64 = "";

    function renderMatches() {
      const container = document.getElementById('matchesContainer');
      container.innerHTML = "";
      document.getElementById('matchCounter').innerText = `${tournaments.length} Matches`;

      tournaments.forEach(m => {
        // Only count approved players for public slots
        const approvedPlayers = m.players.filter(p => p.status === "approved");
        const joinedCount = approvedPlayers.length;
        const percent = Math.min(100, Math.round((joinedCount / m.totalSlots) * 100));

        let userRecord = currentUser ? m.players.find(p => p.uid === currentUser.uid) : null;

        let playersListHtml = "";
        if (approvedPlayers.length === 0) {
          playersListHtml = `<span style="color:#64748b;">No confirmed players yet.</span>`;
        } else {
          approvedPlayers.forEach(p => {
            playersListHtml += `<span class="player-chip"><i class="fa-solid fa-user-check"></i> ${p.name}</span>`;
          });
        }

        let actionBtnHtml = "";
        if (!userRecord) {
          if (joinedCount >= m.totalSlots) {
            actionBtnHtml = `<button class="btn-action btn-full">SLOTS FULL</button>`;
          } else {
            actionBtnHtml = `<button class="btn-action btn-join" onclick="initiateJoin('${m.id}')">JOIN NOW (Rs. ${m.fee})</button>`;
          }
        } else if (userRecord.status === "pending") {
          actionBtnHtml = `<button class="btn-action btn-pending"><i class="fa-solid fa-clock"></i> APPROVAL PENDING...</button>`;
        } else if (userRecord.status === "approved") {
          actionBtnHtml = `<button class="btn-action btn-approved"><i class="fa-solid fa-circle-check"></i> JOIN CONFIRMED ✔</button>`;
        }

        const card = document.createElement('div');
        card.className = "match-card";
        card.innerHTML = `
          <div class="match-header">
            <span style="font-weight:800; font-size:13px;">${m.title}</span>
            <span class="match-tag">${m.time}</span>
          </div>

          <div class="match-details">
            <div class="detail-box"><span>ENTRY FEE</span><strong>Rs. ${m.fee}</strong></div>
            <div class="detail-box"><span>BOOYAH PRIZE</span><strong class="prize">Rs. ${m.prize}</strong></div>
            <div class="detail-box"><span>FORMAT</span><strong>Slots: ${m.totalSlots}</strong></div>
            <div class="detail-box"><span>RULES</span><strong>${m.rules}</strong></div>
          </div>

          <div class="slot-bar-wrap">
            <div class="slot-bar-text">
              <span>Confirmed Players</span>
              <span>${joinedCount} / ${m.totalSlots}</span>
            </div>
            <div class="slot-bar">
              <div class="slot-bar-fill" style="width: ${percent}%;"></div>
            </div>
          </div>

          <div class="joined-players-box">
            <div class="joined-players-title">
              <span>CONFIRMED PLAYERS (${joinedCount})</span>
              <i class="fa-solid fa-shield" style="color:#10b981;"></i>
            </div>
            <div class="player-chips">${playersListHtml}</div>
          </div>

          ${actionBtnHtml}
        `;
        container.appendChild(card);
      });
    }

    function updateNavProfile() {
      if (currentUser) {
        document.getElementById('navUserName').innerText = currentUser.name;
      } else {
        document.getElementById('navUserName').innerText = "Login UID";
      }
    }

    function openLoginModal() {
      if (currentUser) {
        document.getElementById('logName').value = currentUser.name;
        document.getElementById('logUid').value = currentUser.uid;
        document.getElementById('logPhone').value = currentUser.phone;
      }
      document.getElementById('loginModal').style.display = "flex";
    }

    function saveLogin() {
      const name = document.getElementById('logName').value.trim();
      const uid = document.getElementById('logUid').value.trim();
      const phone = document.getElementById('logPhone').value.trim();

      if (!name || !uid || !phone) {
        alert("تمام خانے پر کرنا لازمی ہیں!");
        return;
      }

      currentUser = { name, uid, phone };
      localStorage.setItem('mff_user', JSON.stringify(currentUser));
      updateNavProfile();
      closeModal('loginModal');
      renderMatches();
      alert(`ویلکم ${name}! پروفائل محفوظ ہو گئی۔`);
    }

    function initiateJoin(matchId) {
      if (!currentUser) {
        alert("ٹورنامنٹ جوائن کرنے کے لیے پہلے لاگ ان کریں!");
        openLoginModal();
        return;
      }
      selectedMatchId = matchId;
      uploadedScreenshotBase64 = "";
      document.getElementById('ssInput').value = "";
      document.getElementById('ssPreview').style.display = "none";
      document.getElementById('joinModal').style.display = "flex";
    }

    function previewScreenshot(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          uploadedScreenshotBase64 = evt.target.result;
          const preview = document.getElementById('ssPreview');
          preview.src = evt.target.result;
          preview.style.display = "block";
        };
        reader.readAsDataURL(file);
      }
    }

    function submitJoinWithSS() {
      if (!uploadedScreenshotBase64) {
        alert("براہ کرم پیمنٹ کا اسکرین شاٹ اپلوڈ کریں!");
        return;
      }

      const match = tournaments.find(m => m.id === selectedMatchId);
      if (!match) return;

      // Add to match with 'pending' status
      match.players.push({
        name: currentUser.name,
        uid: currentUser.uid,
        phone: currentUser.phone,
        screenshot: uploadedScreenshotBase64,
        status: "pending",
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });

      localStorage.setItem('mff_tournaments', JSON.stringify(tournaments));
      closeModal('joinModal');
      renderMatches();
      alert("آپ کی درخواست اور اسکرین شاٹ ایڈمن پینل پر بھیج دی گئی ہے! ایڈمن کے Approve کرتے ہی آپ کا سلاٹ کنفرم ہو جائے گا۔");
    }

    function closeModal(id) {
      document.getElementById(id).style.display = "none";
    }

    window.onload = function() {
      updateNavProfile();
      renderMatches();
    };
  </script>
</body>
</html>
